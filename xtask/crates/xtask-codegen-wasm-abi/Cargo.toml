# xtask-codegen-wasm-abi — extract the backend's wasm/component-model byte table (`wasm_abi.rs`) from the
# `wasm-encoder` crate, as its OWN minimal-dep crate (v-xtask-decompose: the codegen→build-time-nix
# directive). Carved out of xtask/src/codegen.rs's `generate_wasm_abi` + its `wasm_abi` module. Pure data
# extraction — encodes a one-off value with `wasm-encoder` for each opcode/valtype/section/form byte and
# reads the emitted byte back (nothing hand-transcribed); NO compiler dep, NO cdz, NO runtime store, NO
# runtime hash. A `cdzWasmAbi` nix derivation runs this bin to EMIT rcdzc/src/backend/wasm/wasm_abi.rs at
# build time (a build-phase overlay copies it in), so nothing generated is committed.
[package]
name = "xtask-codegen-wasm-abi"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask-codegen-wasm-abi"
path = "src/main.rs"

[dependencies]
# The language's AST + binary codec — the codegen-sexpr producer reads wasm-abi.sexp's cadenza-ast BINARY
# (codec::decode + Arenas walk) to build the table (operator: sexpr is the source, via a cadenza-ast-binary
# derivation). No-json: cadenza-ast IS the codegen IR.
cadenza-ast = { path = "../../../implementation/seed/crates/cadenza-ast" }
# The spec byte encoder — now the cross-check ORACLE (the `--oracle-check` mode asserts each named op's
# wasm-encoder const matches the sexpr byte), inverted from the old extract-from-encoder. Same version family.
wasm-encoder = "0.239"
# The render stack: build the table as a token tree (`quote!`); the parse→prettyplease→rustfmt render tail
# (format_tokens + rustfmt_stdin) is shared via xtask-codegen-support (syn + prettyplease are its deps).
xtask-codegen-support = { path = "../xtask-codegen-support" }
quote = "1"
proc-macro2 = "1"
