# xtask — the ONE interface for driving the workspace.
#
# Deliberately minimal today: `build` builds the value-heap runtime component (cargo component,
# wasm32), content-addresses it (SHA-256, the recorded hashing choice), and stores it under the
# content-addressed store (<store>/<hash>.wasm). The runtime is derived first and keyed by its hash,
# which is what the host resolves a program's required runtime against (reproducible-derivation.md).
#
# `codegen` generates TWO tables the wasm backend consumes, both DERIVED from an authoritative oracle
# rather than hand-listed:
#   - `runtime_abi.rs` — the value-heap runtime's WIT (`wit-parser`): op name → core signature; the
#     compiler builds its per-program import section from that data, not opaque envelope blobs.
#   - `wasm_abi.rs` — every wasm/component-model byte the backend emits (opcodes, valtypes, section
#     ids, magic headers, functype form bytes), extracted from `wasm-encoder` (the spec byte encoder)
#     by encoding a one-off value and reading the byte back — so no magic number is hand-transcribed.
# `wit-parser` and `wasm-encoder` are DEV-DESK deps here in xtask only — never in the shipped compiler,
# whose generated tables are plain dep-free data.
[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The Rust-backend boundary-value render + descriptor-parse logic, shared with the `cdz run-rust`
# subcommand so the gate's `--target rust` render and the CLI's can't drift (extracted from xtask).
cdz-rust-render = { path = "../implementation/seed/crates/cdz-rust-render" }
# `codegen` reads the platform's built-in-contract SOURCES (`cdz-platform/contracts/*.cdz`) — real
# Cadenza. It VALIDATES and PARSES them by delegating to the `cdz` binary (`cdz test` runs the source's
# `@test` conformance proofs + typechecks; `cdz convert --to binary` yields the canonical AST), so xtask
# does NOT depend on the compiler. It uses only `cadenza-ast` — the LANGUAGE's value model + binary codec,
# the same crate `cdz-platform` itself depends on, NOT the compiler (rcdzc) — to decode that AST and
# re-project each contract's type declarations into `src/contracts/<name>.rs` as builder calls.
cadenza-ast = { path = "../implementation/seed/crates/cadenza-ast" }
# The mandate-lint, carved into its own minimal-dep crate (v-xtask-decompose). The monolith still runs
# it via `cargo xtask lint-mandates` by dispatching to `xtask_mandates::lint_mandates` (non-breaking);
# the crate itself deps only `syn`, so a nix check building just it doesn't rebuild xtask's world.
xtask-mandates = { path = "crates/xtask-mandates" }
# SHA-256 for the local build-cache tree-fingerprint (`hash_tree`), an internal cache key with no
# cross-boundary contract. The CONTENT-ADDRESS digest (`content_address`) is `cdz-contract` (below).
sha2 = "0.10"
# The platform's content-address primitive: `content_address` delegates to
# `Hash::of(HashTag::Blob, bytes).to_string()` (a Blob-tagged blake3 digest rendered base62, design §8),
# so the store address == blob key == compose-dep `+hash` == `REQUIRED_RUNTIME_HASH` are a single string
# across the fleet, byte-identical to `cdz-run`'s `content_address` and the store's own `put()`.
cdz-contract = { path = "../implementation/seed/crates/cdz-contract" }
# The fleet orchestrator (`fleet` subcommand) serializes its durable manifest + inbox messages as
# JSON. Dev-desk only, like the rest of xtask's deps — never enters the shipped compiler.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one argument parser for every workspace command — typed subcommands + generated `--help`,
# replacing the hand-rolled `args.get(N)` dispatch (no positional-by-index, no env-var knobs).
clap = { version = "4", features = ["derive"] }
# Ergonomic process/dir handling — `cmd!` runs a child in a pushed working dir and fails on a
# non-zero exit, replacing hand-rolled `std::process::Command` + status checks. The xtask
# ecosystem's own shell crate (matklad).
xshell = "0.2"
# Reads the value-heap runtime's `wit/runtime.wit` — the ABI's source of truth — so `codegen` DERIVES
# the runtime-op table (name + signature) rather than hand-listing it. Dev-desk only (never shipped).
wit-parser = "0.239"
# The AUTHORITATIVE wasm/component-model byte encoder — `codegen` extracts each opcode, valtype,
# section id, magic header, and functype form byte from it (encode a one-off value and read the byte
# back) so the wasm backend's `wasm_abi.rs` is DERIVED from the spec encoder rather than hand-listed.
# Same crate the rcdzc byte-identity oracle test uses; dev-desk only (the generated table is plain
# dep-free data, so `wasm-encoder` never enters the shipped compiler).
wasm-encoder = "0.239"
# Reads the RAW runtime build's `cdz-abi` custom section (by name, statically — no execution) so
# `codegen` DERIVES the ABI immediate encodings (the inline-unit handle bits) into `runtime_abi.rs`,
# letting the compiler push those constants instead of a runtime `arr-alloc(0)` call. Read BEFORE the
# `strip -a` that removes custom sections, so the constant costs zero shipped bytes. Same wasm-tools
# family as `wasm-encoder`/`wit-parser`; dev-desk only (the generated const is plain data).
wasmparser = "0.239"
# Formats generated Rust deterministically from a parsed syntax tree — `codegen` runs its output
# through this so the committed file is fmt-clean (agreeing with `fmt --check` and `codegen --check`).
# Preferred over shelling to `rustfmt`, which chokes on very long single lines. Dev-desk only.
prettyplease = "0.2"
syn = { version = "2", features = ["full", "parsing", "visit"] }
# Build the generated source as a token tree (`quote!`) rather than by string concatenation — reads
# like the Rust it emits, and needs no manual escaping. `prettyplease` pretty-prints the parsed result.
quote = "1"
proc-macro2 = "1"
