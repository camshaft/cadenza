# xtask — the ONE interface for driving the workspace.
#
# Deliberately minimal today: `build` builds the value-heap runtime component (cargo component,
# wasm32), content-addresses it (SHA-256, the recorded hashing choice), and stores it under the
# content-addressed store (<store>/<hash>.wasm). The runtime is derived first and keyed by its hash,
# which is what the host resolves a program's required runtime against (reproducible-derivation.md).
#
# `codegen` generates the runtime ABI table the wasm backend consumes, DERIVED from an authoritative
# oracle rather than hand-listed:
#   - `runtime_abi.rs` — the value-heap runtime's WIT (`wit-parser`): op name → core signature; the
#     compiler builds its per-program import section from that data, not opaque envelope blobs.
# `wit-parser` is a DEV-DESK dep here in xtask only — never in the shipped compiler, whose generated
# table is plain dep-free data. (The `wasm_abi.rs` byte table + the built-in contract schemas USED to be
# generated here too — from `wasm-encoder` + `cadenza-ast`/`cdz-contract` — but were carved out into the
# standalone `xtask-codegen-wasm-abi` / `xtask-codegen-contracts` bins + their nix derivations, the
# operator codegen→build-time-nix directive, so those deps left xtask with them.)
[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The Rust-backend boundary-value render + descriptor-parse logic, shared with the `cdz run-rust`
# subcommand so the gate's `--target rust` render and the CLI's can't drift (extracted from xtask).
cdz-rust-render = { path = "../implementation/seed/crates/cdz-rust-render" }
# `cadenza-ast` — the LANGUAGE's value model + binary codec (the crate `cdz-platform` depends on, NOT the
# compiler rcdzc). xtask does not `use` it in code anymore (the contract codegen that decoded ASTs with it
# moved to `xtask-codegen-contracts`); it stays because the `--target rust` gate passes the built
# `libcadenza_ast.rlib` to rustc via `--extern cadenza_ast=…` when an emitted program uses the native R2
# value codec, so xtask must dep it to guarantee the rlib is built alongside.
cadenza-ast = { path = "../implementation/seed/crates/cadenza-ast" }
# The canonical binary-AST → surface printer (`convert::render_binary`) — used by the value-doc gate path to
# decode a `CDZDOC:<hex>` driver stdout to its `(: value type)` s-expr, the SAME printer cdz-run + the corpus
# grader use (so the rust + wasm gates render byte-identically). ALREADY in xtask's closure (via
# `cdz-corpus-grade` → `cadenza-syntax`), so this direct dep adds nothing to the nix crate-closure.
cadenza-syntax = { path = "../implementation/seed/crates/cadenza-syntax" }
# The shared xtask foundation lib (v-xtask-decompose): content_address + hash_tree (build-cache
# fingerprint) live here now; it owns sha2 + cdz-contract (xtask reaches them through this, so xtask no
# longer deps cdz-contract directly). Per-command crates share it too.
xtask-support = { path = "crates/xtask-support" }
# TRANSIENT — REMOVE AT THE GATE-MACHINERY DELETE (seq-202, blocked on v-nix gateCheckNix). The in-process
# `gate --check` grader (main.rs `grade_trial`) was a hand-rolled MIRROR of `cdz_corpus_grade`; that mirror
# diverged from the shared grader and caused a fleet gate red (#7273). This dep lets the mirror's value-canon
# CALL the single-source `cdz_corpus_grade::canonical_output_value` (operator SLICE-1 structural value-compare)
# instead of drifting. When the gate-machinery delete lands (xtask stops grading in-process → calls the nix
# graders), this dep + the whole in-process grader go away — deliberately NOT permanent xtask bloat.
cdz-corpus-grade = { path = "../implementation/seed/crates/cdz-corpus-grade" }
# The fleet orchestrator (`fleet` subcommand) serializes its durable manifest + inbox messages as
# JSON. Dev-desk only, like the rest of xtask's deps — never enters the shipped compiler.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one argument parser for every workspace command — typed subcommands + generated `--help`,
# replacing the hand-rolled `args.get(N)` dispatch (no positional-by-index, no env-var knobs).
clap = { version = "4", features = ["derive"] }
# Ergonomic process/dir handling — `cmd!` runs a child in a pushed working dir and fails on a
# non-zero exit, replacing hand-rolled `std::process::Command` + status checks. The xtask
# ecosystem's own shell crate (matklad).
xshell = "0.2"
# Reads the value-heap runtime's `wit/runtime.wit` — the ABI's source of truth — so `codegen` DERIVES
# the runtime-op table (name + signature) rather than hand-listing it. Dev-desk only (never shipped).
wit-parser = "0.239"
# Reads the RAW runtime build's `cdz-abi` custom section (by name, statically — no execution) so
# `codegen` DERIVES the ABI immediate encodings (the inline-unit handle bits) into `runtime_abi.rs`,
# letting the compiler push those constants instead of a runtime `arr-alloc(0)` call. Read BEFORE the
# `strip -a` that removes custom sections, so the constant costs zero shipped bytes. Same wasm-tools
# family as `wasm-encoder`/`wit-parser`; dev-desk only (the generated const is plain data).
wasmparser = "0.239"
# Formats generated Rust deterministically from a parsed syntax tree — `codegen` runs its output
# through this so the committed file is fmt-clean (agreeing with `fmt --check` and `codegen --check`).
# Preferred over shelling to `rustfmt`, which chokes on very long single lines. Dev-desk only.
prettyplease = "0.2"
syn = { version = "2", features = ["full", "parsing", "visit"] }
# Build the generated source as a token tree (`quote!`) rather than by string concatenation — reads
# like the Rust it emits, and needs no manual escaping. `prettyplease` pretty-prints the parsed result.
quote = "1"
proc-macro2 = "1"
