'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# =============================================================================
# BOOTSTRAP-SUBSET gate — the seed-toolchain ignition subset.
#
# Same shape as config.toml, but the [[specification]] half lists ONLY the subset
# the seed toolchain must satisfy to clear the ignition bar in spec/bootstrap.md
# § "The Ignition Bar": derive one real Cadenza source program to a
# content-addressed component whose imports mirror its manifest, run it, and
# reproduce it byte-for-byte. That subset is the constitution, all frozen
# contracts, bootstrap.md, and the capability specs the seed compiler itself must
# satisfy to perform one real end-to-end derivation:
#
#     core-semantics             — evaluate the program's constructs
#     capabilities-and-effects   — the mandatory capability declaration (not the
#                                  opt-in effect layer, which is a later capability)
#     compiler-pipeline          — the phases and the two gates
#     conformance-gate           — the gate that judges the generation
#     self-hosting-and-bootstrap — the oracle, the derivation modes, the staging
#
# type-system is DEFERRED past the seed: the seed is a DYNAMIC interpreter
# (constitution VII bootstrap carve-out; learnings/2026-07-02-seed-is-a-dynamic-
# interpreter.md), so it carries no static-typing implementation to cite. The first
# generation derived AFTER the seed realizes static typing and adds type-system.md
# to ITS requirement subset. See options/realized-capability-set/.
#
# The richer capabilities' RFC-2119 REQUIREMENTS (memory-and-resource-model,
# numeric-model, modules-and-namespaces, metaprogramming, verification-layers,
# property-based-testing, diagnostics, tooling-and-lsp, agent-authoring,
# units-of-measure) are intentionally NOT in the ignition REQUIREMENT subset: the
# seed compiler need not carry an implementation-and-test CITATION for each of
# their sentences, so their requirement-gate coverage belongs to the
# full-regeneration gate in config.toml.
#
# NOTE — the two gates have different scopes, deliberately (conformance-gate.md):
# this file scopes only the REQUIREMENT gate (which sentences the seed must cite).
# The BEHAVIOR gate is NOT scoped here — it runs EVERY case in spec/semantics/*.sexp
# (compiler-pipeline.md §"The Corpus Is A Gate"), and the reference interpreter MUST
# implement exactly the behavior the corpus records (bootstrap.md §"The Interpreter
# Realizes The One Semantics"). Because the committed corpus already contains
# numeric-model and compound-type cases, the SEED evaluator must realize records,
# sum types, lists, maps, exact/rational/wrapping numerics, checked-overflow traps,
# and deterministic float — even though those capabilities' REQUIREMENTS are not in
# the citation subset above. "Not in the ignition requirement subset" means "not
# yet separately cited," not "not implemented by the seed."
#
# INVARIANT: every [[specification]] block here MUST also appear in config.toml —
# the ignition subset is a strict subset of the full set, never a superset.
#
# Run with:  duvet report --config-path .duvet/bootstrap.toml
# Source paths are relative to the PROJECT ROOT, not to .duvet/.
# =============================================================================

# Generated seed compiler lives under implementation/seed/ (gitignored); default is Rust.
# Scoped to the seed's own source; throwaway spikes under implementation/spikes/ are excluded.
[[source]]
pattern = "implementation/seed/src/**/*.rs"

# ---- ignition-subset requirement side ---------------------------------------

[[specification]]
source = "constitution.md"
format = "markdown"

# all frozen contracts are in the ignition subset
[[specification]]
source = "spec/contracts/ast-encoding.md"
format = "markdown"

[[specification]]
source = "spec/contracts/source-tree-encoding.md"
format = "markdown"

[[specification]]
source = "spec/contracts/component-abi.md"
format = "markdown"

[[specification]]
source = "spec/contracts/deterministic-value-form.md"
format = "markdown"

[[specification]]
source = "spec/contracts/host-interface-binding.md"
format = "markdown"

[[specification]]
source = "spec/contracts/determinism-and-fuel.md"
format = "markdown"

[[specification]]
source = "spec/contracts/reproducible-derivation.md"
format = "markdown"

[[specification]]
source = "spec/contracts/build-tool-interface.md"
format = "markdown"

# the ignition-set capabilities (seed-compiler-provided)
[[specification]]
source = "spec/capabilities/core-semantics.md"
format = "markdown"

# type-system.md is intentionally NOT in the seed's ignition subset — the seed is a
# dynamic interpreter (constitution VII bootstrap carve-out). It re-enters the
# requirement subset for the first generation that realizes static typing.

[[specification]]
source = "spec/capabilities/capabilities-and-effects.md"
format = "markdown"

[[specification]]
source = "spec/capabilities/compiler-pipeline.md"
format = "markdown"

[[specification]]
source = "spec/capabilities/conformance-gate.md"
format = "markdown"

[[specification]]
source = "spec/capabilities/self-hosting-and-bootstrap.md"
format = "markdown"

# bootstrap
[[specification]]
source = "spec/bootstrap.md"
format = "markdown"

[report.json]
enabled = true

[report.snapshot]
enabled = true
