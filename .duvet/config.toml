'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# =============================================================================
# Cadenza conformance gate — the requirement -> code/test coverage map.
#
# TWO HALVES, split by who owns them:
#
#   [[specification]]  — STABLE. Hand-owned. One block per NORMATIVE spec file.
#                        This is the requirement side: duvet extracts every
#                        RFC-2119 sentence from these files. `format = "markdown"`
#                        is REQUIRED (the default is IETF and extracts nothing
#                        from our prose). A requirement's identity is
#                        (spec file, section slug, quoted sentence) — there are
#                        no invented IDs; editing a sentence flags every stale
#                        citation as a hard error. Source paths are relative to
#                        the PROJECT ROOT (the parent of this .duvet/ directory).
#
#                        Only NORMATIVE files are listed. The descriptive files
#                        (overview, glossary, traceability, learnings/) carry no
#                        RFC-2119 requirements and are intentionally omitted. The
#                        executable-semantics corpus under spec/semantics/ is
#                        gated by EXECUTION (the behavior gate), not by extraction,
#                        and is likewise omitted here.
#
#   [[source]]         — REGENERATED per target language by the generation that
#                        synthesizes the compiler. This is the code side: the
#                        globs for whatever language a given regeneration targets.
#                        A regeneration rewrites ONLY these blocks; it never
#                        touches the [[specification]] half. The generated
#                        compiler lives under implementation/ (gitignored).
# =============================================================================

# ---- code side (regenerated per-language; the compiler lives here) ----------
# Match the seed compiler's Rust source FILES (not directories — a bare `**/*` matches
# directories too and duvet errors "Is a directory"). Throwaway de-risking spikes under
# implementation/spikes/ are excluded: they cite their own toy specs, not the spec tree.
[[source]]
pattern = "implementation/seed/src/**/*.rs"

# ---- requirement side (stable; one [[specification]] per normative spec) ----

