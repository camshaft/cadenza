# Seed toolchain workspace — the operator-synthesized generation 0 of Cadenza.
#
# DISPOSABLE PROJECTION of the specification (README.md, AGENTS.md): the spec tree is the
# durable artifact; this workspace is regenerable and gitignored.
#
# Two crates, split so the compiler core is pure and portable:
#   - cdz-compiler : the reference Cadenza→wasm-component COMPILER (cdz-rustc). Pure
#                    `ast_bytes → component_bytes`; NO wasmtime, NO filesystem. Compiles to
#                    wasm32 so it can itself be wrapped as a component exporting the same
#                    `compile : list<u8> -> list<u8>` ABI as the Cadenza-authored compiler.
#   - cadenza-seed : the native host/CLI. Runs finished components (wasmtime), reads the
#                    corpus, runs the gates. wasmtime + filesystem live ONLY here.
# (spec/learnings/2026-07-04-two-compilers-not-an-interpreter-and-a-compiler.md;
#  memory: cdz-rustc-pure-core-wasm-targetable)
[workspace]
resolver = "3"
# `cadenza-syntax` (the front-end library) is picked up automatically by the `crates/*` glob.
members = ["implementation/seed/crates/*", "xtask", "xtask/crates/*"]
# `cdz-runtime` (the wasm value-heap) and `cdz-wasm` (the browser-facing wasm-bindgen wrapper for the
# interactive guide) are STANDALONE workspaces of their own — excluded so the native seed build/gate
# never compiles a wasm-only crate. Both only ever build for wasm32-unknown-unknown.
#
# `cdz-smith` (the fuzzer) is excluded because its `bolero` dependency chain transitively pins
# `toml_datetime = "=0.6.3"` (via `proc-macro-crate 2.0.2`), which is incompatible with the
# `toml_edit` the `toml` surface uses (needs `toml_datetime >= 0.6.8`) — the two cannot co-resolve in
# one lockfile. cdz-smith is a leaf crate: nothing depends on it and neither xtask nor the gate drive
# it, so excluding it leaves the build/gate untouched; it still builds standalone (`cargo build` from
# its own dir) for a fuzzing run.
exclude = [
    "implementation/seed/crates/cdz-runtime",
    "implementation/seed/crates/cdz-wasm",
    "implementation/seed/crates/cdz-smith",
    # `cdz-cad` (the native CAD mesh driver, GH #400) is excluded because its mesh backend links
    # `manifold-csg`, whose `-sys` crate builds the C++ manifold3d library via cmake — a heavy C++/cmake
    # build the seed's `cargo build --workspace` and the corpus gate must never pay. It is a leaf crate
    # (nothing in the seed depends on it), built + tested on demand by a dedicated CI job. It builds
    # standalone (`cargo build`/`cargo test` from its own dir), with its own `[workspace]` table.
    "implementation/seed/crates/cdz-cad",
    # `rcdzc-wasm` (the Cadenza compiler as a WASM artifact, v-agent-runtime minimal-kernel K1-dep wasm-swap)
    # is excluded because it ONLY builds for a wasm target (`cargo build --target wasm32-wasip1 -p rcdzc-wasm`),
    # like cdz-runtime/cdz-wasm — the native seed `--workspace` build must never try to build a cdylib-for-wasm
    # crate. It path-deps the member `rcdzc` (an excluded crate may depend on a member, as cdz-smith does). Has
    # its own `[workspace]` table; a dedicated CI job builds it to wasm + runs its host-side glue tests.
    "implementation/seed/crates/rcdzc-wasm",
    # `cdz-nfc` (the Unicode NFC component, FINDING#23 — operator ruling d) is excluded because it ONLY
    # builds for wasm32-unknown-unknown (a cadenza:nfc component the emitted program imports by hash),
    # like cdz-runtime — the native seed `--workspace` build + corpus gate must never build a
    # cdylib-for-wasm crate. It carries the heavy `unicode-normalization` composition tables so the core
    # runtime does not. Leaf crate (nothing in the seed depends on it; the compiler emits an IMPORT on it,
    # not a build dep), own `[workspace]` table, built to wasm + published to CAS on demand.
    "implementation/seed/crates/cdz-nfc",
]

[profile.dev]
debug = false

# `release-debug` — dev's fast-to-build settings plus optimization. Used to build the pipeline tools
# for the corpus gate, where compiling+running ~900 cases through cdz-syntax→rcdzc→cdz-run is
# expensive enough that an unoptimized build dominates the wall clock. Inherits from dev (so it keeps
# `debug = false` and the dev feature set) and turns on `opt-level`.
[profile.release-debug]
inherits = "dev"
opt-level = 2
