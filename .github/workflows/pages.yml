# Build the interactive guide and publish it to GitHub Pages.
#
# Self-contained on purpose: it owns only the Pages deploy, so it composes cleanly with whatever
# general CI workflow lives alongside it. The guide runs the Cadenza compiler in the browser, so the
# deployable site (guide/dist/) needs the value-heap runtime store + the browser compiler wasm + the
# static Vite build all produced together.
#
# NIXIFIED (v-nix #5809 + v-gha-green, operator directive): the whole build is now the single nix
# derivation `packages.<sys>.guide-site` (flake `guideSite`) — it produces the exact deployable
# guide/dist/ (index.html + assets + 404 + version.json), reusing the cached cdzWasmPkg + component
# store + guideNpmDeps + codegen bin, and bakes VITE_BASE=/cadenza/ (the Pages base path; the repo is
# `cadenza`) at build time. Because it is input-addressed on the guide + compiler-wasm closure, an
# unchanged-trunk cron deploy is a nix-store CACHE HIT (near-instant) instead of a full ARM rebuild —
# the reason the deploy was rebuilding cold every 30-min cron. This replaces the former per-step
# cargo-xtask-build / guide-wasm / npm-build pipeline.
#
# The site is a project page at https://<owner>.github.io/<repo>/, so VITE_BASE (baked in the
# derivation) is the repo path `/cadenza/`.

name: Deploy guide to Pages

on:
  # The 30-min SCHEDULE is the BACKSTOP that catches every closure change (a compiler/runtime/spec edit
  # restages the bundled wasm, so the site is stale after ANY of those — only the cron catches them all).
  # HISTORY: a blanket per-push trigger USED to cancel every deploy — but that cancellation came from the
  # workflow-level `concurrency: group: pages` (removed below): on the scarce ARM pool a push run sat PENDING
  # past the 30-min interval, and the group cancelled the older PENDING run when the next push queued, so
  # deploys were superseded before starting (7 consecutive cancelled runs) and the site went stale.
  #
  # PATH-FILTERED PUSH (v-guide-infra 2026-09-02, concierge-assigned): a merge that touches the guide's OWN
  # sources (guide/**) or this workflow also fires an IMMEDIATE deploy, so a guide-content/render fix reaches
  # the live site in ~minutes instead of lagging up to 30 min — the recurring stale-deploy false-positive bug
  # source (operator hit already-fixed guide bugs on a 30-min-stale site: trap #7672, toggle #7678,
  # @invariant &gt;= display). This is SAFE here specifically because there is NO `concurrency: group` (see
  # below), so a push run is NOT cancelled by a newer one — push runs and cron runs simply coexist, all reach
  # a runner, and the `github-pages` environment serializes the publish (latest-to-finish wins). So the push
  # trigger is purely ADDITIVE: worst case it is redundant with the cron, and it can never regress BELOW the
  # cron-only baseline (the cron backstop always remains). The path filter keeps ARM-pool load bounded to
  # actual guide-source merges — a compiler/spec closure change (which also restages the guide) still relies
  # on the cron, not this trigger, so most main pushes do NOT fire it. `workflow_dispatch` stays for a manual
  # force-deploy after a guide-fix batch.
  push:
    branches: [main]
    paths:
      - "guide/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Every 30 min on an off-round minute (7,37) so it doesn't collide with other crons landing on :00/:30.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

# Least-privilege token scoped to publishing Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# NO workflow-level `concurrency: group` on purpose. A `group: pages` (even with cancel-in-progress:false)
# CANCELS an older PENDING run whenever a newer run queues — and cancel-in-progress:false only protects a
# RUNNING job, not a queued one. The build runs on the scarce ARM pool, so a run can sit PENDING for a runner
# longer than the 30-min cron interval; with a group, each new cron then cancelled the prior pending cron →
# deploys perpetually cancelled-before-starting, site went stale (observed: dispatch cancelled at the exact
# second the next cron queued). Serialization of the actual PUBLISH is already handled by the `github-pages`
# ENVIRONMENT (the deploy job below) — GitHub queues concurrent deployments to that environment. So the group
# was redundant AND harmful: dropping it lets a pending run wait for its runner instead of being cancelled,
# and the environment still guarantees one publish at a time. Concurrent BUILD jobs are harmless (idempotent
# — each builds the same trunk). Latest-to-finish wins the publish, which is the intent.

jobs:
  build:
    # aarch64 to match the rest of CI: the guide-site derivation builds the value-heap runtime whose
    # content hash the compiler pins, and that hash is only reproducible per-arch until the function-
    # order canonicalizer lands (see runtime-cross-arch-determinism / checks.yml). The guide bundles
    # that runtime, so it must be the aarch64 build → packages.aarch64-linux.guide-site.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # Install nix + wire the SHARED /nix/store cache (same pattern as the checks.yml nix jobs: the
      # installer enables ca-derivations for the content-addressed corpus/component cache, and the
      # nix-store-cache composite restores+saves the store so an unchanged-trunk cron is a cache hit).
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so the deploy reuses the shared content-addressed store (#3363)
          # instead of rebuilding the world. accept-flake-config lets nix TRUST the flake's
          # nixConfig extra-substituters (camshaft.cachix.org, v-nix #6213) so the guide-site build
          # PULLS the cachix-warmed closure instead of rebuilding cold (operator: "The rest should
          # pull"; matches checks.yml #6215 + cache-warm.yml). Appends to installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache

      # PRE-DEPLOY FAIL-FAST on cdz-wasm lock drift (v-cdz-crate-split, durable close for the recurring
      # guide-deploy break: #6328 (removed deps) + #6546 (an added cadenza-syntax edge) staled cdz-wasm's
      # SEPARATE Cargo.lock, and the guide-site build below then exited 101 with an OPAQUE nix error).
      # cdz-wasm-native runs the SAME `cargo --locked` resolve over the cdz-wasm standalone workspace, so
      # it reds on exactly the drift the guide-site build would hit — but caught HERE with a clear,
      # actionable message BEFORE the deploy. cachix-warmed (near-instant on a cache hit; rebuilds only
      # when cdz-wasm actually changes). Empirically confirmed to fail-fast on an added-edge drift.
      - name: Fail fast on cdz-wasm lock drift (pre-deploy guard)
        run: |
          if ! nix build .#checks.aarch64-linux.cdz-wasm-native --print-build-logs; then
            echo "::error title=cdz-wasm lock drift::The cdz-wasm gate failed before the guide-site deploy. MOST LIKELY cdz-wasm/Cargo.lock is STALE vs its Cargo.tomls — cdz-wasm is a SEPARATE workspace with its OWN lock, so a cross-workspace dep edge (a cadenza-syntax/rcdzc change) needs its lock regenerated. FIX: cd implementation/seed/crates/cdz-wasm && cargo update (or cargo generate-lockfile), then commit the updated Cargo.lock. (If it is NOT lock drift, this is a cdz-wasm clippy/test regression — see the check log above.)"
            exit 1
          fi

      # Build the DEPLOYABLE guide site through nix (v-nix #5809 packages.guide-site / flake guideSite).
      # This one derivation replaces the former cargo-xtask-build + guide-wasm + npm-build pipeline: it
      # produces guide/dist/ (index.html + assets + 404 + version.json) with VITE_BASE=/cadenza/ baked
      # in, reusing the cached cdzWasmPkg + component store + guideNpmDeps + codegen bin. Input-addressed
      # on the guide + compiler-wasm closure → an unchanged-trunk cron deploy is a near-instant cache hit.
      - name: Build the deployable guide site (via nix)
        run: nix build .#packages.aarch64-linux.guide-site --print-build-logs

      # Deref the nix `result` symlink into a real directory — upload-pages-artifact tars the path and
      # cannot follow the store symlink, so `cp -rL` materializes guide/dist/'s contents into guide-dist/.
      - name: Stage the Pages artifact (deref the nix result symlink)
        run: cp -rL result guide-dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: guide-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
