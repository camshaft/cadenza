# Build the interactive guide and publish it to GitHub Pages.
#
# Self-contained on purpose: it owns only the Pages deploy, so it composes cleanly with whatever
# general CI workflow lives alongside it. The guide runs the Cadenza compiler in the browser, so the
# build has to produce the compiler wasm first:
#   1. build the value-heap runtime component into the content-addressed store  (cargo xtask build)
#   2. build the browser compiler wasm + stage it and the runtime into guide/   (cargo xtask guide-wasm)
#   3. build the static site with the Pages base path                           (npm run build)
#
# The site is a project page at https://<owner>.github.io/<repo>/, so VITE_BASE is the repo path.

name: Deploy guide to Pages

on:
  # SCHEDULED deploy, NOT per-push. A push trigger was cancelling every deploy: the guide build runs on the
  # scarce ARM pool (runtime-hash reproducibility), so each push-triggered run sat PENDING waiting for a
  # runner, and the next guide-affecting push queued behind it — GitHub's `pages` concurrency group cancels
  # the older PENDING run when a newer one queues (even with cancel-in-progress:false, which only protects a
  # RUNNING job). On a busy main, deploys were superseded before ever starting, so the published site went
  # stale (7 consecutive cancelled runs). A scheduled run has no superseding push, so it reaches a runner and
  # COMPLETES; each cron rebuild uses current trunk + fresh wasm, so there's no staged-wasm lag. The site
  # lags trunk by at most the interval (30 min) — fine for a guide. `workflow_dispatch` stays so a human can
  # force an immediate deploy when something urgent lands (rather than waiting for the next tick).
  schedule:
    # Every 30 min on an off-round minute (7,37) so it doesn't collide with other crons landing on :00/:30.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

# Least-privilege token scoped to publishing Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# NO workflow-level `concurrency: group` on purpose. A `group: pages` (even with cancel-in-progress:false)
# CANCELS an older PENDING run whenever a newer run queues — and cancel-in-progress:false only protects a
# RUNNING job, not a queued one. The build runs on the scarce ARM pool, so a run can sit PENDING for a runner
# longer than the 30-min cron interval; with a group, each new cron then cancelled the prior pending cron →
# deploys perpetually cancelled-before-starting, site went stale (observed: dispatch cancelled at the exact
# second the next cron queued). Serialization of the actual PUBLISH is already handled by the `github-pages`
# ENVIRONMENT (the deploy job below) — GitHub queues concurrent deployments to that environment. So the group
# was redundant AND harmful: dropping it lets a pending run wait for its runner instead of being cancelled,
# and the environment still guarantees one publish at a time. Concurrent BUILD jobs are harmless (idempotent
# — each builds the same trunk). Latest-to-finish wins the publish, which is the intent.

jobs:
  build:
    # aarch64 to match the rest of CI: `cargo xtask build` produces the value-heap runtime whose
    # content hash the compiler pins, and that hash is only reproducible per-arch until the function-
    # order canonicalizer lands (see runtime-cross-arch-determinism / checks.yml). The guide bundles
    # that runtime, so it must be the same build.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The pinned toolchain (rust-toolchain.toml: 1.95.0 + rust-src + wasm32) and the exact
      # cargo-component / wasm-tools versions the rest of CI uses. Using `rustup default stable` +
      # `cargo install` (as before) diverged tool/compiler versions from `checks.yml`, which can stage
      # a subtly different browser wasm — the likely cause of the guide build's flaky module graph.
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: pages

      # wasm-pack is not in setup-rust (only the guide uses it); install it here.
      - name: Install wasm-pack
        run: cargo binstall -y --force wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guide/package-lock.json

      # 1. Build the value-heap runtime component into the store (the guide bundles the runtime whose
      #    content hash the compiler pins). RUSTC_BOOTSTRAP=1 enables the runtime's build-std (see
      #    cdz-runtime/.cargo/config.toml).
      - name: Build value-heap runtime
        run: cargo xtask build

      # 2. Build the browser compiler wasm and stage it + the runtime into guide/src/wasm/.
      - name: Build & stage guide wasm
        run: cargo xtask guide-wasm

      # 3. Verify every guide example compiles + every graded exercise runs to its expected value
      #    (against the wasm compiler staged above), then build the static site under the Pages base
      #    path. The example check gates the deploy: a chapter can't ship an example that doesn't run.
      - name: Build site
        working-directory: guide
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run check:codegen
          npm run check:codegen-sync
          npm run check:examples
          npm run check:calculator
          npm run check:prose
          npm run check:prose-native
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: guide/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
