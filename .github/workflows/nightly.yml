# Nightly — a scheduled full check plus a rolling prerelease of fresh artifacts.
#
# Two purposes:
#   - Catch bit-rot the PR gate can't: toolchain/dependency drift, and baseline SOFTENING
#     (`soft-baselines: true` runs the gate/bench without --check, so a *newly passing* case or an
#     allocation improvement is reported instead of ignored — a nudge to re-record the baselines).
#   - Publish a rolling `nightly` prerelease so consumers can always grab the tip build.
#
# ⚠ GitHub runs `schedule` triggers ONLY from the repository's DEFAULT branch. The active workspace
# lives on `spec`; make `spec` the default branch (Settings → Branches) for the cron to fire on the
# right tree. Until then, run this manually from the `spec` branch via the "Run workflow" button
# (workflow_dispatch), which is branch-selectable.
name: nightly

on:
  schedule:
    # 07:00 UTC daily (~midnight US Pacific). Cron only reads the default branch's copy.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write # move the rolling `nightly` tag + prerelease

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      soft-baselines: true

  build:
    uses: ./.github/workflows/build.yml
    with:
      version: nightly

  # The FULL rc-leak (live-objects) probe family — Perceus/FBIP reclaim discipline. Each probe composes a
  # program with the DEBUG-COUNTERS runtime and asserts the runtime's `live-objects` counter nets to the
  # expected count after a round-trip: a DIRECT rc-invariant witness catching a reclaim leak the value +
  # drop-import tests cannot see. The probes are `#[ignore]`d (they need the debug-counters store) so a plain
  # `cargo test` skips them; `cargo xtask check` runs only a fast CORE-4 subset (~20s) to keep the hot
  # pr-sync path cheap (concierge ruling 2026-07-18 (c)). This nightly job runs the WHOLE family (~60s) so
  # the full leak coverage is caught daily without taxing every PR check. Builds the store first (like the
  # `gate` job) and runs on aarch64 for the runtime-hash match (see runtime-cross-arch-determinism).
  rc-leak-full:
    name: rc-leak probe family (full)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: rc-leak-full
      - name: Build the runtime store (release + debug-counters)
        run: cargo xtask build
      # Run the FULL `#[ignore]`d probe set — NO name filter. The previous substring allowlist
      # (`leaves_no_live_objects`/`reclaim`/`no_extra_leak`/`not_use_after_freed`/`_known_gap`/
      # `survives_and_balances`/`owned_temporary_list_producers`) SILENTLY SKIPPED any leak/UAF probe whose
      # name matched none of those substrings — an audit (2026-07-22) found 6 such probes uncaught, including
      # `a_string_at_then_reuse_does_not_double_free_the_source` (a DOUBLE-FREE witness) and
      # `a_runtime_string_from_bytes_...` (which had regressed to a real leak while CI skipped it). A name
      # allowlist is structurally fragile: a future leak probe is unprotected until someone remembers to add
      # its substring. EVERY `#[ignore]`d test in this crate is a runtime-store-dependent probe (leak / UAF /
      # enumeration / equality — all `find_debug_runtime_wasm`/`find_runtime_wasm` guarded, skipping cleanly if
      # the store is absent), and this job builds the store above, so a bare `--ignored` run cannot silently
      # skip a new probe. Runs single-threaded (the live-objects counter is process-global). ~56 probes.
      - name: Run the full ignored probe set (leak / UAF / enumeration — no name filter)
        run: cargo test -p rcdzc --lib -- --ignored --test-threads=1


  # corpus-rust-gate-coarse-full — the FULL rust-backend coarse gate (all corpus files through the rust
  # backend, graded vs .gate-baseline-rust with #7706 membership_only), NIGHTLY. FOLD B (v-nix 2026-09-04):
  # REPLACES the former native sharded `cargo xtask gate --check --target rust` job — that in-process
  # `gate --check` path was DELETED (v-xtask seq-202); this nix coarse aggregate is its replacement. The
  # per-MR localGate runs only the bounded corpusRustGateCoarseSubset (01+05+06); this nightly job gives the
  # whole-corpus rust coverage the per-MR subset can't. UNSHARDED nix build (like opt-sweep): a nix build has
  # no ~15-min free-runner reclaim window — it runs to completion and PULLS the cache-warm closure — so the
  # sharding + shared-store plumbing the native job needed is gone (build-store removed with it, it fed only
  # this). ADVISORY: a RED = a rust-backend divergence outside the per-MR subset → note the owner + widen the
  # subset (the same widen-on-new-class remedy the native job used).
  corpus-rust-gate-coarse-full:
    name: rust-backend coarse gate (full corpus, advisory)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: corpus-rust-gate-coarse (via nix — full corpus through the rust backend)
        # --option eval-cache false: force a FRESH flake eval so the verdict-grading gate always resolves the
        # CURRENT-HEAD source-built compiler (cdzCompile is mkPhaseBin/crateClosure — source-pinned — so the
        # drv already tracks source; this closes the stale-eval-cache footgun on a required verdict gate, same
        # determinism gate-local forces, fleet.rs 2026-08-29). GATE-INTEGRITY (v-gha-green/v-effects fpr3).
        run: nix build .#checks.aarch64-linux.corpus-rust-gate-coarse --print-build-logs --option eval-cache false

  # (The FULL wasm coarse gate is NOT a separate nightly job: checks.yml's `gate` job — called by the
  # `checks` job above — was repointed (FOLD B) to `nix build .#checks.<sys>.corpus-gate-coarse`, so
  # nightly already runs the whole-corpus wasm coarse gate through that call. Only the RUST coarse gate
  # needs its own nightly job, since checks.yml has no rust gate.)

  # opt-sweep — the TIERED-OPT LEVEL-EQUIVALENCE gate (v-core-opt's OptLevel/PassManager on the shared Core
  # column), NIGHTLY ADVISORY (v-nix #6779, concierge-greenlit). `checks.aarch64-linux.opt-sweep` is a craneLib
  # derivation running `cargo xtask gate --opt-sweep` against the nix component store: it compiles + runs EVERY
  # corpus case at O0/O1/O2/O3 and asserts all four optimization levels agree (level-equivalence), exiting
  # non-zero on any divergence.
  #
  # UNSHARDED single nix build — deliberately NOT matrix-sharded like rust-gate-full. Sharding was the fix for
  # the ~15-min free-runner reclaim window (exit-143) that killed the NATIVE-cargo whole-corpus rust gate
  # mid-build; a NIX build has no such window — it runs to completion and caches in-store/cachix (it PULLS the
  # cache-warm release-deps + component store), so one build suffices (~4x a corpus run cold, but cached +
  # rebuilds only on a corpus/compiler change). If a cold build ever risks the runner window, v-core-opt can
  # make `--opt-sweep` shardable and v-nix will add mkOptSweepShard (same shape as the rust-gate shards).
  #
  # ADVISORY: eyeballed, NOT merge-gating (the ruleset lists only checks.yml contexts). A red = a candidate
  # O0..O3 miscompile for v-core-opt to triage. aarch64 — the opt-sweep default target resolves the per-arch
  # value-heap runtime hash (same reason the codegen/gate/bench jobs pin aarch64).
  opt-sweep:
    name: opt-sweep O0..O3 level-equivalence (advisory)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # ca-derivations for the content-addressed store; accept-flake-config + the camshaft.cachix.org
          # substituter/trusted-key at the DAEMON level (the #6370-correct vJQM+ key) so this build PULLS the
          # cache-warm closure (release-deps + component store) instead of cold-rebuilding the world.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: opt-sweep (via nix — O0..O3 level-equivalence over the full corpus)
        run: nix build .#checks.aarch64-linux.opt-sweep --print-build-logs

  publish:
    name: rolling nightly prerelease
    runs-on: ubuntu-latest
    needs: [checks, build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Overwrite the single `nightly` tag to point at this commit, then replace the prerelease
      # assets. action-gh-release moves the tag for us (with a fresh commit target).
      - name: Publish rolling nightly
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          # A rolling tag: clobber the previous nightly assets rather than appending.
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Rolling nightly build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Unstable — rebuilt every night. Use a `v*` release for a pinned version.
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/cadenza-runtime-*.wasm
            artifacts/runtime.toml
