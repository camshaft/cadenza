# Nightly — a scheduled full check plus a rolling prerelease of fresh artifacts.
#
# Two purposes:
#   - Catch bit-rot the PR gate can't: toolchain/dependency drift, and baseline SOFTENING
#     (`soft-baselines: true` runs the gate/bench without --check, so a *newly passing* case or an
#     allocation improvement is reported instead of ignored — a nudge to re-record the baselines).
#   - Publish a rolling `nightly` prerelease so consumers can always grab the tip build.
#
# ⚠ GitHub runs `schedule` triggers ONLY from the repository's DEFAULT branch. The active workspace
# lives on `spec`; make `spec` the default branch (Settings → Branches) for the cron to fire on the
# right tree. Until then, run this manually from the `spec` branch via the "Run workflow" button
# (workflow_dispatch), which is branch-selectable.
name: nightly

on:
  schedule:
    # 07:00 UTC daily (~midnight US Pacific). Cron only reads the default branch's copy.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write # move the rolling `nightly` tag + prerelease

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      soft-baselines: true

  build:
    uses: ./.github/workflows/build.yml
    with:
      version: nightly

  # The FULL rc-leak (live-objects) probe family — Perceus/FBIP reclaim discipline. Each probe composes a
  # program with the DEBUG-COUNTERS runtime and asserts the runtime's `live-objects` counter nets to the
  # expected count after a round-trip: a DIRECT rc-invariant witness catching a reclaim leak the value +
  # drop-import tests cannot see. The probes are `#[ignore]`d (they need the debug-counters store) so a plain
  # `cargo test` skips them; `cargo xtask check` runs only a fast CORE-4 subset (~20s) to keep the hot
  # pr-sync path cheap (concierge ruling 2026-07-18 (c)). This nightly job runs the WHOLE family (~60s) so
  # the full leak coverage is caught daily without taxing every PR check. Builds the store first (like the
  # `gate` job) and runs on aarch64 for the runtime-hash match (see runtime-cross-arch-determinism).
  rc-leak-full:
    name: rc-leak probe family (full)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: rc-leak-full
      - name: Build the runtime store (release + debug-counters)
        run: cargo xtask build
      # Run the FULL reclaim/leak probe family. The lone `leaves_no_live_objects` filter MISSED ~40 probes
      # named `reclaim`/`no_extra_leak`/`not_use_after_freed`/`_known_gap`/`survives_and_balances`/
      # `owned_temporary_list_producers` (the bytes/list/map/set owned-temporary reclaim family, map/set-remove,
      # the SITE-A probes, the UAF-guard, the tracked known-gap counts) — so a regression to those reclaim
      # invariants would have gone uncaught. libtest takes MULTIPLE filter substrings AFTER `--` (OR'd — NOT as
      # positional `cargo test` args, which only accept one TESTNAME and error on a second). All are debug-store
      # (`find_debug_runtime_wasm`) probes that skip cleanly if the store is absent. Selects 34 probes (was 23).
      # Keep this list in sync when a new reclaim probe's name matches none of these substrings.
      - name: Run the full live-objects leak-probe family
        run: >-
          cargo test -p rcdzc --lib -- --ignored --test-threads=1
          leaves_no_live_objects reclaim no_extra_leak not_use_after_freed
          _known_gap survives_and_balances owned_temporary_list_producers

  publish:
    name: rolling nightly prerelease
    runs-on: ubuntu-latest
    needs: [checks, build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Overwrite the single `nightly` tag to point at this commit, then replace the prerelease
      # assets. action-gh-release moves the tag for us (with a fresh commit target).
      - name: Publish rolling nightly
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          # A rolling tag: clobber the previous nightly assets rather than appending.
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Rolling nightly build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Unstable — rebuilt every night. Use a `v*` release for a pinned version.
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/cadenza-runtime-*.wasm
            artifacts/runtime.toml
