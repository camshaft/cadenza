# Scheduled /nix/store cache-warm — the warm-save STARVATION fix.
#
# PROBLEM (v-fleet-tooling + v-nix): cache-nix-action saves the /nix/store (incl. crane's cargoArtifacts
# dep-cache) ONLY on a COMPLETING run on the default branch. During busy main-push bursts, GitHub concurrency
# SUPERSEDES queued/pending main ci runs (independent of ci.yml's cancel-in-progress) before they start — so
# no main run completes → no warm-save → candidates cold-restore + the crane dep-cache never warms for anyone,
# exactly when throughput matters. (Observed: 8/10 main runs die QUEUED during a push flurry.)
#
# FIX: this job runs in its OWN concurrency group (NOT ci's push-supersede group), so a scheduled fire always
# survives to complete + save. Every 30min it (re)builds the crane dep-cache (.#cargo-artifacts) + the
# component store on the default branch → a fresh warm cache lands on the current flake key. Candidate runs
# then RESTORE it warm regardless of push cadence. workflow_dispatch allows an on-demand warm (e.g. for a clean
# before/after measurement after a flake-key rotation).
#
# SAVE-ON-SUCCESS SPLIT (v-nix+v-ft 2026-08-06): this workflow does NOT use the shared nix-store-cache composite
# (which the checks.yml jobs use for combined restore+save). It splits restore + a trailing save gated
# `if: success()` at the JOB level, so a warm run that FAILS a later step (e.g. a fmt-red in the warm-checks
# step) does NOT poison the key with a stale/partial store. See the restore/save steps below for the full
# rationale (the composite's embedded post-if:success() only sees the composite's own steps, not the job's).
name: cache-warm

on:
  schedule:
    - cron: "*/30 * * * *" # every 30min — keeps the dep-cache fresh vs GHA's 7-day eviction + key rotations
  workflow_dispatch: {} # manual on-demand warm

# FIXED group (NO github.ref): fully outside ci's `ci-<workflow>-<ref>` push-supersede group, AND two warm
# runs (a scheduled fire + a manual dispatch) coalesce — cancel-in-progress:false means a second queues behind
# the first rather than killing it, so a warm run always finishes to SAVE.
concurrency:
  group: cache-warm
  cancel-in-progress: false

# Least-privilege: this job READS the repo + reads/writes the GHA cache (cache r/w works under contents:read)
# AND needs `actions: write` to DELETE caches — the purge step (which GCs the prior seed-compiler drv's c2 key
# each rotation so the drv-keyed caches don't accumulate one-per-90min) calls the cache-DELETE REST endpoint,
# which is gated on the `actions` scope (NOT contents). Without it the purge fails `HttpError: Resource not
# accessible by integration` and stale c2-*-seed-<drv> keys pile up → GHA's 10GB repo cap evict-thrashes the
# x86 warm caches. cache-warm is the ONLY workflow that purges (checks.yml jobs run on candidate branches where
# the default-branch-gated purge is a no-op, so they stay contents:read).
permissions:
  contents: read
  actions: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  warm:
    # Advisory / NON-required — this workflow reports no gate context (ruleset 10560470 lists only checks.yml
    # jobs); a warm failure just means "cold like today", never reds a PR. Step names are distinct ('warm …')
    # so nothing shadows a required 'checks / …' context.
    name: warm nix store (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 warms the Linux-X64 cache the clippy + test-ubuntu required jobs restore.
          - { arch: x86_64, runs-on: ubuntu-latest }
          # aarch64 warms the Linux-ARM64 cache the codegen/gate/bench/guide-examples required jobs restore.
          - { arch: aarch64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      # SERIALIZE the ca-derivations schema migration BEFORE the cachix post-build-hook attaches (v-nix root-cause):
      # the Determinate daemon applies the 20220326-ca-derivations migration on first db open; without this, the
      # cachix push-hook's concurrent nix op races to apply the SAME migration → duplicate INSERT → intermittent
      # "SchemaMigrations UNIQUE" red (self-heals on re-dispatch). One serial `nix store ping` opens the db + applies
      # the migration ONCE up front, so the later push-hook sees it present and skips re-applying.
      - name: warm the nix daemon (serialize the ca-derivations migration before the cachix post-build-hook)
        run: nix store ping
      # PUSH the warmed first-party closure to the shared camshaft cachix cache (v-nix #6213 substituter;
      # this workflow is the PRIMARY pusher — it builds the WIDEST heavy closure: cargo-artifacts + store +
      # seed-compiler + the cad-tests check = exactly the paths agents/CI cold-rebuild). cachix-action's
      # post-step pushes paths built during this run; DEDUPs (already-present = cheap no-op). Placed BEFORE
      # the warm builds so it captures them. Default-branch-gate (save-on-default): cache-warm only runs on
      # main (schedule/dispatch), but the explicit gate keeps it push-on-main-only if the trigger ever widens.
      # Pull is already fleet-wide via accept-flake-config (#6215). Bumped to @v16 per v-nix.
      - uses: cachix/cachix-action@v16
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: camshaft
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # skipPush (v-nix): configure camshaft as a substituter (pull) + install the cachix CLI + auth, but do
          # NOT install the streaming per-build post-build-hook — that hook spawns a concurrent nix/cachix client
          # DURING each build that races the build's own nix to apply the 20220326-ca-derivations schema migration
          # → intermittent "SchemaMigrations UNIQUE" red (recurred post-#7874's up-front `nix store ping`). We push
          # POST-JOB instead (the trailing step below), after the build's nix has already applied the migration, so
          # there is no second concurrent client → the race cannot fire. Pull is unaffected.
          skipPush: true
      # SAVE-ON-SUCCESS SPLIT (v-nix+v-ft 2026-08-06): cache-warm does NOT use the shared nix-store-cache
      # composite (which the 10 checks.yml jobs use for combined restore+save) — it splits restore + save so
      # the SAVE can be gated on JOB success. WHY: a cache-warm run that FAILS a later step (e.g. the 10:01
      # fmt-red at the 'warm the aarch64-only nix checks' step) would otherwise still POISON the key — the
      # composite embeds cache-nix-action whose `post-if: success()` evaluates in the COMPOSITE's own step
      # context (all its steps ok), NOT the outer job's later failure, so the save fired despite the job
      # failing and seeded a stale/partial store. At the JOB level, `if: success()` DOES see every prior step
      # incl. the warm-checks step → a failed warm run genuinely SKIPS the save = structural poison-fix, no
      # eventually-consistent purge-then-save race (why we did NOT take purge-primary-key:0). This RESTORE keeps
      # the plain c2 form (restore-prefixes-first-match c2-scoped, tighter than the composite's bare
      # `nix-<os>-<arch>-`) so a warm-start prefix-matches the NEWEST c2-* entry — incl. the drv-suffixed key the
      # save step below writes on aarch64 — while never picking up a PRE-c2 stale cache. The composite is
      # untouched → zero blast radius on the other 10 callers (they prefix-restore the newest c2-* too).
      # RESTORE DISABLED (2026-08-29, v-gha-green) — same daemon-reset escape as #4491 did for the
      # nix-store-cache composite (checks.yml). ROOT CAUSE: cache-nix-action's post-restore DB-merge
      # rm+mv's /nix/var/nix/db/db.sqlite out from under the already-running Determinate daemon
      # (nix-installer-action start-daemon:true) -> the next `nix build` connection is reset ("cannot
      # open connection to remote store 'daemon': Connection reset by peer"). #4491 fixed the composite
      # but cache-warm calls cache-nix-action/restore DIRECTLY, so it still swapped the DB and every
      # scheduled warm run died instantly at the first `nix build .#cargo-artifacts`. Skipping the
      # restore keeps the daemon healthy; this job builds cold (fine on the */30 cron) and the trailing
      # save below still uploads a warm store, so a one-line re-enable (drop the `if: false`) restores
      # full warm behavior once Determinate ships a daemon tolerant of the cache DB swap (revert with #4491).
      - name: restore /nix/store (no save — the trailing step saves on success)
        if: ${{ false }} # DISABLED — daemon-reset stopgap; see comment above and #4491
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7 (pin matches composite)
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-c2-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-c2-
      - name: warm cargo-artifacts (crane dep-cache)
        run: nix build .#packages.${{ matrix.arch }}-linux.cargo-artifacts --print-build-logs
      - name: warm component store
        run: nix build .#packages.${{ matrix.arch }}-linux.store --print-build-logs
      # Warm + PUSH the value-heap runtime COMPONENTS: .#runtime (release, the REQUIRED_RUNTIME_HASH the gates +
      # `cargo xtask build` pin) + .#runtime-debug (DEBUG_RUNTIME_HASH). v-nix diagnosed (2026-08-30) that these
      # are NOT in the .#store closure, so the cargo-artifacts/store warm never built or pushed them → their
      # narinfo returned 404 on camshaft.cachix.org even though the push ran → agents cold-rebuilt the new-hash
      # runtime, which is exactly what triggered the #6250 big-nix-lock deadlock (~45 agents cold-building at
      # once). Building them here gets them cachix-pushed every warm run so agent store-rebuilds cache-HIT the
      # runtime instead of cold-building it. AARCH64 ONLY: the value-heap runtime hash is per-arch (x86 would
      # BlobMiss), same guard as the seed-compiler below.
      - name: warm + push the value-heap runtime components (aarch64 — closes the .#runtime cachix 404)
        if: matrix.arch == 'aarch64'
        run: nix build .#packages.aarch64-linux.runtime .#packages.aarch64-linux.runtime-debug --print-build-logs
      # Warm + PUSH the wasm corpus-verdicts-COARSE harvest (v-corpus-harness's .gate-baseline source; the
      # #corpus-verdicts trust lever — v-nix direction). corpus-verdicts-COARSE (~35 file derivations) is
      # VERDICT-byte-identical to the per-case corpus-verdicts but ~300x fewer realisation queries, so it does NOT
      # wedge like the per-case aggregate (which times out at 5.5h — DO NOT warm the per-case one). Building+pushing
      # it here lets NON-trusted fleet lanes (trusted-users=root only) PULL the ~10.9k verdicts instead of
      # cold-building + deadlocking. AARCH64 ONLY: wasm verdicts are arch-independent + content-addressed, built once.
      - name: warm + push corpus-verdicts-coarse (wasm baseline source — non-trusted lanes pull, not cold-build)
        if: matrix.arch == 'aarch64'
        run: nix build .#packages.aarch64-linux.corpus-verdicts-coarse --print-build-logs
      # PATH 2 (v-nix + v-corpus-harness): also EXPORT the coarse verdicts as a downloadable GHA ARTIFACT so a
      # NON-trusted lane consumes it OFF-NIX (`gh run download -n wasm-verdicts-coarse`) instead of a cachix pull.
      # WHY not the pull: corpus-verdicts-coarse is a CA/floating-output derivation; a non-trusted lane
      # (trusted-users=root) can't substitute the CA realisation (the CA taint propagates through any nix wrapper),
      # so the cachix-pull path is a dead wall. The $out is ALREADY the plain `<verdict>\t<title>` file (flake
      # corpusVerdictsCoarseAll: `: > $out; cat per-file >> $out`), so we just copy it out (the build above is a
      # same-job cache-hit). v-corpus-harness downloads it + diff-updates spec/semantics/.gate-baseline. aarch64-only.
      # DECOUPLED via `always()` (v-corpus-harness): the coarse-verdicts artifact must NOT be starved by an
      # UNRELATED earlier warm step failing (e.g. the cargo-artifacts warm hitting the intermittent SchemaMigrations
      # push-hook flake → all later steps skip → no artifact). This step builds the coarse independently (its own
      # `nix build`, cache-hit if the warm+push step above already built it), so `always() && aarch64` lets it run
      # even when an earlier warm step failed → the baseline artifact still gets produced. (If the SchemaMigrations
      # flake also hits THIS build's post-hook the run may still miss, but a subsequent warm produces it.)
      - name: stage corpus-verdicts-coarse for artifact upload
        if: ${{ always() && matrix.arch == 'aarch64' }}
        run: |
          out=$(nix build .#packages.aarch64-linux.corpus-verdicts-coarse --print-out-paths --print-build-logs)
          install -m644 "$out" "$RUNNER_TEMP/wasm-verdicts-coarse.txt"
      - name: upload wasm-verdicts-coarse artifact
        if: ${{ always() && matrix.arch == 'aarch64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-verdicts-coarse
          path: ${{ runner.temp }}/wasm-verdicts-coarse.txt
          if-no-files-found: error
          # SHORT retention: cache-warm runs every 30 min, so without this these accumulate into the GHA
          # artifact storage limit. Consumers (v-corpus-harness re-harvest / non-trusted-lane baseline pull)
          # only ever fetch the LATEST snapshot (there is always a <30-min-old one), so a 2-day window is
          # ample + gap-resilient (survives a brief warm-run outage) while staying bounded (~96 artifacts).
          # Matches nightly's shared-store artifact retention discipline (retention-days: 1).
          retention-days: 2
      # Warm the AARCH64 nix CHECK that the store+cargo-artifacts warm DON'T cover — cad-tests builds the
      # SEED COMPILER (cdz-seed-compiler is in its requisites) + runs `cdz test`, and neither packages.store
      # nor cargo-artifacts pulls seedCompiler. After the seedCompiler-src narrowing (#2373) this check became
      # warm-able (its input hash no longer rotates per unrelated seed-crate commit), BUT the ONLY path that
      # saved it was a MAIN checks.yml run — which the ~5min main cadence starves (a 17min run is
      # superseded-while-pending before it saves). So this backstop builds it here → the */30 cron seeds
      # seedCompiler + the check into the new-key store → candidates restore it warm (v-nix+v-ft 2026-08-06).
      # AARCH64 ONLY: it resolves the per-arch value-heap runtime hash from CDZ_STORE — on x86 it'd BlobMiss,
      # so guard to the arm leg.
      # SEED-COMPILER OUTPUT ROOT (v-nix+v-ft 2026-08-08, cold-warm content-gap fix): build the seed-compiler
      # EXPLICITLY with --out-link so its 46M output is a live GC-ROOT at save time. WHY: cad-tests +
      # cdz-agent-host-native depend on the seed-compiler as a BUILD input of their .drv, but their OUTPUT is a
      # tiny "ok" marker whose RUNTIME closure does NOT reference the seed-compiler output. So after those checks
      # build, the seed-compiler output is a DEAD path — and the save step's `gc-max-store-size-linux` GCs it
      # before upload. Candidates then restore a store WITHOUT the seed-compiler output (the .drv is known but the
      # output path is absent) and rebuild it COLD (~13-17m of the observed 15-19m — the c2 cache HITS + restores,
      # it's a content gap not a key/save miss; v-ft run-log diagnosis 31251120525). Rooting the output via
      # --out-link keeps it live through the pre-save GC so it lands in the saved narinfo set → candidates restore
      # it warm. The .drv-suffixed save key already rotates with the seed-compiler, so a fresh output saves cleanly.
      - name: warm + ROOT the seed-compiler output (aarch64, essential warm target — fatal)
        if: matrix.arch == 'aarch64'
        run: nix build .#packages.aarch64-linux.seed-compiler --out-link seed-compiler-root --print-build-logs
      # cad-tests is a warm-only BEARER, NOT a correctness gate: it builds the cad-tests CHECK (which runs
      # `cdz test`) so candidates restore that check warm. But it is a full test suite that reds on CODE
      # regressions unrelated to cache-warming (e.g. the CAD snowflake wasm-OOB trap owned by another lane) —
      # and cache-warm's JOB is warming the store, not gating correctness (that signal already lives in the
      # `ci` workflow's advisory `cadenza @test suites` check). By this point the essential warm targets
      # (cargo-artifacts, component store, seed-compiler) are ALREADY built, so a cad-tests failure does not
      # leave a partial store. `continue-on-error: true` keeps a cad-tests code-red NON-FATAL: `success()`
      # stays true, so the save below still fires and the store stays warm; only the cad-tests-check narinfo
      # is missed (candidates rebuild it — which they must anyway while it is red). v-gha-green 2026-08-29.
      - name: warm the aarch64-only cad-tests check (bearer; non-fatal — code reds must not red cache-warming)
        if: matrix.arch == 'aarch64'
        continue-on-error: true
        run: nix build .#checks.aarch64-linux.cad-tests --print-build-logs
      # POST-JOB CACHIX PUSH (v-nix — replaces the streaming per-build post-build-hook that skipPush dropped above).
      # Runs AFTER every warm build, so the build's nix has already applied the ca-derivations migration → no second
      # concurrent client → the SchemaMigrations UNIQUE race cannot fire. Re-evals the SAME first-party attrs the
      # warm steps built (a cache-hit that just prints out-paths); `cachix push` pushes each path AND its full
      # requisite closure, reproducing exactly what the streaming hook pushed. Default-branch-gated like the old push.
      - name: push the warm closure to cachix (post-job — no concurrent-client migration race)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          attrs=( .#packages.${{ matrix.arch }}-linux.cargo-artifacts .#packages.${{ matrix.arch }}-linux.store )
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            attrs+=( .#packages.aarch64-linux.runtime .#packages.aarch64-linux.runtime-debug \
                     .#packages.aarch64-linux.seed-compiler .#checks.aarch64-linux.cad-tests \
                     .#packages.aarch64-linux.corpus-verdicts-coarse )
          fi
          cachix push camshaft $(nix build "${attrs[@]}" --no-link --print-out-paths)
      # DRV-IN-SAVE-KEY (v-nix+v-ft 2026-08-06): compute the SAVE key with the seed-compiler's OUTPUT drv-hash
      # as a suffix ON AARCH64, so the key rotates WITH the payload. WHY: the seed-compiler drv rotates on every
      # rcdzc/cdz/cdz-run closure commit (~90min cadence, measured), but the c2 key (hashFiles(flake.lock,
      # flake.nix)) does NOT — so exact-hit-skip-save FROZE a stale c2 whenever the drv rotated under it, needing
      # a manual evict every ~90min. By suffixing the save key with the drv-hash, a rotated drv saves a NEW key
      # (no same-key exact-hit → no freeze → no manual evict ever); the arch-prefix purge below GCs the prior
      # drv's key (created:0), leaving exactly one c2-* per arch. RESTORE is UNCHANGED (still c2-prefix via
      # restore-prefixes-first-match) so candidates prefix-match the NEWEST c2-* regardless of suffix — warm-start
      # preserved, composite + the 10 checks.yml callers untouched (zero blast radius). x86 has no seed-compiler
      # payload, so its key stays the plain c2 form. The drv-hash is a pure eval (no build) so it's cheap + exact.
      - name: compute the drv-suffixed save key (aarch64 rotates with the seed-compiler; x86 stays plain c2)
        id: savekey
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          base="nix-${{ runner.os }}-${{ runner.arch }}-c2-${{ hashFiles('flake.lock', 'flake.nix') }}"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            drv=$(nix eval --raw .#packages.aarch64-linux.seed-compiler.drvPath | sed 's|.*/||; s|-cdz-seed-compiler.*||')
            echo "key=${base}-seed-${drv}" >> "$GITHUB_OUTPUT"
          else
            echo "key=${base}" >> "$GITHUB_OUTPUT"
          fi
      # SAVE the warmed store — gated `if: success()` at the JOB level so a run that FAILED any prior step
      # (incl. the warm-checks step above) does NOT save a stale/partial store (the poison-fix; see the restore
      # step's rationale). Params mirror the old composite's save side: gc the store to ~8GB before upload,
      # purge stale same-arch caches (purge-created:0), but purge-primary-key:never so this run's own fresh save
      # is protected from its own GC. Runs on the default branch only (this workflow only fires on main).
      - name: save /nix/store (only if the whole warm job succeeded)
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7 (pin matches composite)
        with:
          primary-key: ${{ steps.savekey.outputs.key }}
          gc-max-store-size-linux: 8000000000
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-c2-
          purge-created: 0
          purge-primary-key: never
