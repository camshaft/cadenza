# WEEKLY full-corpus Core↔wasm differential — Step B (v-wasm-oracle, oracle-wasm-diff-full over the FULL
# corpus ~10.7k cases, vs the DAILY cache-warm-extract-wasm.yml's cheap 2-file Step-A scalar set).
#
# WHY SEPARATE + WEEKLY (v-gha-green cadence/cost call, 2026-09-02): the full corpus is ~7x the daily's
# extraction layer (1478 → ~10.7k) and mostly SKIPs (heap-importing W5+ / compound non-scalar), so its extra
# AGREE yield is modest. Its real value is BROAD MISCOMPILE HUNTING — does compilation stay 0-diverge across
# strings/collections/effects/metaprog, not just numerics. That's worth a WEEKLY sweep, not a 7x DAILY cost.
#
# BUILD-ONCE-THEN-FAN-OUT (v-gha-green + v-wasm-oracle, 2026-09-04): the full-corpus diff exceeds GHA's HARD
# 6h per-JOB cap (heap-result decode #8240..#8268 moved hundreds of cases skip→decode+EXECUTE → >6h). A naive
# 8-way shard matrix (first attempt, #8417) did NOT fix a COLD run: sharding splits the DIFF but each of the 8
# parallel shard runners independently COLD-REALIZES the shared full ~10.7k-case extraction closure
# (oracleWasmCaseDirsFull) → 8× concurrent heavy nix builds THRASH the runner + still blow the cap (run
# 33874881616 sat >4h, 0/8 done). Fix = DECOUPLE the build from the fan-out: a serial `seed` job realizes +
# cachix-PUSHES the full extraction closure ONCE (warm), then the 8 `full-diff` shard jobs `needs: seed` and
# PULL it warm (no per-shard realize) — each shard is then just its bounded 1/8 diff slice (round-robin
# index%8==i via #8404's `oracle-wasm-diff --shard I N`), comfortably under 6h. A final `aggregate` job SUMS
# the 8 partial tallies (A agree / D diverge / S skip / L leak) + concatenates per-shard DIVERGE/LEAK lines.
# Bumping N is the WRONG lever (more parallel cold realizes = worse thrash); the seed decouples it. N=8.
#
# SCHEDULED Sunday 04:00 UTC — a low-traffic off-peak slot well clear of the daily emit-warm (08:00), extract-
# warm (10:00) and the nightly (07:00), so the heavy full warm never contends with them for the shared nix
# daemon. NON-required / advisory: a failure just means "cold / not-measured this week", never reds a PR.
name: cache-warm-extract-wasm-full

on:
  schedule:
    - cron: "0 4 * * 0" # weekly, Sunday 04:00 UTC (off-peak, clear of daily emit-08/extract-10 + nightly-07)
  workflow_dispatch: {} # manual on-demand (the FIRST measurement + any ad-hoc full-corpus sweep) — v-gha-green may retune

# Own group, fully outside ci's push-supersede group + cache-warm's group + the daily emit/extract groups, so
# the heavy full-corpus warm never contends with or supersedes the critical dep-cache warm or the daily warms.
concurrency:
  group: cache-warm-extract-wasm-full
  cancel-in-progress: false

# Least-privilege: only READS the repo + PUSHES to cachix (no GHA-cache save/purge), so contents:read suffices.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  seed:
    # BUILD-ONCE: realize + cachix-PUSH the full ~10.7k-case extraction closure ONCE, serially, BEFORE the
    # diff fan-out — so the 8 diff shards PULL it warm instead of each cold-realizing it in parallel (the 8×
    # build-contention thrash that blew the 6h cap). corpus-wasm-extract-warm-full's $out manifest OUTPUT
    # CLOSURE references the ~10.7k extraction store paths, so pushing it warms exactly what the shards consume.
    # This one job's realize is the extraction layer only (NOT the >6h differential) → well under the cap.
    name: seed the full extraction closure (build-once, warm cachix)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      # SERIALIZE the ca-derivations schema migration BEFORE the cachix post-build-hook attaches (v-nix #7874).
      - name: warm the nix daemon (serialize the ca-derivations migration before the cachix post-build-hook)
        run: nix store ping
      - uses: cachix/cachix-action@v16
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: camshaft
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true # keep pull+auth; push POST-JOB (below) to avoid the concurrent-client migration race
      # Realize the full extraction closure + push it to cachix so the diff shards PULL warm. On a cold first
      # run this is the heavy step (~10.7k extractions) but it is the extraction layer, NOT the >6h diff, so
      # it fits under the cap; every run after mostly cache-HITS (only re-keys on a compiler-rev bump).
      - name: build + push the full extraction closure to cachix (post-job — no concurrent-client migration race)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cachix push camshaft $(nix build .#packages.aarch64-linux.corpus-wasm-extract-warm-full --no-link --print-out-paths --keep-going)

  full-diff:
    # FAN-OUT: 8-way matrix, each shard runs oracle-wasm-diff over 1/8 of the corpus (round-robin index%8==shard).
    # needs: seed → the full extraction closure is already warm in cachix, so each shard PULLS it (no cold
    # realize, no 8× thrash) and runs only its bounded 1/8 diff — comfortably under the 6h per-job cap.
    # fail-fast:false so one shard's DIVERGE/timeout never cancels the others (we want ALL shards' tallies).
    name: full-corpus Core↔wasm differential (aarch64, shard ${{ matrix.shard }}/8)
    needs: seed
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: cachix/cachix-action@v16
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: camshaft
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true # pull-only here; the seed job already pushed the closure
      # One shard of the full-corpus differential (#8404 --shard I N). The extraction closure is warm (seed
      # pushed it) → this PULLS it + runs only its 1/8 slice. --keep-going so one bad case doesn't abort the
      # shard; continue-on-error so a real DIVERGE reds only this advisory step. The tally + DIVERGE/LEAK lines
      # print to the build log whether the shard succeeds or a diverge fails it → captured from stdout.
      - name: build + run oracle-wasm-diff-full shard ${{ matrix.shard }}/8 (advisory)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p tally
          nix build .#checks.aarch64-linux.oracle-wasm-diff-full-shard-${{ matrix.shard }}-of-8 \
            --print-build-logs --keep-going 2>&1 | tee /tmp/shard.log || true
          grep -E 'oracle-wasm-diff:.*agree' /tmp/shard.log | tail -1 > tally/shard-${{ matrix.shard }}.txt || true
          { echo "--- shard ${{ matrix.shard }}/8 DIVERGE/LEAK lines:"; grep -E '^(DIVERGE|LEAK) ' /tmp/shard.log || true; } >> tally/shard-${{ matrix.shard }}.txt
      - name: upload shard ${{ matrix.shard }} tally
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-diff-tally-${{ matrix.shard }}
          path: tally/shard-${{ matrix.shard }}.txt
          if-no-files-found: warn

  aggregate:
    # SUM the 8 partial tallies into the full-corpus breakdown. Pure text-processing (no nix), so ubuntu-latest.
    # always() + needs:full-diff so it runs even when a shard diverged/timed-out (fail-fast:false keeps them all).
    # Report-only: a DIVERGE surfaces as a ::warning:: for v-wasm-oracle to triage to v-cadenza-backend, and does
    # NOT fail the job (this whole workflow is advisory — a red would only mean "not-measured this week").
    name: aggregate the 8-way full-corpus tally
    runs-on: ubuntu-latest
    needs: full-diff
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: tallies
          pattern: wasm-diff-tally-*
          merge-multiple: true
      - name: sum the per-shard tallies
        run: |
          set -euo pipefail
          echo "=== full-corpus oracle-wasm-diff — 8-way sharded tally ==="
          A=0; D=0; S=0; L=0; missing=0
          for i in 0 1 2 3 4 5 6 7; do
            f="tallies/shard-$i.txt"
            line=$(grep -E 'oracle-wasm-diff:.*agree' "$f" 2>/dev/null | tail -1 || true)
            if [ -z "$line" ]; then echo "WARN: shard $i produced no tally (build failed to emit one?)"; missing=$((missing+1)); continue; fi
            echo "shard $i: $line"
            a=$(echo "$line" | grep -oE '[0-9]+[[:space:]]+agree' | grep -oE '[0-9]+' || echo 0)
            d=$(echo "$line" | grep -oE '[0-9]+[[:space:]]+diverge' | grep -oE '[0-9]+' || echo 0)
            s=$(echo "$line" | grep -oE '[0-9]+[[:space:]]+skip' | grep -oE '[0-9]+' || echo 0)
            l=$(echo "$line" | grep -oE '[0-9]+[[:space:]]+leak' | grep -oE '[0-9]+' || echo 0)
            A=$((A+a)); D=$((D+d)); S=$((S+s)); L=$((L+l))
          done
          echo ""
          echo "FULL CORPUS TOTAL: $A agree, $D diverge, $S skip, $L leak (summed across 8 shards; $missing shard(s) missing a tally)"
          echo ""
          echo "=== all DIVERGE/LEAK lines across shards ==="
          grep -hE '^(DIVERGE|LEAK) ' tallies/shard-*.txt 2>/dev/null || echo "(none)"
          if [ "$D" -gt 0 ]; then
            echo "::warning::full-corpus oracle-wasm-diff: $D DIVERGE(s) across the corpus — advisory miscompile signal for v-wasm-oracle → v-cadenza-backend (see lines above)"
          fi
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing/8 shards produced no tally (timeout or infra failure) — the total is partial this run"
          fi
