# Reusable health-check workflow — the parallel fan-out of `cargo xtask check`.
#
# `cargo xtask check` runs its steps SERIALLY (fmt → build → test → clippy → codegen → wasm-runtime
# → gate) for a single local green/red signal. In CI we want wall-clock, so each step is its own
# job and they run concurrently. Together they cover exactly what `check` covers, plus roundtrip and
# the allocation bench, which `check` doesn't run but the promotion bar cares about.
#
# Called by ci.yml (push/PR), release.yml, and nightly.yml via `workflow_call`.
name: checks

on:
  workflow_call:
    inputs:
      # Nightly flips this on so the behavior gate runs WITHOUT `--check`: it still fails on a real
      # miscompile (a corpus disagreement), but no longer on mere baseline drift — surfacing
      # newly-passing cases as a nudge to re-record. Day-to-day CI leaves it off (strict --check).
      soft-baselines:
        type: boolean
        default: false

# CARGO_INCREMENTAL=0: incremental artifacts only bloat the cache and never hit across CI runs.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

jobs:
  # ── Pure native, no wasm toolchain ──────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: fmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-${{ matrix.os }}
      - run: cargo test --workspace

  # ── standalone-crate gate ───────────────────────────────────────────────────
  # `fleet/slack-bridge` is its OWN cargo workspace (its slack-morphism/tokio async tree is kept out of
  # the seed lockfile), so the `--workspace` fmt/clippy/test jobs above DON'T cover it. Run its own gate
  # here (Rust lib tests + clippy + fmt, and the zero-dep Node smoke test) so a change to the bridge — by
  # any agent — is caught by CI, not just when its owner happens to run the tests locally.
  slack-bridge:
    name: slack-bridge crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: slack-bridge
      - name: Rust gate (test + clippy + fmt)
        working-directory: fleet/slack-bridge
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
      - name: Node smoke test
        working-directory: fleet/slack-bridge
        run: node smoke.test.js
      - name: Launcher + systemd units
        working-directory: fleet/slack-bridge
        run: |
          # The launcher/installer must parse, and the systemd unit templates must be valid units.
          bash -n run.sh
          bash -n systemd/install.sh
          # Render the templates against a fake @REPO_ROOT@ populated with stub executables at the
          # ExecStart paths (run.sh + the watchdog binary), so systemd-analyze verifies unit
          # syntax/keys without needing a real release build. (A missing ExecStart → verify exits 1.)
          root=/tmp/sd-root
          mkdir -p "$root/fleet/slack-bridge/target/release"
          printf '#!/bin/sh\n' > "$root/fleet/slack-bridge/run.sh"
          printf '#!/bin/sh\n' > "$root/fleet/slack-bridge/target/release/cadenza-slack-bridge"
          chmod +x "$root/fleet/slack-bridge/run.sh" "$root/fleet/slack-bridge/target/release/cadenza-slack-bridge"
          mkdir -p /tmp/sd
          for f in cadenza-slack-bridge cadenza-watchdog; do
            sed -e "s#@REPO_ROOT@#$root#g" -e "s#@FLEET_DIR@#$root/.claude/fleet#g" \
                -e "s#@HOME@#$HOME#g" -e "s#@PATH@#$PATH#g" -e "s#@CHANNEL@#DUMMYCHAN#g" \
                "systemd/$f.service.in" > "/tmp/sd/$f.service"
          done
          systemd-analyze verify /tmp/sd/cadenza-slack-bridge.service /tmp/sd/cadenza-watchdog.service

  # ── wasm-runtime-dependent jobs ─────────────────────────────────────────────
  # The value-heap runtime is invisible to `cargo build`; these jobs build it explicitly.

  codegen:
    # The staleness gate: regenerates the runtime-ABI table + REQUIRED_RUNTIME_HASH in memory and
    # fails if the committed source drifted. Reproducible only on the pinned rustc (see
    # rust-toolchain.toml) — this job is why the toolchain is pinned.
    #
    # Runs on aarch64: REQUIRED_RUNTIME_HASH is recorded on the (aarch64) dev machines, and the
    # runtime wasm is NOT yet byte-identical across host arches — LTO lays core/alloc functions out
    # in a host-dependent order (same functions, same bodies, reordered). Until the planned function-
    # order canonicalizer lands, this job must match the arch the committed hash was recorded on, or
    # it flakes. See the memory note runtime-cross-arch-determinism.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: codegen
      - run: cargo xtask codegen --check

  wasm-runtime:
    # The runtime is workspace-excluded and wasm32-only; a plain `cargo build` skips it, so build it
    # explicitly the way `xtask check` does.
    name: wasm runtime build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: wasm-runtime
      # RUSTC_BOOTSTRAP=1 enables the runtime's build-std (deterministic panic=immediate-abort, see
      # cdz-runtime/.cargo/config.toml) on the stable pin. xtask sets this itself for build/gate; this
      # job builds the runtime directly, so it sets it here.
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: implementation/seed/crates/cdz-runtime
        env:
          RUSTC_BOOTSTRAP: "1"

  gate:
    # The behavior gate: compile+run every corpus case and compare to the recorded verdict.
    # MUST build the runtime store first (`xtask build`) or every heap case is a false "runtime
    # missing" failure. `gate --check` fails only on a REGRESSION vs the committed baseline.
    #
    # Runs on aarch64 for the same reason as `codegen`: it builds the runtime whose content hash a
    # compiled program pins, and that hash must match REQUIRED_RUNTIME_HASH (recorded on aarch64)
    # until the runtime is byte-identical across arches. On x86 every runtime-heap case would trap
    # with "no runtime of content address … in the store". See runtime-cross-arch-determinism.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: gate
      - name: Build the runtime store
        run: cargo xtask build
      - name: Run the corpus gate
        run: cargo xtask gate ${{ inputs.soft-baselines && '' || '--check' }}

  cad-tests:
    # The Cadenza-SOURCE @test suites — libraries written IN Cadenza, run via `cdz test` (compile a
    # separate wasm test component from each `@test` def, run it under wasmtime, PASS if it returns /
    # FAIL if it traps). These are NOT corpus cases, so the `gate` job above does NOT cover them; without
    # this job a peer could break the CAD library or the compiler-ml port and CI would stay green.
    #   • implementation/cad          — the Solid CSG model library (v-cad, GH #400)
    #   • implementation/compiler-ml  — the self-hosted compiler port (previously ungated in CI)
    #   • implementation/agent-harness — the native agent loop written in Cadenza (v-agent-harness, Inc-2)
    # `cdz test` shells to a sibling `cdz-run` to execute each test and resolves the value-heap runtime
    # by content address from the store, so this job (like `gate`) builds the store first and puts
    # `cdz`+`cdz-run` in the same release dir. aarch64 for the same runtime-hash reason as `gate`.
    name: cadenza @test suites
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: cad-tests
      - name: Build the runtime store
        run: cargo xtask build
      - name: Build cdz + cdz-run
        run: cargo build --release -p cdz -p cdz-run
      - name: Run the CAD library @test suite
        run: ./target/release/cdz test implementation/cad
      - name: Run the compiler-ml @test suite
        run: ./target/release/cdz test implementation/compiler-ml
      - name: Run the agent-harness @test suite
        run: ./target/release/cdz test implementation/agent-harness

  cdz-cad:
    # The NATIVE CAD mesh driver crate (implementation/seed/crates/cdz-cad, GH #400 increment G2). It is
    # EXCLUDED from the seed workspace (its own `[workspace]`) because its mesh backend links `manifold-csg`,
    # whose `-sys` crate builds the C++ manifold3d via cmake — a build the seed's `--workspace` jobs must
    # never pay. So the `test`/`clippy`/`fmt` jobs above don't cover it; gate it here on its own. The crate
    # links `manifold-csg`, so this job compiles the C++ manifold3d via cmake on the first build (cmake + a
    # C++ compiler are on the standard ubuntu runner; the Rust cache keeps re-runs fast). No wasm toolchain
    # or runtime store needed — pure native crate.
    name: cdz-cad native driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cdz-cad
      - name: Test + lint the cdz-cad crate (standalone workspace)
        working-directory: implementation/seed/crates/cdz-cad
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check

  cdz-agent:
    # The NATIVE agent-harness embedder crate (implementation/seed/crates/cdz-agent, v-agent-harness
    # Inc-1b). EXCLUDED from the seed workspace (its own `[workspace]`) because its `bedrock` feature
    # pulls the heavy async aws-sdk + tokio tree the seed's `--workspace` jobs must never pay. So the
    # test/clippy/fmt jobs above don't cover it; gate it here. Its integration test drives a compiled
    # Cadenza agent-loop consumer through the embedder with a MOCK model (no AWS creds/network), so it
    # needs the value-heap runtime store — we `cargo xtask build` it and REGENERATE the fixture from
    # source (so the fixture's runtime hash always matches this build, never a stale-fixture skip). Tests
    # DEFAULT features (mock only); a `cargo test --features bedrock` compiles + runs the Bedrock
    # backend's UNIT tests (the response-decode/UTF-8 path — no creds/network needed, only the actual
    # invoke would). aarch64 for the same runtime-hash reason as gate.
    name: cdz-agent embedder
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: cdz-agent
      - name: Build the runtime store
        run: cargo xtask build
      - name: Build cdz + cdz-run
        run: cargo build --release -p cdz -p cdz-run
      - name: Regenerate the consumer fixtures (match the current runtime hash)
        run: |
          printf '%s' '(do (effect Model (op converse (-> String String))) (bind Model "cadenza:model/api") (def (main) (String.byte-len (host (Model) (Model.converse "hi")))) (export main))' \
            > /tmp/agent-consumer.sexp
          ./target/release/cdz compile /tmp/agent-consumer.sexp \
            -o implementation/seed/crates/cdz-agent/tests/fixtures/model-consumer.wasm
          printf '%s' '(do (effect Model (op converse (-> String String))) (effect Cedar (op authorize (-> String Int64))) (bind Model "cadenza:model/api") (bind Cedar "cadenza:cedar/api") (def (main) (if (= (host (Cedar) (Cedar.authorize "tool:chat")) 1) (String.byte-len (host (Model) (Model.converse "hi"))) 0)) (export main))' \
            > /tmp/authz-consumer.sexp
          ./target/release/cdz compile /tmp/authz-consumer.sexp \
            -o implementation/seed/crates/cdz-agent/tests/fixtures/authz-model-consumer.wasm
          printf '%s' '(do (effect Inbox (op next (-> Unit String))) (effect Model (op converse (-> String String))) (effect Cedar (op authorize (-> String Int64))) (bind Inbox "cadenza:inbox/api") (bind Model "cadenza:model/api") (bind Cedar "cadenza:cedar/api") (def (main) (if (= (host (Cedar) (Cedar.authorize "tool:chat")) 1) (String.byte-len (host (Model) (Model.converse (host (Inbox) (Inbox.next))))) 0)) (export main))' \
            > /tmp/inbox-consumer.sexp
          ./target/release/cdz compile /tmp/inbox-consumer.sexp \
            -o implementation/seed/crates/cdz-agent/tests/fixtures/inbox-model-consumer.wasm
          printf '%s' '(do (effect Inbox (op next (-> Unit String))) (effect Model (op converse (-> String String))) (effect Cedar (op authorize (-> String Int64))) (bind Inbox "cadenza:inbox/api") (bind Model "cadenza:model/api") (bind Cedar "cadenza:cedar/api") (def (main) (if (= (host (Cedar) (Cedar.authorize "tool:chat")) 1) (host (Model) (Model.converse (host (Inbox) (Inbox.next)))) "denied")) (export main))' \
            > /tmp/return-consumer.sexp
          ./target/release/cdz compile /tmp/return-consumer.sexp \
            -o implementation/seed/crates/cdz-agent/tests/fixtures/inbox-model-return-consumer.wasm
          printf '%s' '(do (effect Inbox (op next (-> Unit String))) (effect Model (op converse (-> String String))) (effect Cedar (op authorize (-> String String))) (bind Inbox "cadenza:inbox/api") (bind Model "cadenza:model/api") (bind Cedar "cadenza:cedar/api") (def (main) (String.byte-len (host (Cedar) (Cedar.authorize (host (Inbox) (Inbox.next)))))) (export main))' \
            > /tmp/misshape-consumer.sexp
          ./target/release/cdz compile /tmp/misshape-consumer.sexp \
            -o implementation/seed/crates/cdz-agent/tests/fixtures/misshaped-authz-consumer.wasm
      - name: Test + lint the cdz-agent crate (standalone workspace)
        working-directory: implementation/seed/crates/cdz-agent
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
          cargo test --features bedrock

  cdz-kernel:
    # The log-native agent-runtime MICROKERNEL crate (implementation/seed/crates/cdz-kernel, v-agent-harness
    # agent-runtime L1 — the fold owner). EXCLUDED from the seed workspace (its own `[workspace]`) because
    # its future `aws` feature (the DynamoDB log backend, L1d) pulls the heavy async aws-sdk + tokio tree the
    # seed's `--workspace` jobs must never pay. So the test/clippy/fmt jobs above don't cover it; gate it
    # here (like cdz-agent/cdz-cad). Its fold-owner test (L1b+) drives a compiled Cadenza agent-loop consumer
    # through cdz-run with a MOCK model (no AWS creds/network), reusing cdz-agent's model-consumer fixture, so
    # it needs the value-heap runtime store — we `cargo xtask build` it and REGENERATE that fixture from
    # source (so the fixture's runtime hash always matches this build, never a stale-fixture skip). Tests
    # DEFAULT features (file log + mock model); the `aws` feature only needs to COMPILE (its DynamoDB path is
    # network-only, exercised manually). aarch64 for the same runtime-hash reason as gate.
    name: cdz-kernel microkernel
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: cdz-kernel
      - name: Build the runtime store
        run: cargo xtask build
      - name: Build cdz + cdz-run
        run: cargo build --release -p cdz -p cdz-run
      - name: Regenerate the model-consumer fixture (match the current runtime hash)
        run: |
          printf '%s' '(do (effect Model (op converse (-> String String))) (bind Model "cadenza:model/api") (def (main) (String.byte-len (host (Model) (Model.converse "hi")))) (export main))' \
            > /tmp/kernel-consumer.sexp
          ./target/release/cdz compile /tmp/kernel-consumer.sexp \
            -o implementation/seed/crates/cdz-agent/tests/fixtures/model-consumer.wasm
      - name: Test + lint the cdz-kernel crate (standalone workspace)
        working-directory: implementation/seed/crates/cdz-kernel
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
          cargo build --features aws

  rcdzc-wasm:
    # The Cadenza COMPILER as a WASM artifact (implementation/seed/crates/rcdzc-wasm, v-agent-harness
    # minimal-kernel K1-dep wasm-swap — operator #54). EXCLUDED + wasm-only: it builds to wasm32-wasip1 (a
    # cdylib exporting compile/alloc/dealloc the kernel loads via wasmtime), so the seed's `--workspace` jobs
    # skip it entirely — gate it here (like wasm-runtime/cdz-kernel). Two checks: the pure host-side glue
    # (compile_ast + the codec, native test/clippy/fmt), and the actual WASM BUILD (the artifact the kernel
    # runs). The wasm32-wasip1 target isn't in setup-rust's default set, so add it explicitly.
    name: rcdzc compiler-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rcdzc-wasm
      - name: Host-side glue (native test + lint)
        working-directory: implementation/seed/crates/rcdzc-wasm
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
      - name: Build the compiler wasm artifact (wasm32-wasip1)
        working-directory: implementation/seed/crates/rcdzc-wasm
        run: |
          rustup target add wasm32-wasip1
          cargo build --target wasm32-wasip1

  roundtrip:
    # Every corpus program must round-trip through the syntax surfaces — guards cadenza-syntax
    # independently of the compiler. No runtime needed.
    name: syntax roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: roundtrip
      - run: cargo xtask roundtrip

  bench:
    # Runtime allocation regression check (allocation COUNT, deterministic native↔wasm) vs the
    # committed baseline. Runs the cdz-runtime native #[ignore]d ceilings test.
    name: allocation bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench
      - run: cargo xtask bench

  guide-examples:
    # PRE-MERGE gate for the guide's runnable content. pages.yml runs the SAME checks but only
    # `on: push:[main]` — i.e. AFTER merge, where a broken example surfaces as a red Pages deploy
    # that can never block. This job mirrors pages.yml's build (minus the deploy) so a PR that
    # ships an example which doesn't compile/run — or breaks the guide build — CANNOT merge. Keep it
    # in lockstep with pages.yml's "Build site" step; if that gains a check, add it here too.
    #
    # aarch64 for the same runtime-hash reason as `gate`/`codegen`/pages.yml: the guide bundles the
    # value-heap runtime whose content hash the compiler pins, reproducible per-arch only.
    name: guide examples
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: guide-examples
      - name: Install wasm-pack
        run: cargo binstall -y --force wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guide/package-lock.json
      # Build the runtime store + stage the browser compiler wasm the examples run against
      # (same two steps pages.yml runs before its site build).
      - name: Build value-heap runtime
        run: cargo xtask build
      - name: Build & stage guide wasm
        run: cargo xtask guide-wasm
      # Verify every example compiles + every graded exercise runs, the calculator checks pass, and
      # the site builds — the exact gate pages.yml applies, but here it BLOCKS the merge.
      - name: Check guide examples + build site
        working-directory: guide
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          # Fast, browser/wasm-free unit tests first (node --test, type-stripping; needs node >=22.6,
          # which node-version:22 resolves to) — a pure-logic regression (wrap/strip, applyFix byte
          # splice, offset conversion, share round-trip, calculator classify, chapter-registry sync)
          # fails the merge here before the slower jco example run.
          npm run test:unit
          # Lint the guide PROSE for invented @annotations (the run-every-example harness only validates
          # <Runnable> code; a fake API named in prose — like the property-testing @property that once
          # shipped — would otherwise slip). Fast text scan, no wasm.
          npm run check:prose
          npm run check:examples
          npm run check:calculator
          # Compiler-conformance guards that a per-example check can't cover, each catching a fleet-wide
          # regression a reader would otherwise hit in the browser:
          #  - worker-stack: a module-qualified program must compile in a constrained-stack worker (a deep
          #    recursion that overflows ONLY the browser worker — check:examples runs main-thread + misses it).
          #  - tuple-collection: a runtime-built collection nested in a tuple must cross the host boundary +
          #    render (self-activating — SKIPs if the compiler feature regresses to the known decline, ASSERTs
          #    the rendered value otherwise). Guards the "show data + result" example pattern.
          npm run check:worker-stack
          npm run check:tuple-collection
          npm run build
