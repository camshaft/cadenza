# Reusable health-check workflow — the parallel fan-out of `cargo xtask check`.
#
# `cargo xtask check` runs its steps SERIALLY (fmt → build → test → clippy → codegen → wasm-runtime
# → gate) for a single local green/red signal. In CI we want wall-clock, so each step is its own
# job and they run concurrently. Together they cover exactly what `check` covers, plus roundtrip and
# the allocation bench, which `check` doesn't run but the promotion bar cares about.
#
# Called by ci.yml (push/PR), release.yml, and nightly.yml via `workflow_call`.
name: checks

on:
  workflow_call:
    inputs:
      # Nightly flips this on so the behavior gate runs WITHOUT `--check`: it still fails on a real
      # miscompile (a corpus disagreement), but no longer on mere baseline drift — surfacing
      # newly-passing cases as a nudge to re-record. Day-to-day CI leaves it off (strict --check).
      soft-baselines:
        type: boolean
        default: false

# CARGO_INCREMENTAL=0: incremental artifacts only bloat the cache and never hit across CI runs.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

jobs:
  # ── Pure native, no wasm toolchain ──────────────────────────────────────────
  fmt:
    # Full-CI-in-nix cutover (Model A): body runs the nix `checks.fmt` derivation (identical
    # `cargo fmt --all --check`, hermetic), keeping `name: rustfmt` so the required context
    # `checks / rustfmt` is UNCHANGED (no ruleset edit). fmt is ARCH-INDEPENDENT (pure source, no runtime
    # build) → runs on the DEFAULT x86 runner via `checks.x86_64-linux.fmt` (frees scarce ARM capacity;
    # github-liaison #2054 + v-fleet-tooling affirmed — arch-agnostic checks name no platform, so x86 is
    # correct). Only the runtime-touching checks (codegen/gate/bench) need aarch64.
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: cargo fmt (via nix)
        run: nix build .#checks.x86_64-linux.fmt --print-build-logs

  # 2-WAY CLIPPY SHARD (v-nix+v-fleet-tooling 2026-08-07, data-driven CI-speed): clippy is the sole ~8.8m
  # critical-path pole and RUN-TIME-bound, so these two run the flake's balanced-by-build-weight sub-aggregates
  # in PARALLEL, halving the pole (~8.8→~5m) for +1 x86 slot/candidate. Both cache-hit the shared cargoArtifacts.
  # These are the REQUIRED clippy contexts (ruleset 10560470 flipped 2026-08-07: added checks/clippy-shard-a +
  # checks/clippy-shard-b, removed checks/clippy — v-ft STEP 2). The old single `clippy` job was dropped here
  # (STEP 3) after the flip, gap-free (it was no longer required). Job names match the ruleset contexts EXACTLY.
  # x86 (arch-independent). Union == the former whole-clippy set (flake clippyShardA ∪ clippyShardB, 5+6=11).
  clippy-shard-a:
    name: clippy-shard-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: cargo clippy shard A (via nix — rcdzc + cdz-num + cdz-calc + cadenza-syntax)
        run: nix build .#checks.x86_64-linux.clippy-shard-a --print-build-logs

  clippy-shard-b:
    name: clippy-shard-b
    # QUEUE-BALANCE: on ARM (not x86). clippy is ARCH-INDEPENDENT (both shards + roundtrip run clean on
    # aarch64), and the x86 required pool was oversubscribed (11 x86 vs 7 arm jobs) → clippy-shard-b (the
    # heavier ~7.5m clippy half) was consistently the STARVED tail, stalling candidates for want of an x86
    # slot (pr-sync flagged fleet-wide starvation 2026-08-07). Moving it x86→arm removes it from the crowded
    # x86 pool + rebalances to 10 x86 / 8 arm, and clippy runs faster on arm anyway (cf. roundtrip 7.2→5.5m).
    # Same context name `checks / clippy-shard-b` (only the runner moves) → no ruleset change. clippy-shard-a
    # (the light 2.6m half) stays on x86 — keeping ONE clippy shard on each arch balances both pools.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: cargo clippy shard B (via nix — cdz (workspace) + cdz-run + xtask + cadenza-ast + cdz-corpus + cdz-rt + cdz-rust-render)
        run: nix build .#checks.aarch64-linux.clippy-shard-b --print-build-logs

  test-ubuntu:
    # Full-CI-in-nix cutover (Model A): the `test (ubuntu-latest)` required context, body-swapped to the
    # hermetic nix aggregate check (`checks.test` = all per-crate clippy+test derivations + crate-cdz —
    # coverage-equal to `cargo test --workspace`: every workspace test binary maps to one member crate, so
    # the union == the old whole-workspace run, verified via `cargo test --workspace --no-run`). Keeping the
    # EXACT context name `test (ubuntu-latest)` leaves ruleset 10560470 unchanged. x86 (the context name
    # promises ubuntu/x86; the flake exports x86 via eachDefaultSystem; the per-crate tests are arch-agnostic
    # native rust). This was a matrix leg of the old `test` job — split out so ubuntu goes nix while macos
    # stays native cargo (below), since a matrix can't body-swap one leg differently.
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: test (via nix — per-crate aggregate, hermetic)
        run: nix build .#checks.x86_64-linux.test --print-build-logs

  # ── test (macos-latest): DISABLED (operator directive 2026-08-30, v-gha-green) ──────────────────────
  # Commented out because it was PERPETUALLY RED on an ACCEPTED gap, not a real failure: cdz-platform's
  # `mod contracts` resolves to `contracts.rs`, which is GENERATED at build time by nix (xtask-codegen-
  # contracts / build-time-nix). The native `cargo test --workspace` on the macOS runner does NOT run that
  # nix codegen, so cdz-platform fails to compile with `error[E0583]: file not found for module contracts`.
  # There is no native-macOS equivalent for the build-time-nix step, so this job could never go green as-is.
  # Operator: "if we're ignoring macos then we should just comment it out" — i.e. remove it from the run
  # rather than leave it red-and-ignored on every hourly board. NB it is NOT in the required ruleset
  # (10560470 = ruleset-10 minus test-macos), so disabling it changes no merge gate.
  # RE-ENABLE when native macOS can build contracts.rs (e.g. a build.rs / committed-contracts path, or a
  # macOS nix check that runs the codegen). Restore the job below verbatim.
  #
  # test-macos:
  #   # `test (macos-latest)` STAYS native cargo-on-macOS (intentional non-swap): it provides macOS PLATFORM
  #   # coverage a linux-nix check can't — a body-swap is valid only when the nix check runs on the platform
  #   # the context name promises (v-fleet-tooling ruling). Same context name as the old matrix leg.
  #   name: test (macos-latest)
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: ./.github/actions/setup-rust
  #       with:
  #         cache-key: test-macos-latest
  #     - run: cargo test --workspace

  # Fast COMPILER-FREE corpus-hygiene lints (v-corpus-harness). Native cargo (like test-macos): both read
  # spec/semantics/*.sexp (+ .gate-baseline) via the cdz-corpus bin — no compiler, no nix check, sub-second —
  # so they run as a plain cargo step (v-nix ruling: a nix check deriv buys ~zero caching + the flake checks
  # are generated). They catch drift that otherwise reds a full gate --check fleet-wide only after a ~15-30min
  # gate: `nativize-check` (an INPUT compound value literal not in native #ctor form — M3; caught #5973→#5981)
  # and `baseline-drift` (a VANISHED .gate-baseline title from a renamed/removed case; caught + fixed #5983).
  corpus-lints:
    name: corpus-lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: corpus-lints
      - name: native #ctor input-form lint
        run: cargo run -q -p cdz-corpus -- nativize-check spec/semantics/*.sexp
      - name: baseline title-drift lint
        run: cargo run -q -p cdz-corpus -- baseline-drift spec/semantics/*.sexp --baseline spec/semantics/.gate-baseline
      # decline-message professionalism (v-fleet-tooling gate-wiring 2026-08-31; scan v-corpus-harness #6791,
      # lexicon v-deferral-declines seq-280): no deferral-trash wording ("yet"/"for now"/…) in rcdzc/src
      # decline() messages. ADVISORY here (GHA is advisory-only); the TEETH are the localGate fold
      # (checks.<sys>.decline-professionalism). cwd = repo root, so the scan resolves rcdzc/src from CWD.
      - name: decline-message professionalism lint
        run: cargo run -q -p xtask-mandates -- declines
      # capability-error (v-fleet-tooling gate-wiring 2026-08-31; scan v-corpus-harness #6924): no corpus
      # case pins a capability-limit code (CDZ0900) as an (error …) — the impl-independent-spec guard.
      # ADVISORY here; the TEETH are the localGate fold (checks.<sys>.capability-error).
      - name: capability-error corpus lint
        run: cargo run -q -p cdz-corpus -- capability-error-check spec/semantics/*.sexp

  # ── standalone-crate gate ───────────────────────────────────────────────────
  # `fleet/slack-bridge` is its OWN cargo workspace (its slack-morphism/tokio async tree is kept out of
  # the seed lockfile), so the `--workspace` fmt/clippy/test jobs above DON'T cover it. Run its own gate
  # here (Rust lib tests + clippy + fmt, and the zero-dep Node smoke test) so a change to the bridge — by
  # any agent — is caught by CI, not just when its owner happens to run the tests locally.
  slack-bridge:
    name: slack-bridge crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: slack-bridge
      - name: Rust gate (test + clippy + fmt)
        working-directory: fleet/slack-bridge
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
      - name: Node smoke test
        working-directory: fleet/slack-bridge
        run: node smoke.test.js
      - name: Launcher + systemd units
        working-directory: fleet/slack-bridge
        run: |
          # The launcher/installer/revive scripts must parse, and the systemd unit templates must be valid units.
          bash -n run.sh
          bash -n revive.sh
          bash -n systemd/install.sh
          # Render the templates against a fake @REPO_ROOT@ populated with stub executables at the
          # ExecStart paths (run.sh + the watchdog binary), so systemd-analyze verifies unit
          # syntax/keys without needing a real release build. (A missing ExecStart → verify exits 1.)
          root=/tmp/sd-root
          mkdir -p "$root/fleet/slack-bridge/target/release"
          printf '#!/bin/sh\n' > "$root/fleet/slack-bridge/run.sh"
          printf '#!/bin/sh\n' > "$root/fleet/slack-bridge/target/release/cadenza-slack-bridge"
          chmod +x "$root/fleet/slack-bridge/run.sh" "$root/fleet/slack-bridge/target/release/cadenza-slack-bridge"
          mkdir -p /tmp/sd
          for f in cadenza-slack-bridge cadenza-watchdog; do
            sed -e "s#@REPO_ROOT@#$root#g" -e "s#@FLEET_DIR@#$root/.claude/fleet#g" \
                -e "s#@HOME@#$HOME#g" -e "s#@PATH@#$PATH#g" -e "s#@CHANNEL@#DUMMYCHAN#g" \
                "systemd/$f.service.in" > "/tmp/sd/$f.service"
          done
          systemd-analyze verify /tmp/sd/cadenza-slack-bridge.service /tmp/sd/cadenza-watchdog.service

  # ── wasm-runtime-dependent jobs ─────────────────────────────────────────────
  # The value-heap runtime is invisible to `cargo build`; these jobs build it explicitly.

  codegen:
    # The staleness gate: regenerates the runtime-ABI table + REQUIRED_RUNTIME_HASH in memory and
    # fails if the committed source drifted. Reproducible only on the pinned rustc (see
    # rust-toolchain.toml) — this job is why the toolchain is pinned.
    #
    # Runs on aarch64: REQUIRED_RUNTIME_HASH is recorded on the (aarch64) dev machines, and the
    # runtime wasm is NOT yet byte-identical across host arches — LTO lays core/alloc functions out
    # in a host-dependent order (same functions, same bodies, reordered). Until the planned function-
    # order canonicalizer lands, this job must match the arch the committed hash was recorded on, or
    # it flakes. See the memory note runtime-cross-arch-determinism.
    # Full-CI-in-nix cutover (Model A): body runs the nix `checks.codegen-check` derivation (`cargo run
    # --locked -- codegen --check`, hermetic — builds cdz-runtime+nfc via cargo-component + regenerates
    # runtime_abi.rs), keeping the job key `codegen` so the required context `checks / codegen` is
    # UNCHANGED (no ruleset edit). STAYS aarch64: the check builds the runtime whose content hash is
    # arch-specific (the reason for the pin above).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: cargo xtask codegen --check (via nix)
        run: nix build .#checks.aarch64-linux.codegen-check --print-build-logs

  wasm-runtime:
    # The runtime is workspace-excluded and wasm32-only; a plain `cargo build` skips it, so build it
    # explicitly the way `xtask check` does.
    name: wasm runtime build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: wasm-runtime
      # RUSTC_BOOTSTRAP=1 enables the runtime's build-std (deterministic panic=immediate-abort, see
      # cdz-runtime/.cargo/config.toml) on the stable pin. xtask sets this itself for build/gate; this
      # job builds the runtime directly, so it sets it here.
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: implementation/seed/crates/cdz-runtime
        env:
          RUSTC_BOOTSTRAP: "1"

  gate:
    # The behavior gate: compile+run every corpus case and compare to the recorded verdict.
    # MUST build the runtime store first (`xtask build`) or every heap case is a false "runtime
    # missing" failure. `gate --check` fails only on a REGRESSION vs the committed baseline.
    #
    # Runs on aarch64 for the same reason as `codegen`: it builds the runtime whose content hash a
    # compiled program pins, and that hash must match REQUIRED_RUNTIME_HASH (recorded on aarch64)
    # until the runtime is byte-identical across arches. On x86 every runtime-heap case would trap
    # with "no runtime of content address … in the store". See runtime-cross-arch-determinism.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: gate
      - name: Build the runtime store
        run: cargo xtask build
      - name: Run the corpus gate
        run: cargo xtask gate ${{ inputs.soft-baselines && '' || '--check' }}

  cad-tests:
    # The Cadenza-SOURCE @test suites — libraries written IN Cadenza, run via `cdz test` (compile a
    # separate wasm test component from each `@test` def, run it under wasmtime, PASS if it returns /
    # FAIL if it traps). These are NOT corpus cases, so the `gate` job above does NOT cover them; without
    # this job a peer could break the CAD library or the compiler-ml port and CI would stay green.
    #   • implementation/cad          — the Solid CSG model library (v-cad, GH #400)
    #   • implementation/compiler-ml  — the self-hosted compiler port (previously ungated in CI)
    # `cdz test` shells to a sibling `cdz-run` to execute each test and resolves the value-heap runtime
    # by content address from the store, so this job (like `gate`) builds the store first and puts
    # `cdz`+`cdz-run` in the same release dir. aarch64 for the same runtime-hash reason as `gate`.
    name: cadenza @test suites
    # Full-CI-in-nix Model-A body-swap (v-nix + v-ft data-driven CI-speed, 2026-08-06): the hand-wired body
    # (setup-rust + `cargo xtask build` store + `cargo build --release -p cdz -p cdz-run` + `cdz test` on the 4
    # Cadenza libraries) rebuilt cold every candidate (~12.1m) with NO /nix/store cache — the next advisory
    # runner-cost slot-hog after C (nix-flake 48m) + cdz-agent-host (x86, held on v-ah-host's hang fix). The nix
    # check `checks.<sys>.cad-tests` (cdzCadTestsCheck) runs the IDENTICAL `cdz test` loop on the SAME 4 dirs
    # (implementation/cad + compiler-ml + choreography + iterators) resolving the value-heap runtime by content
    # address from the cached store. Body-swap: keep the job NAME (advisory context `checks / cadenza @test
    # suites` — verified NOT in ruleset 10560470's 10 required, so no ruleset edit; a red can't block merge),
    # swap cold→cache-warm. STAYS aarch64 (ubuntu-24.04-arm): the check builds the value-heap runtime whose
    # content hash is per-arch (same reason gate/codegen are aarch64) → `.#checks.aarch64-linux.cad-tests`. Frees
    # an arm64 slot (pure runner-cost, same axis as C; lower queue-leverage than the x86 cdz-agent-host but
    # available now + independent). Same pattern as clippy/test/codegen (#2171).
    runs-on: ubuntu-24.04-arm
    # STARVE FAIL-FAST GUARD (v-nix interim, v-gha-green 2026-08-30): under heavy fleet nix contention the
    # per-suite build (esp. the next suite after iterators — cad-tests, which builds the seed-compiler) can
    # STARVE on the big-nix-lock and hang with ZERO progress. Observed 3 consecutive hourly runs (23:18/01:00/
    # 01:32) hang ~1h30m+ on this job, blocking the WHOLE hourly-on-main cadence via the ci concurrency group
    # (next run queues forever) + forcing a hand-cancel each time. A healthy run is ~12min (cache-warm; the
    # ~12.1m note above is the COLD hand-wired body); 30min = ~2.5x headroom for a contention-slow-BUT-progressing
    # run while fail-fasting a starved hang, so a starve reds THIS advisory job (non-required) instead of stalling
    # the cadence. DURABLE fix is v-nix splitting the cad/compiler-ml/choreography/iterators aggregate so no single
    # suite can starve the run. Tune N with v-nix if healthy wall-time drifts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: cadenza @test suites — cdz test on iterators/cad/choreography/music (via nix, per-suite shred)
        # v-nix #6084 + v-gha-green: build the FOUR standalone per-suite test-shred attrs instead of the old
        # `cad-tests` aggregate. This DROPS compiler-ml from the hourly-forced set (operator 2026-08-30:
        # compiler-ml is optional — not actively changing, only an effective rust-compiler stress test; #5992
        # already removed it from local-gate). compiler-ml has NO test-shred-* attr (opt-out by construction),
        # so it is excluded here and stays advisory-only (checks.<sys>.cad-test-compiler-ml). Dropping the heavy
        # self-hosted-compiler suite from the hourly job also removes the likely nix-starvation root cause that
        # was hanging this job (complements the #5963 timeout guard above). All 4 attrs verified to resolve.
        run: nix build .#checks.aarch64-linux.test-shred-iterators .#checks.aarch64-linux.test-shred-cad .#checks.aarch64-linux.test-shred-choreography .#checks.aarch64-linux.test-shred-music --print-build-logs

  cdz-cad:
    # The NATIVE CAD mesh driver crate (implementation/seed/crates/cdz-cad, GH #400 increment G2). It is
    # EXCLUDED from the seed workspace (its own `[workspace]`) because its mesh backend links `manifold-csg`,
    # whose `-sys` crate builds the C++ manifold3d via cmake — a build the seed's `--workspace` jobs must
    # never pay. So the `test`/`clippy`/`fmt` jobs above don't cover it; gate it here on its own. The crate
    # links `manifold-csg`, so this job compiles the C++ manifold3d via cmake on the first build (cmake + a
    # C++ compiler are on the standard ubuntu runner; the Rust cache keeps re-runs fast). No wasm toolchain
    # or runtime store needed — pure native crate.
    name: cdz-cad native driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cdz-cad
      - name: Test + lint the cdz-cad crate (standalone workspace)
        working-directory: implementation/seed/crates/cdz-cad
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check

  rcdzc-wasm:
    # The Cadenza COMPILER as a WASM artifact (implementation/seed/crates/rcdzc-wasm, v-agent-harness
    # minimal-kernel K1-dep wasm-swap — operator #54). EXCLUDED + wasm-only: it builds to wasm32-wasip1 (a
    # cdylib exporting compile/alloc/dealloc the kernel loads via wasmtime), so the seed's `--workspace` jobs
    # skip it entirely — gate it here (like wasm-runtime/cdz-kernel). Two checks: the pure host-side glue
    # (compile_ast + the codec, native test/clippy/fmt), and the actual WASM BUILD (the artifact the kernel
    # runs). The wasm32-wasip1 target isn't in setup-rust's default set, so add it explicitly.
    name: rcdzc compiler-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rcdzc-wasm
      - name: Host-side glue (native test + lint)
        working-directory: implementation/seed/crates/rcdzc-wasm
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
      - name: Build the compiler wasm artifact (wasm32-wasip1)
        working-directory: implementation/seed/crates/rcdzc-wasm
        run: |
          rustup target add wasm32-wasip1
          cargo build --target wasm32-wasip1

  cdz-delegate:
    # The DELEGATED-COMPILE packaging of `cdz` (`implementation/seed/crates/cdz/src/delegate.rs`, gated
    # `#[cfg(not(feature = "standalone"))]`). The `default` feature set turns `standalone` ON, which bundles
    # `rcdzc` in-process and COMPILES OUT the delegate module — so every default-feature job above (workspace
    # build/clippy/test) never sees `delegate.rs`. The NIX build packages `cdz` with `--no-default-features`
    # (standalone OFF → delegate ON: `flake.nix`'s `seedCompiler` is `-p cdz -p cdz-run --n`), so a break in
    # the delegate path reds `nix build .#checks.<sys>.harness-runs` — the platform-conformance gate — while
    # GitHub CI stays green. This job closes that gap: it compiles + lints `cdz`/`cdz-run` in the exact
    # no-default-features config the flake uses, so a delegate build break fails a GitHub check instead of
    # only surfacing on the nix path. Pure native (no wasm toolchain / runtime store needed).
    name: cdz delegate-compile build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cdz-delegate
      - name: Build + lint cdz with the delegate feature (standalone OFF, as the nix build packages it)
        run: |
          cargo build -p cdz -p cdz-run --no-default-features
          cargo clippy -p cdz -p cdz-run --no-default-features -- -D warnings

  nix-flake:
    name: nix flake check (advisory)
    runs-on: ubuntu-24.04-arm
    # ADVISORY is enforced HERE, not only in branch protection: `continue-on-error` makes a red
    # `nix flake check` NOT fail the workflow, so a flake hiccup on this deliberately-uncached slow
    # job can't red every candidate (github-liaison #1805). Non-required in branch protection is the
    # belt; this is the suspenders — the job stays truly advisory regardless of protection config.
    # Drop this (and add to required checks) in the deliberate promote-to-required follow-up.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # DeterminateSystems installer = the standard multi-user nix on a GHA runner (flakes on by
      # default). Pinned to the latest RELEASE tag (v22) — not `@main` — since a moving ref on a
      # third-party action that installs Nix is a supply-chain surface (github-liaison #1805, operator
      # supply-chain caution). Matches the repo's tag-pinning convention for third-party actions.
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      # SCOPED to the reproducibility-BACKSTOP subset (v-nix + v-ft data-driven CI-speed, 2026-08-05): a full
      # `nix flake check` rebuilt the UNION of ALL flake outputs (~48.6m advisory) — redundantly re-running the
      # whole required-job set (clippy/test/codegen/gate/bench/guide/roundtrip/fmt/kernel+host-native/rcdzc-wasm/
      # cad — each already run WITH the cache by its own required job), gating nothing + eating runner slots
      # (queue-wait median 5.3m/p90 12m fleet-wide). `checks.flake-repro-backstop` keeps ONLY the coverage this
      # advisory job UNIQUELY provides — the 3 through-nix hash-parity checks (nix-built bytes' sha256 == the
      # committed REQUIRED_RUNTIME_HASH/DEBUG_RUNTIME_HASH/REQUIRED_NFC_HASH), component validity, the project
      # @test suites, + the closure-assert — dropping the redundant rebuild. Required-set coverage is unchanged
      # (those jobs still run); this just stops re-doing their work cold. (`nix flake check` locally still runs
      # everything.) Advisory + continue-on-error retained.
      - name: nix reproducibility backstop (scoped from full flake check)
        run: nix build .#checks.aarch64-linux.flake-repro-backstop --print-build-logs

  roundtrip:
    # Every corpus program must round-trip through the syntax surfaces — guards cadenza-syntax
    # independently of the compiler. Full-CI-in-nix cutover (Model A): body runs the nix `checks.roundtrip`
    # derivation (identical `cargo xtask roundtrip`, hermetic), keeping `name: syntax roundtrip` so the
    # required context `checks / syntax roundtrip` is UNCHANGED (no ruleset edit — only the RUNNER moves).
    # ARCH-INDEPENDENT (corpus-only syntax round-trip: `cdz-syntax --from binary --to <surface>` parse/print,
    # NO runtime store / per-arch hash / wasmtime — v-nix verified 2026-08-07). QUEUE-BALANCE swap (v-nix+v-ft):
    # moved x86→ARM. The x86 required pool carried 3.1x arm's run-minutes (28.9m/7 jobs incl. all 3 ~7m heavies
    # vs 9.3m/3), which IS the queue-wait p90 tail (x86 slot-pool oversubscribed, arm idle). roundtrip (7.2m) is
    # the biggest ARCH-PORTABLE non-test-ubuntu x86 job → moving it to arm takes the most x86 load off (28.9→21.7m,
    # -25%) without creating an arm pole (arm 9.3→16.5m, still < x86's 21.7m). Drops the p90 tail for ALL x86 jobs
    # incl. the 2 remaining heavies (clippy-shard-b + test-ubuntu). (Was on x86 to free arm; the imbalance reversed.)
    name: syntax roundtrip
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: cargo xtask roundtrip (via nix)
        run: nix build .#checks.aarch64-linux.roundtrip --print-build-logs

  bench:
    # Runtime allocation regression check (allocation COUNT, deterministic native↔wasm) vs the
    # committed baseline. Full-CI-in-nix cutover (Model A): body runs the nix `checks.bench-check`
    # derivation (`cargo run --locked -- bench`, hermetic — runs cdz-runtime's #[ignore]d ceilings test +
    # diffs vs spec/bench/.alloc-baseline), keeping `name: allocation bench` so the required context
    # `checks / allocation bench` is UNCHANGED (no ruleset edit). ARCH-INDEPENDENT: the allocation COUNT
    # is deterministic across arches (not wall-clock/codegen), so it runs on the DEFAULT x86 runner via
    # `checks.x86_64-linux.bench-check` (frees ARM; matches the GHA x86 baseline, github-liaison #2042).
    name: allocation bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: cargo xtask bench (via nix)
        run: nix build .#checks.x86_64-linux.bench-check --print-build-logs

  guide-examples:
    # PRE-MERGE gate for the guide's runnable content — BLOCKS the merge (a PR shipping an example that
    # doesn't compile/run, or breaking the guide build, can't merge). Full-CI-in-nix cutover (Model A): the
    # body runs the HERMETIC nix `guide-examples` check, which replicates wasm-pack (cargo build --target
    # wasm32-unknown-unknown + a PINNED wasm-bindgen CLI + a PINNED wasm-opt from pkgs.binaryen — NO github
    # download) then runs the exact npm battery (test:unit → prose → diagnostics → examples → calculator →
    # worker-stack → tuple-collection → cad-preload → music-preload → build → bundle) + stages the value-heap
    # runtime from the nix component store. Keeping `name: guide examples` leaves the required context
    # `checks / guide examples` unchanged (no ruleset edit). Pinning binaryen in the flake KILLS the
    # gate-time binaryen-download flake (operator Slack seq 142: "include binaryen as part of the nix
    # flake instead of downloading arbitrary binaries at build time").
    #   aarch64 (ubuntu-24.04-arm): the guide bundles the value-heap runtime whose content hash is
    #   arch-specific → the nix check is checks.aarch64-linux.guide-examples.
    #
    # RELATION TO pages.yml (INTENTIONAL divergence — NOT lockstep): this pre-merge gate is the HERMETIC
    # NIX check; pages.yml's post-merge deploy still runs the NON-nix flow (pinned rust-toolchain + cargo
    # binstall wasm-pack + cargo xtask build/guide-wasm + npm). Different engines by design — the nix check
    # is the authoritative pre-merge gate (hermetic + pinned-binaryen); pages.yml is the deploy-time build.
    # They cover the same guide-example CONTENT (a broken example fails both) but are NOT byte-for-byte
    # mirrors and should NOT be kept step-for-step in sync. If pages.yml's build gains a NEW check a reader
    # would hit, add the equivalent to the NIX guide-examples check (the `guideExamplesCheck` derivation in
    # flake.nix), not here. (pages.yml moving to nix too is a possible future step, not planned yet.)
    name: guide examples
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Enable ca-derivations so CI builds + reuses the per-case content-addressed corpus cache (#3363)
          # instead of rebuilding the world (operator 2026-08-26). Appends to the installer nix-command/flakes.
          extra-conf: "extra-experimental-features = ca-derivations\naccept-flake-config = true\nextra-substituters = https://camshaft.cachix.org\nextra-trusted-public-keys = camshaft.cachix.org-1:vJQM+N6ilGdDPFSUiH0tL5pBLZ/cD4acir7t4I2zGSc="
      - uses: ./.github/actions/nix-store-cache
      - name: guide examples (via nix — hermetic, pinned binaryen/wasm-bindgen)
        run: nix build .#checks.aarch64-linux.guide-examples --print-build-logs

  emoji-lint:
    # ADVISORY (NON-required — NOT in ruleset 10560470): durable CI enforcement of the emoji-ban (operator
    # directive — no decorative emoji in compiler-source COMMENTS). The local `cargo xtask check` + the
    # pr-sync re-gate already run emoji_free_lint (#2570), but checks.yml fans out per-STEP nix jobs and does
    # NOT run the monolithic `check`, so CI alone wouldn't red on a new comment-emoji — this job closes that
    # gap. Runs the standalone `cargo xtask lint-emoji` (#2579): comment-SCOPED (walks implementation/ only,
    # excludes xtask/fleet + quoted string literals + codepoint-doc test data), exits 1 with file:line:char
    # on a hit. WHY a dedicated subcommand not a raw grep (v-nix+v-ft 2026-08-07): a naive emoji-range grep
    # over *.rs FALSE-POSITIVES on the ~13 files with legitimate emoji in STRING LITERALS (the syntax crate
    # must lex/parse/print emoji) — only the comment-scoped parse distinguishes banned-comment-emoji from
    # required-string-emoji. NON-required + isolated (a lint false-alarm must NOT red a required context like
    # fmt); operator can promote it to required later via an additive-first ruleset-add lockstep (v-ft owns
    # that half). x86 default runner (arch-independent text lint; keeps the arm pool free per the roundtrip
    # rebalance). No nix / wasm / runtime store — just compiles xtask + walks source (fast).
    name: emoji-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: emoji-lint
      - name: lint-emoji (comment-scoped emoji-ban)
        # Run the standalone xtask-lint-emoji crate binary DIRECTLY (v-xtask-decompose carved the lint into
        # its own minimal-dep crate; `cargo xtask lint-emoji` now forwards to the nix `apps.lint-emoji`, which
        # exit-127s on this deliberately nix-free runner). `cargo run -p xtask-lint-emoji` compiles only that
        # crate + xtask-support and lints cwd (the repo root) — no nix, no full-tree compile, keeps this fast.
        run: cargo run -p xtask-lint-emoji
