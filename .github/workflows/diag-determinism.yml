name: diag-determinism
on:
  push:
    branches: [spec]
    paths: [".github/workflows/diag-determinism.yml"]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: diag4
      - name: Install binaryen wasm-opt
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"
      - name: Candidate canonicalization pipeline
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -euo pipefail
          cd implementation/seed/crates/cdz-runtime
          cargo build --release --target wasm32-unknown-unknown
          CORE=target/wasm32-unknown-unknown/release/cdz_runtime.wasm
          wasm-opt --all-features --reorder-functions-by-name "$CORE" -o /tmp/canon-core.wasm
          wasm-tools component new /tmp/canon-core.wasm -o /tmp/canon-comp.wasm
          wasm-tools strip -a /tmp/canon-comp.wasm -o /tmp/canon-final.wasm
          echo "X86 CANONICAL HASH:"
          sha256sum /tmp/canon-final.wasm
