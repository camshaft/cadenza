# Reusable artifact-build workflow — produces the release payload.
#
# Shared by release.yml (tags) and nightly.yml (rolling prerelease). Two parallel legs:
#   - `binaries`: the CLI tools (cdz, cdz-run) built per platform, NATIVELY
#     (each platform on its own runner — GitHub now offers free x86_64 + arm64 Linux and arm64
#     macOS runners, so no cross toolchain is needed), tarred as `cdz-<version>-<target>.tar.gz`.
#   - `runtime`: the content-addressed value-heap runtime component, produced ONCE (it is a
#     wasm32 artifact, platform-independent), named by its content hash.
#
# Both legs upload artifacts the caller downloads and attaches to a Release.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version label baked into artifact names (e.g. v1.2.3 or nightly).
        type: string
        required: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.target }}

      # Build the three shipped CLI binaries. Native host target, so no `--target` flag: the
      # runner's host IS matrix.target (pin verified by the check below). `--locked` enforces the
      # committed root Cargo.lock (tracked as of #1748, the operator's determinism directive): the
      # build fails if the lock is stale vs any Cargo.toml, so a dep bump must land the updated lock
      # deliberately rather than silently regenerate one per checkout.
      - name: Build release binaries
        run: |
          cargo build --release --locked \
            -p cdz --bin cdz \
            -p cdz-run --bin cdz-run

      # Package. `tar` the binaries + a README pointer under a versioned name.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage="cdz-${{ inputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp target/release/cdz target/release/cdz-run "dist/$stage/"
          cp README.md "dist/$stage/" 2>/dev/null || true
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          ( cd dist && shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256" )
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  runtime:
    name: value-heap runtime
    # aarch64: the published runtime must be the canonical build whose content hash matches the
    # committed REQUIRED_RUNTIME_HASH (recorded on aarch64). The runtime wasm is not yet byte-
    # identical across host arches (a function-order canonicalizer is planned); until then we publish
    # the aarch64 artifact so its hash is the one programs pin. See runtime-cross-arch-determinism.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          wasm-tools: "true"
          cache-key: release-runtime

      # `cargo xtask build` compiles the runtime component, canonicalizes it (strips the
      # non-deterministic tool-version sections), content-addresses it, and writes it to the store
      # as <hash>.wasm plus a runtime.toml manifest. We publish the canonical stored bytes — the
      # exact artifact a program pins by hash.
      - name: Build the content-addressed runtime
        run: cargo xtask build

      - name: Stage the runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          store=target/cadenza-store
          hash=$(sed -n 's/^runtime = "\(.*\)"/\1/p' "$store/runtime.toml")
          test -n "$hash"
          mkdir -p dist
          cp "$store/$hash.wasm" "dist/cadenza-runtime-$hash.wasm"
          cp "$store/runtime.toml" dist/runtime.toml
          ( cd dist && shasum -a 256 "cadenza-runtime-$hash.wasm" > "cadenza-runtime-$hash.wasm.sha256" )
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: runtime
          path: |
            dist/cadenza-runtime-*.wasm
            dist/*.sha256
            dist/runtime.toml
          if-no-files-found: error
