# Release — on a version tag, gate then publish a GitHub Release with the built artifacts.
#
# Trigger: pushing a tag like `v1.2.3`. The flow is:
#   checks (parallel health gate) ─┐
#                                  ├─► release (download artifacts, create the GitHub Release)
#   build  (binaries + runtime)  ──┘
# checks and build run concurrently; release waits for both, so a tag that fails the gate never
# ships. Artifacts: per-platform binary tarballs + the content-addressed runtime wasm + checksums.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Release and upload assets

jobs:
  # Re-run the full health gate on the tagged commit — a release must be green.
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [checks, build]
    steps:
      - uses: actions/checkout@v4

      # Collect every artifact both build legs uploaded into one flat dir.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/cadenza-runtime-*.wasm
            artifacts/runtime.toml
