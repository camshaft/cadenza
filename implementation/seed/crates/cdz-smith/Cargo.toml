# cdz-smith — a coverage-friendly fuzzer for the reference compiler (`rcdzc`).
#
# It GENERATES Cadenza programs (as canonical s-expr text), feeds each through the real
# `rcdzc` compile path IN-PROCESS, and treats a PANIC (an `.unwrap()`/`.expect(`/`unreachable!`
# firing — a compiler bug, never a user error, since the compiler reports every "no" as DATA:
# a `Diagnostic`/decline) or a TIMEOUT as a finding. Findings are shrunk, deduplicated by crash
# SITE, and dropped into `spec/semantics/failures/` as a runnable `.sexp` reproducer + a `.md`
# triage note — the queue an existing monitoring loop already watches and fixes.
#
# The design mirrors the compiler's own "errors are data" contract: a DECLINE or a coded
# rejection is EXPECTED output, not a bug; only an unwinding panic or a runaway is filed. The
# generator is byte-cursor-driven (a `&[u8]` → program map) so the same core is reachable three
# ways: a seeded PRNG loop (the continuous driver), a `bolero` property test (shrinking +
# `cargo test` integration + optional coverage-guided libFuzzer), and a one-shot subprocess
# worker the driver spawns for hang/hard-crash isolation.
# cdz-smith is its OWN workspace (empty `[workspace]` table), NOT a member of the seed workspace.
# Two reasons, one manifest line: (1) its `bolero` fuzzing dependency chain pins
# `toml_datetime =0.6.3` (via `proc-macro-crate`), which cannot co-resolve in the seed workspace's
# single lockfile with the newer `toml_edit` the `toml` surface needs; a private lockfile sidesteps
# that. (2) the coverage-guided libFuzzer build (`cargo bolero`) wants an isolated crate with its own
# target dir + profiles anyway. The seed workspace's root Cargo.toml `exclude`s this path to match.
# Path deps (rcdzc, cadenza-syntax) resolve fine across the boundary — they're plain path pointers.
[workspace]

[package]
name = "cdz-smith"
version = "0.0.0"
edition = "2024"

# A dedicated profile for coverage-guided fuzzing: optimized (fast fuzzing) but with debug line info
# so a libFuzzer crash artifact / panic backtrace symbolizes to the exact rcdzc source site. Mirrors
# the seed workspace's `release-debug`. `cargo bolero` builds under `--profile fuzz` by default.
[profile.fuzz]
inherits = "release"
debug = true
overflow-checks = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cdz-smith"
path = "src/bin/cdz-smith.rs"

[dependencies]
# The compiler under test, linked as a library. `compile_component` already runs the compile on a
# 64 MB guard-stack worker thread (so deep-but-finite recursion hits the semantic DESCENT_DEPTH_LIMIT
# and declines cleanly instead of overflowing) and RE-RAISES a worker-thread panic on the caller via
# `resume_unwind` — so a `catch_unwind` around it observes every panic. That IS our crash oracle.
rcdzc = { path = "../rcdzc" }

# The front-end: parses generated s-expr text to the two-arena AST, then `codec::encode` produces the
# binary-AST bytes `rcdzc::compile_component` consumes. This is the exact bridge rcdzc's own testkit
# uses (`sexpr::read` → `codec::encode` → `compile_component`).
cadenza-syntax = { path = "../cadenza-syntax" }

# The wasm-output ORACLE: every component the compiler emits MUST validate. rcdzc's own tests assert
# this (`Validator::new_with_features(WasmFeatures::all()).validate_all`), so a fuzzer-found component
# that FAILS validation is a genuine backend miscompile — a class the crash/hang oracle is blind to.
# Same version rcdzc pins, so the validator matches exactly what the backend targets.
wasmparser = "0.239"

[dev-dependencies]
# Same version the value-heap runtime already fuzzes with. `#[derive(TypeGenerator)]` +
# `bolero::check!()` give shrinking and (under `cargo bolero`) coverage-guided engines for free.
bolero = "0.13.4"
