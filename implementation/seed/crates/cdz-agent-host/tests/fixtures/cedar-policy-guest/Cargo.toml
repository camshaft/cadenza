# A Cedar-policy wasm-COMPONENT authorizer fixture — a wit-bindgen Rust guest that embeds a Cedar
# PolicySet and exports the `cadenza:agent-kernel-authz` authorizer-world's `authorize` function. This is
# the operator's "Cedar as a content-addressable wasm component" pillar (§20b) in its guest form: the
# kernel's ComponentAuthorizer (v-agent-harness's lane) instantiates the lifted component and calls
# `authorize` to gate every effect (fail-closed — a trap/instantiate-failure is a DENY).
#
# Compiled to a wasm32-unknown-unknown core module then lifted to a component with
# `wasm-tools component new` (NOT wasm32-wasip1 — a WASI target emits wasi_snapshot_preview1 imports the
# lift can't resolve; same reason as reducer-guest). cedar-policy is pure-Rust and compiles to
# wasm32-unknown-unknown (de-risked earlier), so the whole decision engine + policy set live IN the guest.
#
# Its OWN workspace (empty [workspace]) — NOT part of cdz-agent-host's workspace: it builds for a
# different target (wasm32-unknown-unknown, cdylib), so cdz-agent-host's native `cargo test` must never
# try to build it. A build step / CI job compiles it on demand + lifts it to a component; the committed
# .component.wasm is what the e2e loads.
[workspace]

[package]
name = "cedar-policy-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen: generate the authorizer-world guest bindings (export the `authorize` func). Same version
# reducer-guest uses so the two fixtures agree on the bindgen ABI.
wit-bindgen = "0.45"
# cedar-policy: the real Cedar decision engine, embedded in the guest. Pure-Rust, compiles to
# wasm32-unknown-unknown (verified). The guest parses its embedded PolicySet + runs is_authorized.
cedar-policy = "4"
