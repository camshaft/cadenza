# cdz-agent-host — the REAL effect executors + authorizer that make a kernel session actually RUN
# against the world (v-agent-harness-host). The `cdz-kernel` crate owns the generic if-this-then-that
# spine + the `Executor`/`Authorize` TRAIT definitions; THIS crate provides the concrete impls that
# perform effects for real: a system-clock executor for `Now`, an HTTP client for `Http`, a Bedrock
# model executor for `Model` (the standing cred-broker / Bedrock-direct directive), and a Cedar-as-wasm
# authorizer (§10/SEC-F1 deny-by-default). It DEPENDS ON cdz-kernel and never edits its src — the shared
# surface is only the trait signatures (`Executor::perform`, `Authorize::authorize`).
#
# Its OWN workspace (empty `[workspace]` table), NOT a member of the seed workspace — the same isolation
# cdz-kernel/cdz-cad use, so the seed's `cargo build --workspace` + corpus gate never pay for the
# executors' (future) network/AWS/wasmtime tree. A dedicated CI job gates it (its own cargo test + fmt +
# clippy — cdz-kernel is not in `xtask check`, and neither is this).
[workspace]

[package]
name = "cdz-agent-host"
version = "0.0.0"
edition = "2021"
publish = false

# The real multi-session daemon binary (operator headline): boot the host from ONE TOML config path (the
# only cli arg). Its live wiring (live_executor_set / real transports) is `#[cfg(feature = "live-net")]`;
# a no-op main covers the default build so the bin target always has a main + the default gate stays
# hermetic. Run: `cargo run --bin cdz-agent-daemon --features live-net -- /path/to/daemon.toml`.
[[bin]]
name = "cdz-agent-daemon"
path = "src/bin/cdz_agent_daemon.rs"

[features]
# `live-net` gates executors that touch the network (the Bedrock model executor, a real HTTP client) —
# OFF by default so the default build/tests never make a network call or need AWS credentials, exactly
# like cdz-kernel's `live-exec` gates the one subprocess-spawning executor. CI lints AND tests
# `--features live-net` where a runner has egress; the default gate stays hermetic.
#
# It enables the real transports' network deps (reqwest for the HTTP client, the aws-sdk for the Bedrock
# model transport) — kept OPTIONAL so the default build never compiles them (no reqwest/hyper/rustls/aws
# tree, no network types). The `dep:` bindings tie the optional dependencies to this feature only.
live-net = ["dep:reqwest", "dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]

# `live-exec` gates the ShellExecutor — the executor that RUNS LOCAL COMMANDS (cargo/git/gh) so an agent can
# do real work toward the self-hosting harness (GAP-2). OFF by default so the hermetic gate NEVER spawns a
# subprocess (exactly like `live-net` gates the network executors + mirrors cdz-kernel's own `live-exec`
# gate on its subprocess executor). No extra deps — the executor uses `std::process` from std; this feature
# just compiles the `shell` module + its LiveExecutorSet wiring. The executor is deny-by-default (an explicit
# program allow-list) and exec's directly (no `sh -c` — CWE-78 injection-safe); it sits behind the kernel's
# Cedar `shell`-family capability gate (two independent authz layers).
live-exec = []

# `live-fs` gates the FsExecutor — the executor that reads/writes/globs real files (GAP-3) so an agent can
# edit the source it builds. OFF by default so the hermetic gate never touches the real filesystem (like
# `live-exec`/`live-net` gate the process/network executors). No extra deps — uses `std::fs`; this feature
# just compiles the `fs_exec` module. The executor is thin MECHANISM (deny-by-default path policy lives in the
# Cedar wasm authorizer on the effect's resolved target, NOT in the host — operator standing-order).
live-fs = []

# `admin` gates the ADMIN CONTROL INTERFACE's transport — the Unix-domain-socket listener that carries
# admin command/response frames to a running daemon (operator: "a way to communicate with the daemon + send
# it commands as an admin"). OFF by default so the hermetic gate BINDS NO SOCKET + pulls no tokio `net`
# tree: the admin COMMAND layer + wire CODEC stay always-on (hermetically tested), only the socket LISTENER
# is feature-gated. It enables tokio's `net` feature (for `UnixListener`/`UnixStream`) + `io-util` (the
# `AsyncReadExt`/`AsyncWriteExt` the frame read/write use). Local IPC only — a Unix socket is not network
# egress, so this is not the same concern as `live-net`; gating it keeps the default build listener-free.
admin = ["tokio/net", "tokio/io-util", "tokio/signal"]

# `live-ws` gates THE OUTPOST's websocket LISTENER (O1b-2) — binds a TCP port, accepts peer websocket
# connections, and moves opaque message frames in/out (surfacing them as `Inbound` events + the
# `ws/connect`/`ws/disconnect` lifecycle the always-on `ws_socket` loop-core builds, routing via the
# `WsControlOp` channel). OFF by default so the hermetic gate BINDS NO SOCKET + pulls no tokio `net` /
# tungstenite tree (like `admin` gates its Unix-socket listener). The `ws/send` executor + the
# `LiveWsConnRegistry` + the event builders stay always-on (hermetically tested); only this live LISTENER is
# opt-in. PURE BYTE TRANSPORT (operator: transport-level only) — opaque frames, NO JSON-RPC/MCP framing
# (userspace). Enables tokio `net`/`io-util`/`rt` + `tokio-tungstenite` (async websocket) + `futures-util`
# (the `SinkExt`/`StreamExt` the split read/write halves use).
live-ws = ["tokio/net", "tokio/io-util", "tokio/rt", "dep:tokio-tungstenite", "dep:futures-util"]

# `metrics-export` gates the observability EXPORT emitter — the daemon periodically reports the metrics
# registry to a backend (statsd first) over the network. OFF by default so the hermetic gate never sends UDP
# / opens a socket: the metric RECORDING (registry Counters, always-on since seq-116) stays hermetic; only
# the periodic EXPORT to a collector is feature-gated. The statsd sink uses std::net::UdpSocket (a blocking
# send off the periodic timer tick — not hot-path — so no tokio `net` is needed). No extra deps: the
# s2n-quic-dc-metrics StatsdBackend is already in the always-on dep; this feature just compiles the sink +
# the report task. The BASE feature stays DEP-FREE — the statsd path pulls nothing beyond std.
metrics-export = []

# `metrics-export-otlp` adds the OTLP export backend on top of `metrics-export`. STRICTLY opt-in + kept
# SEPARATE from the base so the hermetic default (and a statsd-only `metrics-export` build) NEVER links the
# HTTP tree (concierge guard 1: verify `cargo tree` on the default build shows no reqwest AND no prost). It
# enables (a) `dep:reqwest` — the async HTTP client the OTLP forwarder POSTs protobuf payloads with (already
# optional for `live-net`, so this is additive), and (b) `s2n-quic-dc-metrics/otel` — the metrics crate's own
# OTLP feature (`otel = ["dep:prost"]`, OFF by default) that unlocks `backend::OtlpBackend`/`OtlpSink`. The
# OTLP sink is a NON-blocking channel push (its `send` runs inside the sync report cycle, so it must not
# block); a separate async forwarder task drains the bounded channel and POSTs, dropping + logging on
# backpressure or a failed POST (guard 2: telemetry is best-effort, must never block/panic the report loop).
metrics-export-otlp = ["metrics-export", "dep:reqwest", "s2n-quic-dc-metrics/otel"]

# `metrics-export-cloudwatch` adds the AWS CloudWatch export backend on top of `metrics-export`. STRICTLY
# opt-in + kept SEPARATE from the base so the hermetic default (and a statsd/otlp/prometheus build) NEVER
# links the AWS SDK tree (verify `cargo tree` on the default build + a plain `metrics-export` build shows no
# aws-sdk-cloudwatch). It enables (a) `dep:aws-sdk-cloudwatch` — the CloudWatch `PutMetricData` client the
# forwarder pushes batched metric data to, and (b) reuses the already-optional `dep:aws-config` (the SDK
# default credential provider chain — env/profile/IMDS, no broker, matching the S3/dynamo/Bedrock backends).
# CloudWatch is a PUSH backend: the backend ACCUMULATES a report's metric data (name + value + dimensions) into
# an in-memory batch, then on `report_end` hands the owned batch to the async forwarder over a bounded channel
# via a NON-blocking `try_send` (its accumulation runs inside the sync report cycle, so the hand-off must not
# block); a separate `run_cloudwatch_forwarder` task drains the channel and calls `PutMetricData`, chunking to
# CloudWatch's 1000-datum-per-call limit and dropping + logging on backpressure or a failed API call (guard 2:
# telemetry is best-effort, must never block/panic the report loop).
metrics-export-cloudwatch = ["metrics-export", "dep:aws-sdk-cloudwatch", "dep:aws-config"]

# `metrics-export-prometheus` adds the PULL prometheus export backend: the daemon SERVES an HTTP scrape
# endpoint (`GET /metrics`) rather than pushing. STRICTLY opt-in + separate so the hermetic default (and a
# statsd/otlp build) NEVER pulls tokio's `net` tree (guard: verify `cargo tree` on the default build shows no
# tokio net feature via prometheus). It enables tokio's `net` + `io-util` (for the `TcpListener` +
# `AsyncReadExt`/`AsyncWriteExt` the hand-rolled HTTP/1.1 responder uses) — NO hyper/axum, the responder is
# hand-rolled (same dep-light pattern as the admin Unix-socket listener). The `PrometheusBackend`/handle live
# in the always-on s2n-quic-dc-metrics dep (NOT behind a crate feature, unlike otel), so no extra crate
# feature is needed here. Security posture (concierge): the scrape endpoint's `bind` is required (no default);
# a LOOPBACK bind just works, but a non-loopback bind for this unauthenticated endpoint is REJECTED at config
# validation unless `allow_non_loopback = true` (opt-in by intent), and still warned at boot.
metrics-export-prometheus = ["metrics-export", "tokio/net", "tokio/io-util"]

# `live-aws-storage` gates the AWS-NATIVE storage backends (operator directive: "AWS native backends for all of
# the host traits") — the S3-backed BlobStore (and, as later increments land, the DynamoDB-backed LogSink +
# name/session stores). OFF by default so the hermetic gate pulls NO AWS SDK and the default build/tests use the
# in-memory / local-disk backends (MemBlobStore / DiskBlobStore etc.) with no credentials. It's SEPARATE from
# `live-net` (which gates network EGRESS EFFECTS — the Bedrock model / HTTP executors a reducer performs);
# storage backends are the host's OWN durability, a distinct concern, so they get their own gate. It reuses the
# already-optional `aws-config` (the SDK-default credential chain — env/profile/IMDS, no broker) + `aws-smithy-
# types`, and adds `aws-sdk-s3`. Credentials come from the environment via the SDK default provider (same
# contract as the Bedrock transport). The trait stays the seam: a consumer holds `Box<dyn BlobStore>` and never
# sees an AWS type — the daemon just selects the S3 backend by config when this feature is compiled.
live-aws-storage = ["dep:aws-config", "dep:aws-smithy-types", "dep:aws-sdk-s3", "dep:aws-sdk-dynamodb", "dep:zstd"]

[dependencies]
# The kernel whose Executor/Authorize traits + effect/event types we implement. Path dep across the
# workspace boundary (both are their own workspaces). We CONSUME these traits; we never edit its src.
cdz-kernel = { path = "../cdz-kernel" }
# bytes — ref-counted, O(1)-clone byte buffers. Operator perf directive (2026-08-02, relayed by concierge
# + v-agent-harness): use `bytes::Bytes` instead of `Vec<u8>` for effect payloads / bodies / any buffer
# that is cloned or shared, so a clone is a refcount bump + slice, not a deep memcpy. This crate is NEW,
# so we build Bytes-first (no migration) — the hot path is a model completion body. `Bytes: From<Vec<u8>>`
# and the reflexive `From` keep our `Payload::Inline(x.into())` sites compiling whether the kernel's
# `Payload::Inline` inner type is still `Vec<u8>` (today) or `Bytes` (after v-agent-harness's flip).
bytes = "1"
# tokio — the async runtime for the single-threaded multi-session host loop (AsyncAgentHost). Operator
# async directive (session multiplexing + cooperative gas-yield). SINGLE-THREADED by design: sessions
# hold non-Send kernel trait objects (Reducer/Authorize/Executor aren't `: Send`) + wasmtime types, so
# the host runs ONE task with a `select!` over all sessions' inbound channels + a timer — interleaving
# sessions cooperatively (§15b determinism is single-threaded; agents are I/O-bound so parallelism isn't
# the win). v-agent-harness's kernel-async lands on the SAME single-threaded assumption, so the blocking
# `deliver` here becomes `.await` with no reshape. Minimal feature set (no multi-thread runtime needed).
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# async-trait — object-safe async methods, matching the kernel's `Reducer`/`Executor`/`Authorize` traits
# (all async, single trait each). My `ModelTransport`/`HttpTransport` sub-traits + my native `impl Executor`
# for the executors use `#[async_trait(?Send)]` (single-threaded host, non-Send transport futures — §15b).
async-trait = "0.1"
# getrandom — OS entropy for a fresh session's SPAWN NONCE (§lifecycle I2a). v-agent-harness's
# `Session::genesis(reducer, spawn_nonce)` made `genesis_hash` (= the host's SessionId) per-session-UNIQUE
# by hashing a caller-supplied nonce into the seq-0 Genesis event; the HOST mints that nonce (kernel stays
# clock/entropy-free, §9c). We draw 32 fresh OS-random bytes and hash them into a `Hash` (blake3 semantics
# via `Hash::of`, NOT `Hash::from_bytes` — the nonce is a HASH of entropy, keeping the type's invariant).
# Minted ONCE at fresh genesis + recorded in the durable log; replay/recover reads it back FROM the log
# (never re-mints — a re-mint would change the SessionId on recovery). Tiny, std-only, no network.
getrandom = "0.2"
# serde + toml — the daemon's single-TOML config (operator directive: "set the entire thing up via config
# and not from cli args; the only arg I want is the path to the config"). serde derives the config schema;
# toml parses the file. Small, always-on (the config layer is part of the daemon's core, not feature-gated
# behind live-net) — a `DaemonConfig` deserialize is cheap + the daemon binary needs them unconditionally.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# serde_json — the wire codec for the admin control interface. Admin commands/responses cross a control
# frame as JSON (a human-inspectable, versionable wire contract), so the daemon + an admin client speak the
# same shape. Always-on (the admin command layer is daemon-core, like the config); the SOCKET that carries
# the frames is feature-gated, but the CODEC is hermetically testable without any transport, so it lives in
# the default build where CI's `cargo test` covers it.
serde_json = "1"
# tracing — the structured-tracing FACADE (spans/events + #[instrument]). Always-on: the host loop /
# session / dispatch instrumentation lives in the library, and the facade is a near-zero-cost no-op when no
# subscriber is installed (a default-build test / an embedder pays ~nothing + stays silent). cdz-kernel takes
# the SAME `tracing` 0.1 (facade only) so kernel spans nest under the host's — matched across the crate
# boundary to avoid version skew. Only the daemon initializes a subscriber (below); the kernel never does.
tracing = "0.1"
# tracing-subscriber — the SUBSCRIBER the daemon installs from `[tracing]` config (EnvFilter directive
# parsing + the fmt layer: compact/pretty/json + the stderr/stdout/file writer). HOST-ONLY (cdz-kernel does
# NOT take this — it only emits via the facade); the daemon bin is the sole subscriber-init site. `env-filter`
# for the RUST_LOG-grammar `filter`, `fmt` (default) for the formats, `json` for the json format.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# s2n-quic-dc-metrics — the operator's metrics REGISTRY (seq-115/116: "use it directly, don't reinvent; we
# get histograms + reporting for free"). ALWAYS-ON default dep: HostMetrics/EffectMetrics are defined as this
# crate's registry Counters/Summaries (the recorder surface), and the export backends fan out from the
# registry. Verified network-egress-FREE base (no QUIC/reqwest/TLS; the arrow/otel backends are opt-in
# features of the crate, NOT enabled here) — so it honors the hermetic-default-gate (hermetic = no NETWORK,
# not no-deps). Git dep = the operator's fork; branch=main HEAD tracks their metrics work.
# Pinned to an exact rev (not a bare branch=main) for a REPRODUCIBLE build (#2084 review): a moving branch
# would let `cargo update` drift the seed off the locked rev + can break when upstream main moves. The rev is
# the lock's pinned HEAD; bump it deliberately when adopting new metrics-crate work. (Also keeps v-nix's
# importCargoLock outputHashes key stable — the lock source names this exact rev.)
s2n-quic-dc-metrics = { git = "https://github.com/camshaft/s2n-quic", rev = "7ec9f027424badd576436d29d05f75c8d8594133" }
# reqwest — the real async HTTP client behind the `HttpTransport` seam. OPTIONAL, enabled only by
# `live-net` (default build never compiles it — keeps the hermetic gate free of the network/TLS tree).
# `rustls-tls` (not the platform's OpenSSL) so it builds on any runner with no system SSL dep;
# `default-features = false` drops the default native-tls + the blocking client we don't use. The
# single-threaded host awaits reqwest's async client directly (no `Send` bound needed — `#[cfg]`-gated
# `ReqwestHttpTransport` is constructed on the host task).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# tokio-tungstenite + futures-util — THE OUTPOST's async websocket listener behind `live-ws` (O1b-2). OPTIONAL
# (default build compiles no websocket/net tree). `default-features = false` + `handshake` only: a plain-ws
# listener over local/loopback needs no TLS (a wss terminator is a later opt-in), keeping the rustls-everywhere
# posture with no extra tree. futures-util supplies SinkExt/StreamExt for the split read/write halves.
# `handshake` = the server accept (the listener); `connect` = the client dial the live-ws E2E uses to drive a
# real loopback round-trip (in-process client -> listener -> back). Both are plain-ws (no TLS feature).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake", "connect"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
# aws-sdk-bedrockruntime + aws-config — the real Bedrock model transport behind `live-net`. OPTIONAL
# (default build compiles no AWS tree). Credentials come from the ENVIRONMENT via the SDK's default
# credential provider chain (operator directive: pull creds from the environment; NO Membrain, NO broker,
# no credential wiring in this repo).
#
# `default-features = false` drops the platform native-tls (we bring rustls instead — no system OpenSSL,
# matching reqwest), BUT the SDK's default set also carries the HTTPS CONNECTOR (`default-https-client`)
# and the async RUNTIME (`rt-tokio`) that `.send().await` needs at runtime — so we MUST re-enable those
# explicitly or a live-net call would fail with no connector/runtime (PR #1841 review, verified). So the
# enabled set is: rustls (TLS backend) + default-https-client (the hyper connector) + rt-tokio (the tokio
# sleep/timeout runtime). aws-config additionally keeps `behavior-version-latest`. This enabled set gives
# the DEFAULT credential chain — env vars (AWS_ACCESS_KEY_ID / _SECRET_ACCESS_KEY / _SESSION_TOKEN +
# region), the shared config/credentials PROFILE, and IMDS — all constructed unconditionally by
# aws-config's default_provider (verified: only the SSO leg is `#[cfg(feature = "sso")]`). The one
# credential source we do NOT compile in is SSO (the `sso` feature) — and `credentials-process` — which we
# leave off. Env-var creds are the operator's directed source (no broker, no Membrain); profile + IMDS
# also work out of the box, SSO would need `sso` added.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rustls", "default-https-client", "rt-tokio"], optional = true }
# aws-smithy-types — for `Document`, the aws-sdk's dynamic JSON value type that a Bedrock `Converse` tool-use
# input / tool-result / tool inputSchema is expressed in. The GAP-1 tool-calling transport owns the
# JSON⟷Document boundary (O4: the kernel carries opaque JSON bytes, the host maps them to/from Bedrock's
# Document). Already in the tree transitively via aws-sdk-bedrockruntime; named directly here so the
# conversion helper can construct/destructure `Document`. Behind `live-net` (only the real transport needs it).
aws-smithy-types = { version = "1", optional = true }
# aws-sdk-s3 — the S3-backed BlobStore behind `live-aws-storage` (operator: content-addressed blobs are "the
# obvious thing to put in S3"). OPTIONAL (default build compiles no S3 tree). Same `default-features = false` +
# rustls / default-https-client / rt-tokio enabled set as aws-sdk-bedrockruntime above (drop native-tls, keep
# the HTTPS connector + tokio runtime `.send().await` needs). Credentials come from the SDK default provider
# chain (env/profile/IMDS) via the shared `aws-config`, exactly like the Bedrock transport — no broker, no
# hardcoding.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "default-https-client", "rt-tokio"], optional = true }
# aws-sdk-dynamodb — the DynamoDB-backed durable event LOG behind `live-aws-storage` (operator: AWS-native
# backends for all host traits; `LogConfig::Dynamo { table }` selects it). OPTIONAL (default build compiles no
# dynamodb tree). Same `default-features = false` + rustls / default-https-client / rt-tokio set as the other
# aws-sdk crates. Credentials from the SDK default provider chain (env/profile/IMDS) via the shared aws-config.
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rustls", "default-https-client", "rt-tokio"], optional = true }
# zstd — the compression codec for GAP-4 D2 cold-log compression (compress DynamoLogSink event bodies on
# append, decompress on read). HOST-side only (the kernel stays codec-free per the concierge Option-B ruling),
# behind `live-aws-storage` (the dynamo log is the D2 backend). OPTIONAL. The crate vendors libzstd via zstd-sys
# (a bundled C build) — the cdz-agent-host nix derivation already carries the full stdenv+cmake+cc (for
# aws-lc-sys), so the native build resolves offline (v-nix confirmed; flate2 is the pure-Rust fallback if not).
zstd = { version = "0.13", optional = true }
# aws-sdk-cloudwatch — the CloudWatch `PutMetricData` client behind `metrics-export-cloudwatch` (the AWS-native
# metrics export backend, I3). OPTIONAL (default + a plain `metrics-export` build compile no cloudwatch tree).
# Same `default-features = false` + rustls / default-https-client / rt-tokio enabled set as the other aws-sdk
# crates. Credentials from the SDK default provider chain (env/profile/IMDS) via the shared aws-config.
aws-sdk-cloudwatch = { version = "1", default-features = false, features = ["rustls", "default-https-client", "rt-tokio"], optional = true }
