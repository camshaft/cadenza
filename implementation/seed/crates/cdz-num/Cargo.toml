# cdz-num — the Cadenza bignum for the RUST BACKEND (Rational/Quantity wrappers later).
#
# `Big` is NOT re-implemented here: this crate deps the shared `etude-bigint` crate DIRECTLY and
# re-exports its `Big` (operator seq-1332), so the rust backend and the wasm runtime (which also uses
# etude-bigint) agree by construction. NO `#[path]`-include of cdz-runtime's source (operator seq-1385:
# path-includes are banned). Pinned to the etude-bigint rev with `Big: Ord`/`PartialOrd` (etude PR #328),
# needed for BigInt-keyed BTreeMap/BTreeSet in emitted rust programs. That rev may LEAD cdz-runtime's pin:
# cdz-runtime keeps its frozen-hash rev (Ord is unused there → DCE'd → hash-neutral), so the two
# Cargo.locks can differ without re-freezing the runtime. A plain `rlib` in the native workspace so the
# corpus gate links it via `rustc --extern`. Crucially it is a SEPARATE crate from cdz-runtime — NOT a
# dependency of it — so it never enters the runtime's cross-crate-LTO set (that split broke frozen-hash
# reproducibility in #459); cdz-runtime's wasm hash is unaffected.
[package]
name = "cdz-num"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# The shared bignum. `bigint.rs` (source-shared via `#[path]`) re-exports `etude_bigint::Big`, so this
# crate must resolve `etude_bigint`. Pinned to the rev with `Big: Ord`/`PartialOrd` (etude PR #328) — the
# rust backend needs `Big: Ord` to emit BigInt-keyed BTreeMap/BTreeSet. Independent of cdz-runtime's pin.
etude-bigint = { git = "https://github.com/camshaft/etude.git", rev = "05084a792df1eb53bfce30322acc2563b4c05e85" }
