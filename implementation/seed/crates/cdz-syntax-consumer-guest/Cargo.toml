# The part-2 CONSUMER guest — a wit-bindgen Rust reducer guest whose world IMPORTS cadenza:syntax as a
# content-addressed +hash dep and, in its fold, CALLS the composed `parse` (P2 flavor-2, design note
# p2-reducer-invoke-cadenza-syntax-as-composable-wit-dep). MIRROR of the producer cdz-syntax-guest
# (#2673): the producer EXPORTS the cadenza:syntax world; this consumer IMPORTS it. The call is a DIRECT
# linked cross-component call through compose_dep_into_linker (v-metaprog: flavor-2 needs NO invoke-wire
# — the composed dep is an ordinary linked WIT import); the host's compose path resolves the +hash dep
# from CAS and links it leaves-first.
#
# THE +HASH IMPORT (v-ah ruled option-i, build-time template): wit/consumer.wit declares the
# cadenza:syntax import under its FULL content-addressed name with a PLACEHOLDER token
# (`cadenza:syntax/parse@0.0.0+SYNTAXGUESTHASH`). The kernel registers the dep into the consumer's linker
# under EXACTLY that name (wasm_host.rs compose); the +hash is packages.syntax-guest's content address,
# host-arch-dependent + not known at author-time, so v-nix's flake derivation regex-replaces
# `+SYNTAXGUESTHASH` → `+<resolved syntax-guest-hash>` at build (mirrors rcdzc injecting the runtime hash
# into an emitted program's import name — abi.rs:261). The committed source stays templated.
#
# Compiled to wasm32-unknown-unknown then lifted with `wasm-tools component new` (NOT wasm32-wasip1 — a
# WASI target emits wasi_snapshot_preview1 imports the lift can't resolve; same as producer/reducer-guest).
# Its OWN workspace (empty `[workspace]`) — excluded from the seed workspace (wasm32-only cdylib).
[workspace]

[package]
name = "cdz-syntax-consumer-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.45"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
