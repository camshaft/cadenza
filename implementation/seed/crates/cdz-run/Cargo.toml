# cdz-run — the generic wasm-component runner.
#
# Give it a component `.wasm`, a function to call, and its arguments; it links the value-heap runtime
# (composing `cadenza:runtime/heap` when the component imports it), invokes the export, and prints the
# rendered result. This is the ONE standard way to run a finished component — for tests, for the gate,
# for the desk. wasmtime + the filesystem live HERE and nowhere in the compiler, so the compiler core
# stays wasm-targetable (memory: cdz-rustc-pure-core-wasm-targetable).
#
# A member of the seed workspace (picked up by the crates/* glob). Depends on `cadenza-syntax` for
# canonical value rendering (string escapes, decimals) — the same renderer the front-end uses, so a
# printed value round-trips. Takes NO compiler-crate dependency.
[package]
name = "cdz-run"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "cdz-run"
path = "src/main.rs"

# FEATURE TOPOLOGY (seq-250, the cranelift-recompile P0 co-drive with v-nix). `cranelift` is DEFAULT-ON, so
# every existing consumer (the `cdz` bin, tests, the JIT gate) builds unchanged: it JIT-compiles a fresh
# component with `Component::new` and its epoch/opt-level Config knobs. Building with `--no-default-features`
# drops wasmtime's `cranelift` feature — and with it the whole `wasmtime-cranelift`/`cranelift-codegen`
# COMPILE — leaving a runtime-only `deserialize`-exec: it can only RUN precompiled `.cwasm` artifacts (via
# `Component::deserialize`), never compile. That is the AOT corpus-exec half of the split (v-nix wires the
# nix `cdz-precompile` tool that emits the artifacts + the cranelift-free exec phase-bin). See the audit:
# there is no standalone Pulley compiler — wasm→bytecode is compiled BY cranelift — so a compiler-free build
# is deserialize-only by construction. `Component::new`/`Module::new` are `#[cfg(any(cranelift,winch))]` in
# wasmtime; the `compile_component`/`compile_module` choke-points below mirror that gate.
[features]
default = ["cranelift"]
cranelift = ["wasmtime/cranelift"]

[dependencies]
# The embeddable component-model runtime — instantiate a finished component in-process, compose the
# value-heap runtime, invoke an export. (options/execution-model/; the wasmtime CLI is not used.)
# `cranelift` is pulled via cdz-run's OWN `cranelift` feature (default-on) so a `--no-default-features`
# build is compiler-free (deserialize-only); the base always keeps the `runtime` interpreter + component
# model. `runtime` already brings the Pulley interpreter (`pulley-interpreter/interp`).
wasmtime = { version = "37", default-features = false, features = ["runtime", "component-model", "std"] }
# Typed CLI with generated --help — the same parser the rest of the workspace uses.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# The platform's content-address primitive: `Hash::of(HashTag::Blob, bytes).to_string()` is the ONE
# store address — a Blob-tagged blake3 digest rendered base62 (design §8). `content_address` delegates
# here so a store artifact's address is byte-identical to the store's own `put()` (blob_store.rs) and to
# the `+<hash>` dep suffix the compiler emits. Dep-minimal (cadenza-ast + blake3), so it stays light.
cdz-contract = { path = "../cdz-contract" }
# Canonical value rendering (string escape, decimal form) — reused so a runner-printed value is
# byte-identical to what the front-end prints and reads back.
cadenza-syntax = { path = "../cadenza-syntax" }
# The shared corpus grade compare (`--grade` mode) — decode a test-run.ast + grade an outcome, identical
# to the rust backend's `cdz-rust-run`, so the compare lives in one crate both exec bins depend on.
cdz-corpus-grade = { path = "../cdz-corpus-grade" }
# The compile-boundary codec (seq-284 binary-AST): `decode_result_types` reads the component's
# `cdz-result-type` section into a full-fidelity type `Arenas` per boundary export, which render.rs WALKS
# to disambiguate a WIT-erased leaf's value-form (Bytes `b"…"` vs `list<u8>` `#list`, Symbol `#"…"`, Set vs
# List, …). The `Arenas`/`Builder`/`Struct` types are `cadenza_syntax::ast::*` (a re-export of `cadenza_ast`),
# so no direct cadenza-ast dep is needed — only the codec entry point.
cadenza-compile-abi = { path = "../cadenza-compile-abi" }

[dev-dependencies]
# TEST-ONLY: assemble a tiny hand-written `.wat` module (e.g. an infinite `(loop br 0)`) to bytes, to
# verify the epoch deadline traps a runaway run. Not a runtime dep — wasmtime runs finished bytes; only
# the test needs to author them. `wat` is the reference text→wasm assembler (same family as wasmtime).
wat = "1"
