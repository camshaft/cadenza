# cdz-http-gateway — the standalone HTTP outpost (design/DESIGN-http-outpost.md).
#
# An inbound HTTP/WebSocket edge served by content-addressed wasm handlers: the native edge turns each
# request into a platform event; a wasm reducer folds an `http-request` and answers with an
# `http-response`. Decoupled from the still-unsettled core platform (design §0.1) — it depends only on the
# frozen reducer WIT world + the public in-memory stores in `cdz-platform`, plus `cadenza-ast` for the
# value-form codec. Built + iterated NOW, ahead of the core kernel; the real kernel satisfies the same
# seam later (P5) with no handler change.
#
# STANDALONE `[workspace]` — deliberately EXCLUDED from the seed workspace (root Cargo.toml `exclude`),
# like cdz-smith / cdz-cad / cdz-runtime. Reason: a later increment (P1b) depends on `cdz-platform` with
# `features = ["host"]`, which pulls the heavy wasmtime runtime; as a workspace MEMBER, cargo
# feature-unification would turn `cdz-platform/host` ON for the whole seed `--workspace` build, so the
# routine build/corpus-gate would pay for wasmtime. An own `[workspace]` keeps that heavy build isolated
# to this crate's own gate. An excluded crate may still path-depend on a member (cdz-smith precedent).
[workspace]

[package]
name = "cdz-http-gateway"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# The wasmtime-backed handler store (src/wasm.rs): reuse cdz-platform's `host` feature (WasmProgramStore +
# the wasmtime engine driving the reducer WIT world) to instantiate a real content-addressed wasm handler
# per request. OFF by default so the core spine (codec/gateway/runner/edge) build stays wasmtime-free and
# fast; the `cdz-http-gateway` nix check builds BOTH default and `--features host`. `dep:wasmtime` is here
# only to NAME `wasmtime::Error` in the `wasm_store` return type (the engine itself comes via
# cdz-platform/host, so this adds no new lock entry beyond what host already pulls).
host = ["cdz-platform/host", "dep:wasmtime"]

[dependencies]
# The canonical language AST + value-model codec. The `http-request`/`http-response` payloads that cross to
# a handler are `cadenza-ast` value-form documents (design §5, the one-codec-everywhere rule), so the
# gateway's request/response codec is built directly on `cadenza_ast::{ast, codec}` — the same forms the
# compiler's own `Value.encode`/`Value.decode` produce, so a value the gateway emits is decodable by a
# Cadenza guest and vice versa.
cadenza-ast = { path = "../cadenza-ast" }
# Every byte buffer is `bytes::Bytes` (spec §12) — the request/response `body` and the encoded payloads.
bytes = "1"
# The platform's reducer contract: the `ProgramStore`/`Reducer` traits + `SpawnContext`/`Message`/`Outcome`/
# the typed `*Id`s the runner drives (design §0.1 — the gateway reuses the platform as a library). DEFAULT
# features only: this is the light trait/types layer (blake3/bytes/async-trait/tokio/cadenza-ast) — NOT the
# heavy `host` (wasmtime) feature, which a later slice adds for the concrete `WasmProgramStore`. Keeping
# `host` off here is exactly why this crate is a standalone `[workspace]` (see Cargo comment / root exclude).
cdz-platform = { path = "../cdz-platform" }
# The SHARED HTTP CAS client (vertical v-cas-http): `HttpBlobStore` IS a `cdz_platform::BlobStore` over an
# HTTP content-addressed store (base62 keys, digest-verified on 200), so the gateway fetches programs + deps
# by hash from the control-server-supplied CAS URL. Excluded→excluded path-dep (it deps cdz-platform DEFAULT
# features — no host/wasmtime). Replaces the crate's former hand-rolled `HttpCas` (one client, one wire);
# transport moves to reqwest+ring internally in a later v-cas-http slice with NO change to this call site.
cdz-cas-http = { path = "../cdz-cas-http" }
# The SHARED control-plane wire contract (vertical v-gateway-conformance): the `ControlConfig`/`ControlUp`/
# `ControlDown` binary-AST frames the gateway exchanges with the control server over its persistent link,
# plus the `value` codec toolkit. The gateway CONSUMES these frames (dials control, applies the config it
# ships) rather than defining its own copy — one wire, shared with the conformance harness + mock control
# server. Excluded→excluded path-dep (light: cadenza-ast + bytes + cdz-str, no heavy deps).
cdz-http-protocol = { path = "../cdz-http-protocol" }
# The native HTTP edge (P1c-2, src/edge.rs): a hyper HTTP/1 server. hyper is runtime-agnostic (driven via
# hyper-util's TokioIo); http-body-util supplies the `Full` response body + `BodyExt::collect` for the
# request body; tokio is the async runtime (net for the listener, rt to spawn a task per connection).
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync"] }
# `server`/`http1` back the native edge; `client` is unioned by the dev-deps line for the test HTTP clients
# (the live-socket e2e tests dial the edge). The HTTP CAS client now lives in the shared `cdz-cas-http` crate
# (its own hyper dep), not here — this crate no longer dials out on its own in non-test code.
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# WebSocket endpoints (P4, design §6): the handshake key derivation (`derive_accept_key`) + the framing
# (`WebSocketStream` over the upgraded connection). `default-features = false` — no TLS/connect; the gateway
# only serves an already-upgraded server socket, not dials out.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# Stream/Sink combinators (`StreamExt::next`, `SinkExt::send`) to pump the ws frame loop over the
# `WebSocketStream` (a Stream + Sink of ws messages).
futures-util = { version = "0.3", default-features = false }
# Only to NAME `wasmtime::Error` in wasm_store's return type; behind the `host` feature (the engine comes
# via cdz-platform/host). Matches the workspace's wasmtime (cdz-platform/cdz-run/rcdzc) so no new lock line.
wasmtime = { version = "37", default-features = false, optional = true }
# `#[async_trait]` for the crate's own async traits (the effect resolver's `EffectResolver`/`ControlSink`,
# the ws session, and the native-reducer test doubles that impl `cdz_platform`'s async `Reducer`/`BlobStore`).
async-trait = "0.1"

[dev-dependencies]
# The native test `ProgramStore` (`cdz_platform::testing::program::Store`) + a Rust `Reducer` let the
# runner/gateway be exercised WITHOUT wasmtime or a compiled Cadenza guest.
cdz-platform = { path = "../cdz-platform", features = ["testing"] }
# `async-trait` to impl the platform's `#[async_trait] Reducer` for the test handlers.
async-trait = "0.1"
# The `client` feature (unioned onto the dep above) + `Empty` body for the live-socket e2e test's HTTP client.
hyper = { version = "1", features = ["client"] }

# The deployable binary — serves a deployment dir (route-table.bin + *.wasm components) over HTTP. Behind
# the `host` feature (it drives the wasmtime handler store), so a default build never pulls wasmtime.
[[bin]]
name = "cdz-http-gateway"
path = "src/bin/cdz-http-gateway.rs"
required-features = ["host"]

# The deploy-baking tool: compute a compiled component's ProgramHash so the deploy step can bake real
# handler hashes into the (baked-table) router source before `cdz compile`. NO `host` feature — it only
# hashes bytes (`ProgramHash::of`), so it stays in the light build (no wasmtime).
[[bin]]
name = "cdz-http-programhash"
path = "src/bin/cdz-http-programhash.rs"
