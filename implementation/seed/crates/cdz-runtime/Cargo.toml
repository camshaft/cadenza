# cdz-runtime — the Cadenza value-heap runtime, compiled to a self-contained wasm core module
# and EMBEDDED (as checked-in bytes) into every compound-returning component the seed emits (M2).
#
# It owns all of linear memory: a bump/free-list heap of reference-counted, immutable, acyclic
# value objects (tuple/record/sum/list/bytes/str/int/bool/float), constructors that build them,
# and a `render` that walks a value to its canonical s-expression text. The seed-generated PROGRAM
# module holds only opaque i32 handles and calls into this runtime by index — it never touches
# memory itself. Authored in Rust for maintainability; to be re-authored in Cadenza at M8/M9
# self-hosting (see the plan / [[rc-heap-persistent-ds-sota-2026-07-05]]).
#
# Built separately for wasm32-unknown-unknown (like cdz-compiler-component); NOT in the native
# workspace. `cargo build --release --target wasm32-unknown-unknown -p cdz-runtime` → a core
# module whose exports the seed's envelope links against.
# Standalone (own workspace) so the native `cargo build` of the seed toolchain ignores it — it
# only ever builds for wasm32-unknown-unknown, like cdz-compiler-component.
[workspace]

[package]
name = "cdz-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Compile the live-object counter (the `live-objects` export's real value) into the wasm build.
# OFF by default so the shipped runtime is zero-cost and byte-stable; a leak-check harness turns it
# on to verify the compiler's Perceus dup/drop discipline (assert live-objects() == 0 after a run).
debug-counters = []
# The rc-trace leak-attribution DRAIN EXPORT (the `debug-trace` WIT interface, world `runtime-debug`).
# IMPLIES `debug-counters` (the export drains the instrumentation buffer that feature compiles in). Kept
# SEPARATE from `debug-counters` so the plain debug-counters runtime — the leak-check gate's runtime,
# built with the DEFAULT `world = runtime` (heap only) by xtask codegen + the flake — stays world-runtime
# and UNBROKEN (its bindings carry no `debug-trace` trait, so the cfg'd-out export raises no E0433). The
# rc-trace variant (this feature ON, targeting `world = runtime-debug`) is built ONLY by the nix flake for
# `cdz-run --rc-trace`, carrying its own RC_TRACE_RUNTIME_HASH; that world-targeting lives in the BUILD
# layer (nix), never a dev-tree Cargo.toml mutation (v-xtask-decompose: seq-202 keep-xtask-tiny + the
# SIGKILL orphan hazard a drop-guard cannot cover).
rc-trace-export = ["debug-counters"]

[lints.rust]
# cdz-runtime `#[path]`-includes cadenza-ast's source (the shared codec core, mechanism B). Those files
# carry `#[cfg(feature = "std")]` gates for cadenza-ast's OWN std build, but cdz-runtime declares no `std`
# feature (it only ever compiles the no_std core), so check-cfg would flag `feature = "std"` as an
# unexpected cfg value across the included spans. Declare it a KNOWN (never-enabled here) value so the
# include stays warning-clean, without silencing genuinely-unknown cfgs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("std"))'] }

[dependencies]
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }

# BLAKE3 for the `hash-blake3` heap op (idx 91) — the runtime half of the compiler's `Blake3.of`
# primitive (DESIGN-compiler-primitives.md P3a). `default-features = false` keeps it wasm-friendly
# (no `rayon`/`mmap`/CLI features) and drops `std` so the pure portable digest builds cleanly for
# wasm32-unknown-unknown; it still uses the crate's `alloc` API. The SAME crate computes the
# compile-time fold in rcdzc, so both places produce byte-identical digests (the design's §9 invariant).
blake3 = { version = "1.8", default-features = false }

# The shared canonical cadenza-AST binary codec (ast value model + Builder + codec::encode/decode +
# leb128) — the SAME source the compiler (rcdzc) uses, so the runtime's `ast-encode`/`ast-decode` ops
# (93/94) serialize BYTE-IDENTICALLY to the compile-time `Ast.encode` fold. `default-features = false`
# takes cadenza-ast's `no_std` + `alloc` CORE ONLY (its `std` default gates num-bigint/unicode-
# normalization — the #459 num-bigint hazard that must never enter this frozen-hash wasm). Replaces the
# former `#[path]`-into-cadenza-ast/src source-include (operator seq-273); under lto + codegen-units=1
# the crate boundary is erased, so the emitted wasm stays byte-reproducible (hash re-recorded once).
cadenza-ast = { path = "../cadenza-ast", default-features = false }

# The embedded wasm allocator (see src/allocator.rs) — the runtime ships its own allocator. Gated to
# wasm only: native `cargo test` uses the system allocator, so the Handle-typed core stays testable
# natively without pulling talc in. Swappable in one file — the heap core never references it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "5"

[package.metadata.component]
package = "cadenza:runtime"

[package.metadata.component.target]
path = "wit"
world = "runtime"

# The runtime's world imports `cadenza:nfc/normalize` (FINDING#23 — NFC is the runtime's component dependency).
# Point cargo-component's WIT resolution at the NFC package's authoritative WIT (the sibling cdz-nfc crate), so
# the import types without a hand-maintained `wit/deps` copy that could drift.
[package.metadata.component.target.dependencies]
"cadenza:nfc" = { path = "../cdz-nfc/wit" }

[profile.release]
# Small, deterministic output: no unwinding, size-optimized, single codegen unit.
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
bolero = "0.13.4"
# The differential oracle for the hand-written `bigint.rs` limb library (native tests only — NOT a
# runtime dependency, so the shipped wasm bytes / content hash are unaffected). Analogue of the
# CHAMP-vs-BTreeMap reference oracle.
num-bigint = "0.4"
num-traits = "0.2"
