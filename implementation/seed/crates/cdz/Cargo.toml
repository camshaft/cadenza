# cdz — the unified Cadenza command-line tool.
#
# ONE binary over the sub-libraries: `cadenza-syntax` (front-end: convert + the structural codemod)
# and `rcdzc` (the compiler: compile/emit + the sidecar query engine). Because it holds both libraries
# IN ONE PROCESS, it does what neither cross-process CLI could: parse a program keeping its SpanTable,
# drive a compiler query, and map result node ids back to `file:line:col` — and, since both libraries
# share the byte-identical `StructId` space, combine a structural selector with a semantic (type)
# query. This is the host boundary the frozen build-tool contract describes (reader + printer + display
# + derivation + query, one tool); the pure `rcdzc` lib is untouched, so its self-host portability holds.
#
# `cdz-run` stays a SEPARATE bin: it pulls in wasmtime + the runtime store (a different concern), so it
# is not rolled in here.
[package]
name = "cdz"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "cdz"
path = "src/main.rs"

[dependencies]
# The Cedar surface (`cdz convert --from/--to cedar`) rides the `cadenza-syntax/cedar` feature — but that
# feature is NOT activated unconditionally here. WHY: cargo FEATURE UNIFICATION would then compile the
# heavy `cedar-policy` tree (→ stacker/psm/chrono/lalrpop) into EVERY workspace crate that links
# `cadenza-syntax` (rcdzc, cdz-run, cdz-corpus, …) AND into `seedCompiler` (its `cdz --no-default-features`
# build), a top cache-thrash source even though the compiler never needs cedar. Instead cedar is a `cdz`
# FEATURE (`cedar` below, in `default`): a normal/dev/packaged `cdz` still gets `cdz convert cedar`, but a
# `--no-default-features` build (seedCompiler + its huge downstream fanout) SHEDS `cedar-policy` entirely.
# (End state: the cedar convert surface moves to the external `cdz-syntax` bin — off the core `cdz`.)
cadenza-syntax = { path = "../cadenza-syntax" }
# Arbitrary-precision integer for building `cadenza-syntax` `Leaf::Int` nodes — used by the
# `delegate-compile` path to construct the sidecar QUERY request as a binary-AST value (a `(query
# type-at <node>)` tree) via the front-end's Builder, byte-identical to `rcdzc::sidecar::encode`. Same
# `num-bigint` version cadenza-syntax's `Leaf::Int { value: BigInt }` uses (already in the workspace lock).
num-bigint = "0.4"
rcdzc = { path = "../rcdzc" }
# The compile-BOUNDARY contract types (`Target`, `OptLevel`, the kinded `Artifact`, the sidecar
# `Request`/`Query` + its `encode`/`decode` codec + `KIND_*` result kinds, `CompileOutput`) — the wire
# vocabulary `cdz` and `rcdzc` agree on across the compiler seam (the `cadenza-ast` analogue for the
# compile boundary). `cdz` depends on it DIRECTLY so a `!standalone` build can speak the boundary WITHOUT
# linking `rcdzc` (the delegate path builds the sidecar request + reads the result from these shared
# types). Already in `cdz`'s closure transitively via `rcdzc`, so this direct edge is closure-NEUTRAL
# (verified with `nix eval .#checks.<sys>.crate-closure-assert`); the rcdzc-optional flip lands later.
cadenza-compile-abi = { path = "../cadenza-compile-abi" }
# The Rust-backend boundary-value render (shared with the corpus gate) — `cdz run-rust` compiles a
# program `--target rust`, runs it, and renders the result to the SAME canonical s-expr the wasm oracle
# prints, so the fuzzer's rust-vs-wasm differential compares like-for-like. Pure/dep-free.
cdz-rust-render = { path = "../cdz-rust-render" }
# The wasm-component runner, mounted as `cdz run` — one binary on the PATH instead of a separate
# `cdz-run`. Pulls in wasmtime + the runtime store; that weight is the price of the one-binary story.
cdz-run = { path = "../cdz-run" }
# The corpus reader/migrator, mounted as `cdz corpus <records|migrate|check>` — the maintenance tool
# for the executable-semantics corpus, folded in so it needn't be a separate binary on the PATH. OPTIONAL
# behind the `corpus` feature (in `default`): the `cdz test` runner path is corpus-INDEPENDENT (cdz_corpus
# is referenced ONLY by the `corpus` subcommand — main.rs:172/532), so the compiler-ml spine gate's
# test-runner cdz builds WITHOUT `corpus` (`--no-default-features` + the features it needs), which drops
# cdz-corpus from that build's closure. That breaks the seedCompiler→corpus edge so a corpus-only MR no
# longer needlessly re-runs the ~28min spine (v-nix's over-trigger fix); a Core/rcdzc MR still busts it.
cdz-corpus = { path = "../cdz-corpus", optional = true }
# `cdz calc` (the calculator REPL) is a PASSTHROUGH to the standalone `cdz-calc` binary (exec-not-link, like
# `cdz run`/`smith`/`cad`), NOT a linked dep — because `cdz-calc` pulls `cdz-run` (→ wasmtime) in-process to
# run compiled exprs, and the thin-`cdz` goal keeps that runner weight off `cdz`'s graph. So there is no
# `cdz-calc` dependency here; `cdz calc` forwards argv to the `cdz-calc` bin on PATH. (Engine owned by v-guide-infra.)
clap = { version = "4", features = ["derive"] }
# Generate shell completion scripts (`cdz completions <shell>`) from the clap command tree — the
# standard cargo-parity way (`clap_complete::generate`), so the completions never drift from the actual
# subcommands/flags. Codegen only; no runtime cost on any other path.
clap_complete = { version = "4", optional = true }
# The property-testing generator engine for `cdz test`: `bolero-generator` produces values from a seeded
# driver (`driver::Rng`) — reproducible + shrinkable — used as a LIBRARY (not the `check!` cargo-test
# harness), so `cdz test` loops trials itself. (The old seed-vs-bolero lockfile conflict the cdz-smith
# comment cites is STALE: modern `proc-macro-crate` pulls `toml_edit 0.20` as a build-dep major that
# coexists with the front-end's `toml_edit 0.22`, both sharing one `toml_datetime` — no clash.)
bolero-generator = "0.13"
# The seeded RNG that drives bolero's `driver::Rng` — a reproducible stream from `cdz test --seed N`.
# Versions matched to what `bolero-generator` itself resolves (`rand_core 0.9` / `rand_xoshiro 0.7`), so
# the `TryRngCore` the driver bounds on is the SAME trait our RNG implements (one `rand_core` in the lock).
rand_core = "0.9"
rand_xoshiro = "0.7"
# The LSP server (`cdz lsp`) — a synchronous stdio Language Server built on rust-analyzer's own
# transport crates (NO async runtime): `lsp-server` frames JSON-RPC over stdio, `lsp-types` is the
# protocol's typed messages. The server holds each open document in memory and re-runs the SAME
# in-process query logic the one-shot `cdz check`/`type-at`/… subcommands use — the one-binary design
# (both libraries + spans in one process) is exactly what a persistent server needs. `serde_json` is
# the wire codec for the LSP params (already transitively in the tree).
lsp-server = { version = "0.9", optional = true }
lsp-types = { version = "0.97", optional = true }
serde = "1"
serde_json = "1"
# Cross-platform filesystem watching for `cdz watch` (the cargo-watch analogue): re-run
# `check`/`test`/`build` when a project source changes. `notify` is the standard FS-watch crate
# (inotify/FSEvents/kqueue), the same choice cargo-watch makes. DEV-CLI ONLY — it lives on the `cdz`
# binary, NEVER in the frozen `cdz-runtime` dep set (whose hash determinism a new crate would break).
notify = { version = "6", optional = true }
# The trace SINK for the one-binary CLI: rcdzc's lib emits rich `trace!` events (lower/eval/resolve
# decisions) but a bin must INSTALL a subscriber for them to fire. `cdz` is the user-facing entry (NOT
# an internal `cargo xtask` pipeline stage), so it gates on the shared `RUST_LOG` — the standard knob a
# user/agent reaches for (`RUST_LOG=rcdzc=trace cdz compile …`). With `RUST_LOG` unset, nothing is
# installed and every `trace!` compiles to a runtime no-op — a normal run pays nothing. (rcdzc's OWN bin
# uses the tool-private `CDZ_LOG` to avoid fan-out inside the piped pipeline; `cdz` isn't in that pipe.)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
# `corpus` (in `default`) mounts the `cdz corpus` subcommand (the cdz-corpus reader/migrator). Split out
# as a feature so the compiler-ml SPINE GATE's test-runner cdz can build WITHOUT it
# (`--no-default-features --features <the rest>`, or the flake selecting a corpus-free feature set): the
# `cdz test` path is corpus-INDEPENDENT (cdz_corpus is referenced only by the `corpus` subcommand), so
# dropping it removes cdz-corpus from that build's closure and breaks the seedCompiler→corpus dep edge —
# a corpus-only MR no longer needlessly re-runs the ~28min spine. A normal `cdz` keeps `corpus` (default).
default = ["corpus", "standalone", "lsp", "watch", "completions"]
corpus = ["dep:cdz-corpus"]
# `lsp` (ON by default) mounts the `cdz lsp` stdio Language Server (its whole impl is `mod lsp`, the sole
# user of `lsp-server`/`lsp-types`). `watch` (ON by default) mounts `cdz watch` (the sole user of `notify`,
# → mio/inotify/filetime). Split out as cdz features — same rationale as `cedar` — so a `--no-default-features`
# build (seedCompiler, which only drives rewrite/convert/compile at eval and NEVER runs an editor server or a
# file-watcher) SHEDS lsp-server + lsp-types + notify's whole tree, keeping them out of the seed's huge
# downstream fanout. A normal/dev/packaged `cdz` keeps both (default), so `cdz lsp`/`cdz watch` are unchanged.
lsp = ["dep:lsp-server", "dep:lsp-types"]
watch = ["dep:notify"]
# `completions` (ON by default) mounts `cdz completions <shell>` (the sole user of `clap_complete`). Gated
# so a `--no-default-features` seedCompiler build — which never generates shell completions — sheds it.
completions = ["dep:clap_complete"]
# `cedar` (OFF by default — operator ruling 2026-08-28: "we shouldn't need to default with cedar on, it's
# not getting us anything right now") activates the `cadenza-syntax` Cedar convert surface (`cdz convert
# --from/--to cedar`). Behind an OPT-IN cdz feature so the heavy `cedar-policy` tree (→ stacker/psm/chrono/
# lalrpop) stays out of EVERY routine/dev/gate/seed build that cargo feature-unification would otherwise
# drag it through — `cedar-policy` compiles ONLY when something explicitly asks for `cdz --features cedar`.
# The packaged/nix `cdz` does NOT enable it (v-nix confirmed); `cdz convert cedar` for end-users moves to
# the external `cdz-syntax` bin (S5, `design/DESIGN-cdz-plugin-dispatch.md`). Bare-cargo dev needing cedar
# convert builds with `--features cedar`.
cedar = ["cadenza-syntax/cedar"]
# `standalone` (ON by default) BUNDLES the compiler in-process: `cdz` links `rcdzc` and compiles in this
# process, the self-contained behavior a plain `cargo build` / dev `cdz` wants (operator ruling 2026-08-25:
# "a standalone feature that pulls everything in and bundles it rather than delegates … enabled by default").
# With `standalone` OFF (`--no-default-features`, how the NIX build packages `cdz`), the compiler surface
# DELEGATES to the external `cdz-compile` process instead — so a compiler change need not rebuild `cdz` and
# the two cache/rebuild independently (`design/DESIGN-cdz-delegate-compile.md`). Behavior-identical either
# way (cdz-compile IS `rcdzc::cli::run`, fed the same artifacts/flags).
# INCREMENTAL: this slice inverts the `cdz compile`/`cdz build` path; the query/LSP/run/test surfaces still
# run in-process in BOTH configs (so `rcdzc` stays a NON-optional dep for now). A later slice delegates those
# too and flips `standalone = ["dep:rcdzc"]` + `rcdzc = { optional = true }`, at which point a `!standalone`
# build drops `rcdzc` from its closure entirely (the full caching win).
standalone = []
