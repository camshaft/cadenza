# rcdzc — the reference Cadenza → WebAssembly-component compiler, rebuilt to the reference
# architecture (spec/architecture/*.md, 2026-07-10).
#
# From-scratch Stage 0 (build-order.md §Stage 0): the columns substrate, a thin vertical slice
# through every nanopass rung (each a real, separate column producer — NOT fused), one scalar
# wasm backend hand-emitted against the frozen component ABI, and the single query entry that
# drives compilation as TWO programs (a subject + a query program, code-as-data).
#
# TWO operator directives shape the code:
#   1. COPY, DON'T DEPEND. The two-arena leaf-pool AST + binary codec are COPIED into this crate
#      (`ast.rs`, `codec.rs`, `leb128.rs`) rather than taken as a `cadenza-syntax` dependency —
#      because the compiler is destined to be ported to Cadenza itself, then verbatim-copied back
#      to Rust, and a shared external crate would break that round-trip. The copies carry ZERO
#      external dependencies: an integer literal is a plain (sign, big-endian magnitude bytes)
#      struct, not a bignum-library type — arbitrary precision with nothing to depend on (the AST
#      only CARRIES the value; arithmetic on it is a later compile-time-evaluation concern). The
#      NFC text-normalization dep stayed with the text reader, which Stage 0 does not copy.
#   2. CADENZA-IN-RUST STYLE. Written the way it would be written in Cadenza: plain sum types
#      matched exhaustively, arena indices instead of pointer graphs, columns keyed by node
#      identity. Deliberately un-idiomatic Rust so the later Cadenza port is mechanical.
#
# Validated by INTERNAL UNIT TESTS ONLY (no `cadenza-seed` dependency — that crate is reworked
# elsewhere): `cdz-run` runs the emitted component, `wasm-encoder` is the independent byte oracle.
# Neither enters the compile path (the byte path is hand-emitted so it ports to the self-host).
[package]
name = "rcdzc"
version = "0.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
# The PURE COMPILER CORE (lib) carries no VALUE dependencies — an integer literal is a plain
# (sign, magnitude bytes) struct, so nothing is pulled in for arbitrary precision, and the core
# ports cleanly to the Cadenza self-host.

[dependencies.blake3]
# The ONE exception to COPY-DON'T-DEPEND, waived by the operator (2026-08-25) specifically for blake3:
# the compile-time `Blake3.of` fold calls `blake3::hash` so its 32-byte digest is BYTE-IDENTICAL to the
# runtime `hash-blake3` heap op (idx 91), which uses the SAME crate (design-compiler-primitives §9 —
# same hash both places). BLAKE3 is a fixed algorithm, so the digest is version-independent. Same crate
# + version + no-default-features the runtime (`cdz-runtime`) uses, plain UNKEYED BLAKE3-256, no key /
# derive-key / domain tag (all domain separation is userspace, D7).
version = "1.8"
default-features = false

[dependencies.tracing]
# TRACE-LEVEL DECISION LOGGING. The query producers (resolve/infer/lower/eval) emit a `trace!` event
# at each decision — a name's resolution, a solved type, a fold outcome, a decline — so a debugging
# run sees exactly what the compiler chose and why. `trace!` is ZERO-COST when no subscriber is
# installed (the default), so the corpus gate and normal builds pay nothing; a subscriber is set up
# only at the HOST boundary (the CLI bin, tests). In the eventual Cadenza port these call sites map
# to a trace EFFECT — a structured event emitted to an ambient handler — so instrumenting with
# events (not the crate's span/subscriber internals threaded through logic) keeps the port clean.
version = "0.1"
default-features = false
features = ["std"]

[dependencies.clap]
# Used ONLY by the CLI bin (the host boundary — filesystem + args), never by the lib core. Same
# clap 4 + derive the workspace's xtask uses.
version = "4"
features = ["derive"]

[dependencies.tracing-subscriber]
# Installs the trace SINK — used ONLY at the host boundary (the CLI bin, and the test harness), never
# by the lib core. The bin turns on trace output from `CDZ_LOG` (a tool-private env var, NOT the shared
# `RUST_LOG` — so it doesn't fan out to cargo/wasmtime in the pipeline); the core just emits events.
# Env-filter lets a debugging run select `rcdzc=trace` without recompiling.
version = "0.3"
features = ["env-filter", "fmt"]

[dev-dependencies]
# The real front-end reader (TESTS ONLY — like wasm-encoder below, never in the compile
# path, so the "copy, don't depend" round-trip is preserved). Test fixtures read the s-expression
# surface with the SAME reader the corpus gate uses (`sexpr::read`, which desugars `a.b` → `(. a b)`)
# rather than a hand-rolled reader that would drift from it. The bridge is BYTES: `sexpr::read` → its
# `codec::encode` → rcdzc's `codec::decode` — so every test also EXERCISES that the copied `codec.rs`
# stays byte-identical to `cadenza-syntax` (the invariant the copy depends on), turning a silent
# assumption into a checked one.
cadenza-syntax = { path = "../cadenza-syntax" }
# The independent byte ORACLE (tests only): licenses the hand-emitted byte path by asserting it is
# byte-identical to the authoritative component-model encoder. NEVER in the compile path.
wasm-encoder = "0.239"
# The component/core validator (tests only): parses + type-checks a component to LOCALIZE a byte error
# (`Component::from_binary`'s error is opaque). Diagnoses the resource-linking envelope during R1/R2.
wasmparser = "0.239"
# The canonical component RUNNER (tests only) — composes the value-heap runtime and invokes an export,
# exactly as the desk/gate do. Used by the value-heap behavior tests to run a component that IMPORTS the
# runtime (the composed round-trip) without re-implementing composition in the test. It takes no
# compiler-crate dependency, so this dev-dep introduces no cycle and never enters the compile path.
cdz-run = { path = "../cdz-run" }
# The shared native runtime interface an emitted ASYNC module links against (`cdz_rt::CdzEnv`). A
# dev-dependency so `cargo test` builds its rlib into the target dir, where the Rust-async round-trip
# tests locate it to pass `rustc --extern cdz_rt=…`. Tests only — never in the compile path.
cdz-rt = { path = "../cdz-rt" }
# The bignum an emitted program links against (`cdz_num::Big`) — a dev-dependency so `cargo test` builds
# its rlib into the target dir, where the BigInt round-trip tests locate it to pass `rustc --extern
# cdz_num=…` (mirroring `cdz-rt`). Tests only — never in the compile path. `cdz-num` source-shares the
# runtime's bigint.rs, so this does NOT link the runtime; it's a plain host rlib of `Big`.
cdz-num = { path = "../cdz-num" }
