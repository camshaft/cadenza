# cdz-rust-run — the RUST-backend exec runner for the corpus, extracted from xtask.
#
# The dedicated home for "compile a Cadenza program's emitted Rust with rustc, run it, grade the outcome"
# (operator directive 2026-08-26: "make a dedicated crate for the rust runners; the xtask is just getting
# so bloated"). This is the Rust-target analogue of what `cdz-run` is for wasm — the exec phase of the
# corpus nix caching pipeline (`design/DESIGN-corpus-nix-per-case-caching.md`, gap #6 toward retiring the
# `xtask gate`). Built as a small standalone crate + bin the nix per-case rust exec layer shells out to
# (same pattern as `cdz-world-artifact` / `cdz-component-rewrite`), so a compiler change re-runs only what
# it must and xtask sheds ~1000 lines when its gate is deleted at cutover.
#
# Incremental: this first module is the PURE emitted-Rust SIGNATURE analysis (`sig`) — no process/rlib
# deps, fully unit-testable. Later increments add the driver generation, the rustc invocation (linking the
# pre-built cdz_rt/cdz_num/cadenza_ast rlibs), the run, and the grade (reusing the corpus grade logic).
#
# A ROOT workspace member (the `crates/*` glob) — MUST be registered in the flake's `rootWorkspaceCrates`
# for per-crate clippy + workspace-test coverage.
[package]
name = "cdz-rust-run"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "cdz-rust-run"
path = "src/main.rs"

[dependencies]
# The shared Rust-render helpers (identifier sanitize + call-arg / BigInt-arg marshalling) the rcdzc rust
# backend emits through; the driver's call-expression builder reuses them so a corpus arg crosses the
# native boundary exactly as the compiled fn's parameter type expects.
cdz-rust-render = { path = "../cdz-rust-render" }
# The shared corpus grade compare — decode a test-run.ast + grade an outcome, identical to the wasm
# backend's `cdz-run`, so the compare lives in one crate both exec bins depend on (the rust trial-runner
# is the only backend-specific piece). Dep-minimal (cadenza-syntax + anyhow), no wasmtime / no compiler.
cdz-corpus-grade = { path = "../cdz-corpus-grade" }
# Typed CLI with generated --help — the same parser the rest of the workspace uses.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# The canonical binary-AST -> surface renderer (`convert::render_binary`) — the ONE printer cdz-run's wasm
# value render also uses, so the rust value-doc render is byte-identical (op-seq-283: canonical path, not
# bespoke). Consumes the `(: value type)` codec doc the emitted rust guest produces. `cadenza-ast` gives the
# `Builder`/`codec` used to CONSTRUCT that doc (test + future emit). Both are cadenza-syntax's own transitive
# deps already (via cdz-corpus-grade), so no new closure; made direct to `use` them here.
cadenza-syntax = { path = "../cadenza-syntax" }
cadenza-ast = { path = "../cadenza-ast" }
