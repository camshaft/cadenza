# cdz-compiler — the reference Cadenza → WebAssembly-component compiler (`cdz-rustc`).
#
# PURE CORE: a function `ast_bytes → component_bytes`. NO wasmtime, NO std::fs, NO host
# assumptions — so this crate compiles to `wasm32` and can itself be wrapped as a component
# exporting `compile : list<u8> -> list<u8>`, the same ABI the Cadenza-authored compiler
# exports (memory: cdz-rustc-pure-core-wasm-targetable). The native host/CLI lives in the
# separate `cadenza-seed` crate.
[package]
name = "cdz-compiler"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "cdz_compiler"
path = "src/lib.rs"

[dependencies]
# Deterministic CBOR canonical binary-AST encoding (options/hashing-and-encoding/). This is
# the only dependency of the pure core; it is portable to wasm32.
ciborium = "0.2"
# Unicode NFC normalization for string literals (collections-and-text.md #String Equality
# Follows Normalized Contents). A pure, wasm-portable crate — the reader canonicalizes a
# string's contents on read so equality and length see one normalized form.
unicode-normalization = "0.1"
# OPTIONAL structured tracing of compilation DECISIONS (declines/rejects), for DEV-desk
# debugging (ask-50). Default OFF. The `trace` feature is NEVER enabled for the wasm-component
# build — that is a SEPARATE build graph (`crates/cdz-compiler-component`, workspace-EXCLUDED,
# built by its own `cargo component build`) that depends on this crate with no features, so
# Cargo's per-graph feature unification cannot leak `trace` into it. `component-check` byte-identity
# and the pure-core minimality are preserved; only the native `cadenza-seed --features trace` build
# turns it on. The `tracing` facade is wasm-safe, but the feature stays off there.
tracing = { version = "0.1", optional = true }

[features]
# `trace`: instrument the compiler's decision points (decline/reject helpers) with `tracing`
# events. Additive, default-off, native-only (see cadenza-seed's passthrough `trace` feature).
trace = ["dep:tracing"]
