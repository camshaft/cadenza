# cdz-reducer-guest — ONE generic reducer-world GUEST wrapper, parameterized per-target by a cargo feature
# (operator directive 2026-09-10, brief `v-reducer-targets-brief.md`: "no crate per wasm target … generate
# on the fly in the nix flake … they all export the same interface"). Each target decodes its request
# payload, runs its inner function, and returns the result as the guest's `close` reason. This crate holds
# the target HANDLERS (pure bytes-in/bytes-out, native-testable — B2); the wit-bindgen `guest` export + the
# wasm componentization are wired by the nix flake per-target (B3). Design: design/DESIGN-reducer-targets.md.
#
# A WORKSPACE MEMBER (native-gated by the standard workspace battery) for B2 — the handlers are pure Rust
# tested natively. B3 builds it to a wasm component per target (the standalone-lock / componentization work,
# mirroring rcdzc-wasm), where the crate-type gains `cdylib`.
[package]
name = "cdz-reducer-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# rlib for the native member build + its unit tests (B2); cdylib for the wasm component build (B3, via
# cargo-component). A native `cargo build --workspace` builds the rlib (+ a harmless native cdylib);
# `cargo component build --target wasm32-unknown-unknown` builds the reducer-world component.
crate-type = ["rlib", "cdylib"]

[features]
# Exactly one target feature is active per build (nix builds each with `--no-default-features --features
# target-<T>`); `default` is target-rcdzc for the native workspace member build + B2 tests. nix stamps N
# components from this one crate by selecting one target apiece (operator: "no crate per wasm target").
default = ["target-rcdzc"]
# The rcdzc compile target: a kinded-input bundle -> a wasm component + diagnostics envelope.
target-rcdzc = ["dep:rcdzc"]
# The sexpr parser target: s-expression source bytes -> canonical AST bytes + parse diagnostics.
target-sexpr = ["dep:cadenza-syntax"]
# The ml parser target: ML surface source bytes -> canonical AST bytes + (error-recovering) diagnostics.
target-ml = ["dep:cadenza-syntax"]

[dependencies]
# The wit-bindgen runtime the cargo-component-generated `src/bindings.rs` links against (the reducer-world
# `guest` export glue). Present for the native build too (harmless — the export shims are unused symbols).
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }
# The compile-boundary vocabulary: the kinded `Artifact`, the `{artifacts, diagnostics}` `CompileOutput`,
# the response envelope codec (`encode_compile_output`), and the `Target` enum.
cadenza-compile-abi = { path = "../cadenza-compile-abi" }
# The canonical binary-AST codec the request/response wires are built over.
cadenza-ast = { path = "../cadenza-ast" }
# The compiler — the rcdzc target's inner function (`rcdzc::compile`). `default-features = false` drops the
# host-CLI `validate-output` feature (`wasmparser`): a guest drives the library API, not the file-writing CLI.
rcdzc = { path = "../rcdzc", default-features = false, optional = true }
# The front-end reader — the sexpr/ml parser targets' inner function (`sexpr::read` / `parser::read_ml`).
# OPTIONAL: pulled in only by `target-sexpr`/`target-ml` (a build dep for those targets; also a dev-dep below
# so rcdzc_target's tests can bridge source->AST regardless of the active feature).
cadenza-syntax = { path = "../cadenza-syntax", optional = true }

[dev-dependencies]
# The front-end reader — TESTS ONLY (bridges source text -> AST bytes to build a compile request), exactly
# as rcdzc-wasm's tests do. Never a build-path dep: a guest receives AST bytes, not source.
cadenza-syntax = { path = "../cadenza-syntax" }

# cargo-component: this crate is a reducer-world GUEST component. Targets the platform reducer ABI's
# `pure-reducer-world` (the compute floor: only `run` imported) straight from cdz-platform's authoritative
# `world.wit` — single source of truth, no duplicated WIT. Built for wasm32-unknown-unknown (WASI-FREE:
# operator "i don't want wasi, no" — unknown-unknown's std OS layer is stubbed inline, so the component
# imports only the reducer world and instantiates on the platform's pure linker).
[package.metadata.component]
package = "cadenza:reducer-guest"

[package.metadata.component.target]
path = "../cdz-platform/wit"
world = "pure-reducer-world"

# NOTE: no `[profile.release]` here — cdz-reducer-guest is a workspace MEMBER, so cargo ignores a
# non-root-package profile (it uses the workspace root's release profile). The component builds + strips
# fine on the workspace profile; a member-local profile only emits a "profiles ignored" warning.
