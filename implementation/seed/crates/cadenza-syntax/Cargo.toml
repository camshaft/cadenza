# cadenza-syntax — the decoupled ML front-end library.
#
# Owns ALL front-end tooling: lexer, Pratt parser (parses straight to the arena AST), AST->text
# printer, the hand-rolled binary codec, and (later) code-transform tooling. The syntax is
# decoupled from the compiler: this crate owns the AST type and its encoding; a compiler merely
# consumes the two arenas. COMPLETELY STANDALONE — depends on no compiler crate, in any phase.
#
# This is a REFERENCE implementation; the front-end is destined to be rewritten in Cadenza itself.
# The durable artifacts are the CONTRACTS (AST shape, binary bytes, text grammar, span table,
# total decode), not this code. Keep it plain.
#
# A member of the seed workspace; standalone-ness is enforced by taking no compiler-crate
# dependency (not the workspace boundary).
[package]
name = "cadenza-syntax"
version = "0.1.0"
edition = "2024"

# Optional-surface FEATURES so a lean reducer/wasm build can shed the HEAVY optional surfaces (operator:
# compile cadenza-syntax to wasm for reducers). Boundary confirmed with v-syntax: gate ONLY `cedar` + `cli`;
# json/toml/markdown stay CORE. Why only these two: the ML core is HOMOICONIC — parser/printer embed json +
# toml as fenced sub-documents, so those surfaces MUST stay core (gating them would break embedded-block
# parsing, a real language feature); markdown is light (pure-Rust, only in the Format driver, not the ML
# embedding) so gating buys ~nothing. `cedar` is the ONLY heavy tree (cedar-policy → stacker/psm/chrono/
# lalrpop) and `cli` pulls clap — NEITHER is referenced by the ML-embedding core, so gating them sheds the
# big transitive tree cleanly. `default` = both on → every current dependent (rcdzc/cdz/cdz-wasm/cdz-corpus/
# cdz-calc/cdz-run/cdz-smith) is UNCHANGED. A `--no-default-features` build keeps full ML + embedded json/toml
# + markdown + query + doc surface, dropping only cedar-policy + clap.
[features]
# `cedar` is NO LONGER default — its heavy transitive tree (cedar-policy → stacker/psm/chrono/lalrpop)
# now lives in the `cadenza-syntax-cedar` crate, so a targeted build that does not enable this feature
# (a runner / reducer / grader) never compiles it. `cli` stays default. Consumers that need the Cedar
# CONVERSION surface (`cdz`, `cdz-wasm`) enable `cadenza-syntax/cedar` explicitly; every other consumer
# is now lean by default. (Feature-off, `convert(Format::Cedar)` returns a clean "not compiled" error.)
default = ["cli"]
# The Cedar authorization-policy surface — re-exported as `cadenza_syntax::cedar` from the split-out
# `cadenza-syntax-cedar` crate (which owns `cedar-policy`). Referenced by the Format driver (query.rs) +
# convert's Format enum only, NOT the ML-embedding core.
cedar = ["dep:cadenza-syntax-cedar"]
# The `cdz-syntax` command surface (`mod cli`) — the ONLY clap user; CLI-shaped, not reducer-relevant.
cli = ["dep:clap"]

[dependencies]
# The AST value model + canonical binary form, extracted to a shared bottom crate (so rcdzc + the
# agent-harness kernel depend on the same wire format). `cadenza-syntax` RE-EXPORTS what moved there
# (e.g. `cadenza_syntax::leb128`), keeping its public API byte-stable.
cadenza-ast = { path = "../cadenza-ast" }
# The dependency-light shared bottom (source spans + arena read-helpers), below every surface crate.
# `cadenza-syntax` re-exports its `span`/`spans`/`arena_read` so the public API + internal `crate::`
# paths stay byte-stable.
cadenza-syntax-core = { path = "../cadenza-syntax-core" }
# The JSON data surface, split into its own crate (hand-rolled, no external parser dep); re-exported as
# `cadenza_syntax::json`. Always on — the ML surface embeds `json{…}` sub-documents.
cadenza-syntax-json = { path = "../cadenza-syntax-json" }
unicode-normalization = "0.1.25" # NFC on string/name leaves
sha2 = "0.10"                    # schema-hash header over the arena type term
num-bigint = "0.4"               # arbitrary-precision Int and the Decimal significand
# The CommonMark event source for the `markdown` surface (blocks + inline + GFM tables). A
# REFERENCE-only convenience: like the rest of this crate, the markdown surface is destined to be
# rewritten in Cadenza, at which point the block/inline scanner is hand-rolled. The durable artifact
# is the `document` node vocabulary + round-trip, not this parser.
pulldown-cmark = { version = "0.13", default-features = false }
# The format-preserving TOML parser/encoder for the `toml` surface (the library Cargo uses to edit
# `Cargo.toml`). Same REFERENCE-only rationale as pulldown-cmark: the durable artifact is the
# decor-in-arena node vocabulary + byte-exact round-trip, not this parser. Split into its own crate
# (owns `toml_edit`); re-exported as `cadenza_syntax::toml_surface`. Always on (the ML surface embeds
# `toml{…}` sub-documents) — unlike cedar it is not feature-gated, but the dep now lives in that crate.
cadenza-syntax-toml = { path = "../cadenza-syntax-toml" }
# The Cedar policy parser + policy-syntax-tree (pst) for the `cedar` surface (AWS's authorization
# policy language). Same REFERENCE-only rationale as pulldown-cmark/toml_edit: the durable artifact is
# the `cedar-*` node vocabulary + round-trip, not this parser. We use only its syntax layer
# (PolicySet::from_str -> pst -> Display); NO evaluation/authorization engine is pulled into meaning.
# Enabled by the `cedar` feature; re-exported as `cadenza_syntax::cedar`. `cedar-policy` lives THERE now.
cadenza-syntax-cedar = { path = "../cadenza-syntax-cedar", optional = true }
# Used ONLY by the `cdz-syntax` bin for arg parsing; the library itself takes no CLI dependency.
clap = { version = "4", features = ["derive"], optional = true }
