# cadenza-syntax — the decoupled ML front-end library.
#
# Owns ALL front-end tooling: lexer, Pratt parser (parses straight to the arena AST), AST->text
# printer, the hand-rolled binary codec, and (later) code-transform tooling. The syntax is
# decoupled from the compiler: this crate owns the AST type and its encoding; a compiler merely
# consumes the two arenas. COMPLETELY STANDALONE — depends on no compiler crate, in any phase.
#
# This is a REFERENCE implementation; the front-end is destined to be rewritten in Cadenza itself.
# The durable artifacts are the CONTRACTS (AST shape, binary bytes, text grammar, span table,
# total decode), not this code. Keep it plain.
#
# A member of the seed workspace; standalone-ness is enforced by taking no compiler-crate
# dependency (not the workspace boundary).
[package]
name = "cadenza-syntax"
version = "0.1.0"
edition = "2024"

[dependencies]
unicode-normalization = "0.1.25" # NFC on string/name leaves
sha2 = "0.10"                    # schema-hash header over the arena type term
num-bigint = "0.4"               # arbitrary-precision Int and the Decimal significand
# The CommonMark event source for the `markdown` surface (blocks + inline + GFM tables). A
# REFERENCE-only convenience: like the rest of this crate, the markdown surface is destined to be
# rewritten in Cadenza, at which point the block/inline scanner is hand-rolled. The durable artifact
# is the `document` node vocabulary + round-trip, not this parser.
pulldown-cmark = { version = "0.13", default-features = false }
# The format-preserving TOML parser/encoder for the `toml` surface (the library Cargo uses to edit
# `Cargo.toml`). Same REFERENCE-only rationale as pulldown-cmark: the durable artifact is the
# decor-in-arena node vocabulary + byte-exact round-trip, not this parser. Lean feature set — only
# `parse`+`display` (serde/kstring/serde_spanned are off), so the transitive deps stay small.
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
# The Cedar policy parser + policy-syntax-tree (pst) for the `cedar` surface (AWS's authorization
# policy language). Same REFERENCE-only rationale as pulldown-cmark/toml_edit: the durable artifact is
# the `cedar-*` node vocabulary + round-trip, not this parser. We use only its syntax layer
# (PolicySet::from_str -> pst -> Display); NO evaluation/authorization engine is pulled into meaning.
cedar-policy = "4"
# Used ONLY by the `cdz-syntax` bin for arg parsing; the library itself takes no CLI dependency.
clap = { version = "4", features = ["derive"] }
