# A minimal wasm-COMPONENT reducer fixture (§19b/§21c interim, concierge Option A) — a wit-bindgen Rust
# guest that implements the `cadenza:agent-kernel` reducer world's `fold.apply` export. Compiled to a
# wasm32-unknown-unknown core module then lifted to a component (`wasm-tools component new`); the
# cdz-kernel tests load the resulting .wasm to drive ComponentReducer::apply end-to-end. Built for
# wasm32-unknown-unknown (NOT wasm32-wasip1) deliberately: a WASI target emits `wasi_snapshot_preview1`
# imports that `wasm-tools component new` can't resolve, breaking the lift (PR#1013 #5). DEPENDENCY-FREE
# (a Rust guest declares no content-addressed component deps), so it proves the host machinery + apply
# WITHOUT needing the §23 dep-resolution/compose — that's why it's the right first end-to-end fixture.
#
# Its OWN workspace (empty [workspace]) — NOT part of cdz-kernel's workspace: it builds for a different
# target (wasm32-unknown-unknown) with a cdylib crate-type, so cdz-kernel's native `cargo test` must
# never try to build it. A build step / CI job compiles it on demand + lifts it to a component.
[workspace]

[package]
name = "reducer-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.45"
# The guest speaks `cadenza-ast` DIRECTLY under the bytes fold boundary (DESIGN-binary-ast-abi §3d): it
# decodes the event document + encodes the effect-list document itself — needs cadenza-ast and nothing else.
cadenza-ast = { path = "../../../../cadenza-ast" }
