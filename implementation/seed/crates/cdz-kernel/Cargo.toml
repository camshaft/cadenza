# cdz-kernel — the v2 agent-harness KERNEL (from-scratch rebuild; design/agent-harness-kernel.md).
#
# A generic, minimal, if-this-then-that runtime: accept signed content-addressed events into an
# append-only per-session log, fold the current wasm reducer over each event, authorize the effects it
# requests, dispatch them, and fold the results back in. The kernel knows NOTHING about Cadenza,
# agents, or models — those are reducers + executors (see the design doc).
#
# v0.1 scope (design §15b): the correctness-critical spine — content-addressed log + persistent-map KV
# + the DURABLE effect-dispatch / correlation-token continuation loop (adversarial-review S1/S4) + a
# wasm-COMPONENT reducer (wasmtime is core — see below; the in-process Rust trait is the interim path) +
# a content-addressable blob store (CAS, §4/§21b). No PKI/mesh/multi-node (single hub, single operator).
#
# Its OWN workspace (empty `[workspace]` table), NOT a member of the seed workspace — the same
# isolation the old crates + cdz-cad use, so a plain `cargo build --workspace` / the corpus gate never
# pays for the kernel's (future) async/wasmtime tree. A dedicated CI job gates it.
[workspace]

[package]
name = "cdz-kernel"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# `live-exec` gates the ONE real side-effecting executor (ShellExecutor, which spawns a subprocess via
# std::process::Command). OFF by default so the default build/tests never spawn — the same discipline
# the old crate's CI used. CI must lint AND TEST `--features live-exec` (the failure mode is behavioral:
# a real exit code flows into the fold, so a clippy-only gate wouldn't catch a regression on it).
live-exec = []
# NOTE: wasmtime is NO LONGER feature-gated (was `wasm-reducer`). Per operator directive (2026-08-01):
# the kernel IS a reactive wasm runtime — wasmtime is the ENGINE, not an optional add-on. The earlier
# feature-gate imported cdz-run's "wasmtime is an edge-only dep" isolation, which is the wrong context
# for the kernel. wasmtime + the component host (wasm_host.rs) are now core. (Only `live-exec` stays
# gated — that's a real security/spawn gate, a different rationale.)

[dependencies]
# async-trait: object-safe async methods on the `AsyncReducer` trait (the cooperative-gas-yield migration,
# operator async directive). Native `async fn` in a trait is NOT dyn-compatible in stable Rust, but the
# kernel takes `&dyn` reducers and the host holds `Box<dyn Reducer>` — so the async reducer trait needs
# `async-trait`'s `Pin<Box<dyn Future>>` desugaring to stay object-safe. Used with `?Send` (the kernel is
# single-threaded / no-Send by design — a fold holds a non-Send wasmtime store), so the futures needn't be
# Send. Tiny proc-macro dep, already resolvable offline.
async-trait = "0.1"
# blake3: the ONE unified content-address algorithm for the whole kernel (operator directive 2026-08-08:
# settle on one hash — blake3 chosen for speed). `hash::Hash::of` is blake3, and the external on-disk
# component store (`component_store`) is now blake3-addressed too (its producers xtask/cdz-run/v-nix
# `componentStore` + `REQUIRED_RUNTIME_HASH` all migrated sha256->blake3), so kernel-internal durable state
# and the external store share one digest — no dual-hash boundary, no separate sha2 dep. Fast, no_std, stable.
blake3 = "1"
# bytes: ref-counted immutable byte buffer (operator perf directive 2026-08-02). Hot-path payloads /
# continuation tokens / KV values that get CLONED + shared but not mutated in place are `Bytes` so a
# clone is an O(1) refcount bump + slice, not a deep memcpy. `Bytes: From<Vec<u8>>` keeps build-then-
# freeze ergonomics (build a Vec, `.into()` it). Already in the tree (transitive via wasmtime), so no
# new dep floor. std String similarly moves to a UTF8-validated wrapper over Bytes where immutable.
bytes = "1"
# cadenza-ast — the shared, spec-pinned canonical binary codec (ast-encoding.md, header `cdzast\x00\x01`)
# that cadenza-syntax + rcdzc + this kernel all share (v-syntax extracted it as the bottom crate; §19a).
# The kernel encodes its log events THROUGH this ONE codec so the on-disk log is the language-native
# wire format, not a bespoke parallel encoding that drifts from the spec. A path dep across the workspace
# boundary (cdz-kernel is its own workspace); pulls cadenza-ast's tiny dep floor (num-bigint +
# unicode-normalization). `decode_detailed` gives the torn-vs-corrupt split the log recovery needs (§23).
cadenza-ast = { path = "../cadenza-ast" }
# num-bigint: to construct/read `cadenza_ast::ast::Leaf::Int { value: BigInt }` when mapping kernel
# events to the shared AST (event_ast.rs). Same major cadenza-ast pins (0.4), so Cargo unifies to one
# copy — no duplicate num-bigint in the tree.
num-bigint = "0.4"
# tracing — the structured-diagnostics FACADE for the kernel's drive loop (observability arc; v-ah-host
# owns the tracing-subscriber that actually records/exports). The kernel only EMITS spans/events via this
# facade and NEVER installs a subscriber — with no subscriber registered, every span/event is a cheap
# no-op (a relaxed atomic load), so this adds observability with zero behavior change + zero cost to a
# bare kernel. This IS a NEW (intentional) dep for the observability facade: wasmtime pulls the `log`
# facade, NOT `tracing` — they're different facades — so tracing (+ tracing-core / tracing-attributes)
# are new lock entries introduced here (#2169, lock-verified). A tiny facade crate (proc-macro +
# core), justified by the observability arc. Facade ONLY — tracing-subscriber stays out of the kernel.
tracing = "0.1"
# url — RFC-3986/WHATWG-compliant URL parser (Servo's) for host_of, which feeds HostIn capability authz
# (SEC-F1). Operator directive (2026-08-01): STOP hand-rolling the authority parser — a bespoke parser
# guarding an ALLOW-LIST is the worst place for edge-case bugs (every missed case was an authz BYPASS —
# Copilot PR#1015/1018 IPv6 literals). `url` parses IPv6/userinfo/ports/normalization correctly, so
# host_of just calls `.host_str()`; fail-closed is preserved (parse error / no host → deny).
url = "2"
# wasmtime — the CORE reactive-wasm engine (component host in wasm_host.rs binds wit/reducer.wit + runs
# reducer components). Same version + minimal feature set cdz-run uses (runtime + cranelift +
# component-model), so the whole tree agrees on one wasmtime. NOT optional — it's the kernel's engine.
wasmtime = { version = "37", default-features = false, features = ["runtime", "cranelift", "component-model", "async"] }

[dev-dependencies]
# `wat` (WebAssembly text → bytes) — authors tiny component fixtures in the wasm-host tests (the
# reference component-WAT assembler cdz-run uses). Dev-only + small.
wat = "1"
# tokio (current-thread only) — drives the async reducer tests (`AsyncComponentReducer::fold_async` is a
# real async wasmtime call that may yield on fuel, so it needs a real executor to poll to completion, not
# a one-shot poll). `rt` + `macros` = a single-threaded runtime + `#[tokio::test]`; NO multi-thread/net/fs
# features (the kernel is single-threaded / no-Send by design — matches the runtime we test under).
tokio = { version = "1", features = ["rt", "macros"] }
