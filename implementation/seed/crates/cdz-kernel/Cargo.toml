# cdz-kernel — the v2 agent-harness KERNEL (from-scratch rebuild; design/agent-harness-kernel.md).
#
# A generic, minimal, if-this-then-that runtime: accept signed content-addressed events into an
# append-only per-session log, fold the current wasm reducer over each event, authorize the effects it
# requests, dispatch them, and fold the results back in. The kernel knows NOTHING about Cadenza,
# agents, or models — those are reducers + executors (see the design doc).
#
# v0.1 scope (design §15b): the correctness-critical spine — content-addressed log + persistent-map KV
# + the DURABLE effect-dispatch / correlation-token continuation loop (adversarial-review S1/S4) + a
# wasm-COMPONENT reducer (wasmtime is core — see below; the in-process Rust trait is the interim path) +
# a content-addressable blob store (CAS, §4/§21b). No PKI/mesh/multi-node (single hub, single operator).
#
# Its OWN workspace (empty `[workspace]` table), NOT a member of the seed workspace — the same
# isolation the old crates + cdz-cad use, so a plain `cargo build --workspace` / the corpus gate never
# pays for the kernel's (future) async/wasmtime tree. A dedicated CI job gates it.
[workspace]

[package]
name = "cdz-kernel"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# `live-exec` gates the ONE real side-effecting executor (ShellExecutor, which spawns a subprocess via
# std::process::Command). OFF by default so the default build/tests never spawn — the same discipline
# the old crate's CI used. CI must lint AND TEST `--features live-exec` (the failure mode is behavioral:
# a real exit code flows into the fold, so a clippy-only gate wouldn't catch a regression on it).
live-exec = []
# NOTE: wasmtime is NO LONGER feature-gated (was `wasm-reducer`). Per operator directive (2026-08-01):
# the kernel IS a reactive wasm runtime — wasmtime is the ENGINE, not an optional add-on. The earlier
# feature-gate imported cdz-run's "wasmtime is an edge-only dep" isolation, which is the wrong context
# for the kernel. wasmtime + the component host (wasm_host.rs) are now core. (Only `live-exec` stays
# gated — that's a real security/spawn gate, a different rationale.)

[dependencies]
# blake3: content-addressing for events, KV nodes, and blobs. Fast, no_std-friendly, stable digest.
blake3 = "1"
# wasmtime — the CORE reactive-wasm engine (component host in wasm_host.rs binds wit/reducer.wit + runs
# reducer components). Same version + minimal feature set cdz-run uses (runtime + cranelift +
# component-model), so the whole tree agrees on one wasmtime. NOT optional — it's the kernel's engine.
wasmtime = { version = "37", default-features = false, features = ["runtime", "cranelift", "component-model"] }

[dev-dependencies]
# `wat` (WebAssembly text → bytes) — authors tiny component fixtures in the wasm-host tests (the
# reference component-WAT assembler cdz-run uses). Dev-only + small.
wat = "1"
