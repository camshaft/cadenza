# cadenza-seed — the native host and CLI for the seed toolchain.
#
# Depends on the pure `cdz-compiler` core for compilation, and adds the parts that need a
# native host: running finished components (wasmtime), reading the corpus and program files
# (filesystem), and driving the gates. wasmtime and the filesystem live ONLY here — never in
# the compiler core — so the core stays wasm-targetable (memory: cdz-rustc-pure-core-wasm-targetable).
[package]
name = "cadenza-seed"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "cadenza-seed"
path = "src/main.rs"

[dependencies]
rcdzc = { path = "../rcdzc" }
# SHA-256 content addressing of components (options/hashing-and-encoding/).
sha2 = "0.10"
# The embeddable component-model runtime — RUN a finished component in-process and validate
# it as an out-of-band oracle (options/execution-model/; wasmtime CLI is not used).
wasmtime = { version = "37", default-features = false, features = ["runtime", "cranelift", "component-model"] }
anyhow = "1"
# OPTIONAL trace subscriber (ask-50), native-only, default OFF. Renders the compiler's
# decline/reject/pass events (from `cdz-compiler`'s `trace` feature) to STDERR, env-filtered by
# `CADENZA_TRACE`. STDERR + default-off is load-bearing: the harness reads the compiler's output from
# STDOUT (ask-44/47 were stray-output regressions on that path), so a plain build/gate run stays
# byte-identical and `2>/dev/null` recovers today's stdout exactly.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "env-filter"] }

[features]
# `trace`: turn on compilation-decision tracing — enables `cdz-compiler`'s `trace` feature and pulls
# in the native subscriber. Additive, default-off; the wasm-component build never sees this feature.
trace = ["dep:tracing", "dep:tracing-subscriber"]
