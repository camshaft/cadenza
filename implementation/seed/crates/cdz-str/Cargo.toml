# cdz-str — `Str`, the cheaply-clonable `Bytes`-backed UTF-8 string used across the fleet
# (`design/cadenza-platform.md` §12).
#
# Extracted out of `cdz-platform` (2026-09-10) so `Str` — the canonical text type — can be used by any crate
# WITHOUT pulling the whole platform runtime. `cdz-platform` re-exports it (`pub use cdz_str::Str`), so every
# existing `cdz_platform::Str` user is unaffected. A ROOT workspace member (foundational leaf, like
# `cadenza-ast`): it deps only `bytes`, so it is free to sit in everyone's dep graph.
[package]
name = "cdz-str"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# OPTIONAL serde support: `Str` (de)serializes as a plain string. OFF by default, so `cdz-str`'s default
# build — and every seed/compiler build (cdz-str is a foundational leaf, NOT in rcdzc's closure) — stays
# serde-free. Only a host-side crate that wants derive-based ser/de (e.g. cdz-http-protocol via
# cadenza-ast-serde) opts in with `features = ["serde"]`; the compiler never enables it, so serde stays
# out of the compiler (operator 2026-09-12).
serde = ["dep:serde"]

[dependencies]
# `Str` is a newtype over `bytes::Bytes` — a clone is an O(1) refcount bump, and text/bytes share ONE
# representation so a value crosses the text/binary boundary without re-allocating (spec §12).
bytes = "1"
# OPTIONAL — only pulled in by the `serde` feature (off by default). `Str` serializes as a string.
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }
