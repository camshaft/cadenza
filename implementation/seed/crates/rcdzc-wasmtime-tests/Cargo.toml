# rcdzc-wasmtime-tests — the relocation home for rcdzc's wasmtime-driven behavior tests.
#
# Operator directive (2026-08-27): remove the `wasmtime` dev-dependency from the COMPILER crate
# (`rcdzc`) — cdz-run keeps wasmtime. rcdzc's ~1109 behavior tests that instantiate + run the emitted
# component under wasmtime (and the ComposedRuntime value-heap round-trips) do NOT belong in the
# language-neutral corpus (they assert Rust-side decode / opcode-shape / live-object counts, not
# surface behavior a corpus case can express). They RELOCATE here, unchanged, keeping their wasmtime
# driver — this crate is allowed to dev-dep wasmtime, rcdzc is not. rcdzc's compile pipeline is public
# (`rcdzc::compile_component`, `rcdzc::codec`, `rcdzc::ast`), so a test compiles a program via rcdzc
# and runs it under wasmtime exactly as the in-crate tests did; only the import paths change
# (`crate::` -> `rcdzc::`) and the shared helpers live in this crate's `common` module.
#
# A plain native workspace member (picked up by the root `crates/*` glob). Test-only: the lib is empty
# in a normal build (`#![cfg(test)]`), so `cargo build --workspace` + the corpus gate never pay for
# wasmtime here; only `cargo test`/`clippy --all-targets` build the tests, reusing the already-compiled
# wasmtime rlib. It takes no compile-path dependency on rcdzc (it path-deps rcdzc's lib for the public
# compile API), so it introduces no cycle into the compiler build.

[package]
name = "rcdzc-wasmtime-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
# The compiler under test — its PUBLIC compile surface (`compile_component`, `codec`, `ast`).
rcdzc = { path = "../rcdzc" }
# The front-end reader: source string -> arena -> bytes, the same bridge rcdzc's testkit used.
cadenza-syntax = { path = "../cadenza-syntax" }
# The canonical component RUNNER for value-heap round-trips (composes the runtime, invokes an export).
cdz-run = { path = "../cdz-run" }
# Runs the emitted component directly (the empty-linker scalar "run the artifact" behavior check).
wasmtime = { version = "37", default-features = false, features = ["runtime", "cranelift", "component-model"] }
# The independent byte ORACLE + component validator for emission-shape probes (count_opcode etc.).
wasm-encoder = "0.239"
wasmparser = "0.239"
# The native runtime interface / bignum the Rust-async + BigInt round-trip tests link against.
cdz-rt = { path = "../cdz-rt" }
cdz-num = { path = "../cdz-num" }
