# cdz-platform — the Cadenza platform (design/cadenza-platform.md).
#
# A single unified crate for the whole platform runtime (no host/kernel split — operator ruling
# 2026-08-20). Built bottom-up: the lowest-level primitives first so the higher-level shape (contracts,
# the reducer interface, the system reducer and dispatch) rests on a settled foundation. On the crate now:
# the content hash (the sole identity, §8), the value primitives (Str/Bytes, §12), the async blob and
# key-value backends (§8/§7), contracts (§1), the reducer interface and its event types (§3), and the
# handler-chain registry the system reducer routes through (§3/§4).
#
# A normal member of the seed workspace (picked up by the `crates/*` glob) so it gets per-crate clippy +
# workspace-test coverage for free while it is light. We depend on as little as possible (blake3 in the
# root lock, plus bytes/async-trait/tokio/futures); base64url rendering is hand-rolled and exhaustively
# tested rather than pulling in another crate. When a later slice adds the heavy wasm-runtime host
# (wasmtime), that slice moves this to its own excluded `[workspace]` (a deliberate topology change,
# coordinated with v-nix) so the corpus gate never pays for it.
[package]
name = "cdz-platform"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# Test-support: swappable pieces for exercising components in isolation, without the full system — a
# program store backed by registered Rust factories, and the reducer tasks running on bach (the
# deterministic simulator) instead of tokio. They live under the crate's `testing` module. On automatically
# under `cfg(test)`; enable this feature to reach them from another crate's tests. Enabling it pulls in bach
# because `rt` (the reducer-task executor) runs on bach whenever `cfg(any(test, feature = "testing"))`.
# None of it is part of the production surface.
testing = ["dep:bach"]
# The wasm-runtime host (§3): wasmtime instantiates a reducer component and drives it through the WIT world
# (wit/world.wit). Behind a feature and OFF by default, so the routine workspace build/gate and the flake's
# default per-crate closure never build the heavy runtime — only an explicit `--features host` build (and a
# dedicated CI job) does. wasmtime is already a workspace dependency (cdz-run/rcdzc), so this adds no new
# lock entries. Async, so a disk/network-backed host import never blocks the host thread (spec §3/§9).
host = ["dep:wasmtime", "dep:tikv-jemallocator"]

[dependencies]
# cadenza-ast is the LANGUAGE's canonical AST + type system (not the compiler) — the value model contracts
# are declared in and hashed over (spec §1/§12; operator ruling 2026-08-20 "use the canonical AST crate
# for all encoding and contract identification"). Depending on the language is right; only depending on the
# compiler (rcdzc) would be the coupling to avoid.
cadenza-ast = { path = "../cadenza-ast" }
# The content hash (§8) + the contract-id computation (§1), split into a dep-minimal crate so they can
# become a wasm component (operator 2026-08-23). The platform re-exports its `Hash`/`HashTag`/… and derives
# every `Contract`'s id through it, so the hashing + declaration encoding live in one place.
cdz-contract = { path = "../cdz-contract" }
# arbitrary-precision integer, matching cadenza-ast's value model (its `Leaf::Int` is a `BigInt`), so a
# contract value can carry a native Cadenza integer field (Int64/UInt64) rather than only opaque bytes.
num-bigint = "0.4"
blake3 = "1" # the one content-address digest (fleet-unified on blake3, operator 2026-08-08)
bytes = "1"  # every byte buffer is bytes::Bytes, never Vec<u8> (spec §12) — O(1) clone as it threads through
async-trait = "0.1" # dyn-safe async traits, so a store/kv backend is a swappable trait object (spec §8)
# tokio is the platform's async runtime (spec §9 shared async runtime). A main dep per operator directive
# 2026-08-20; the trait layers stay runtime-agnostic (await-only, no tokio primitives) so they also run
# under the Bach simulator in tests. Minimal features for now; the scheduler layer widens them later.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-core = "0.3" # the Stream trait, for the kv prefix-scan (a lazy stream, not a materialized Vec)
futures-util = "0.3" # stream helpers (stream::iter) to back a scan; StreamExt in tests
# Bach (Cameron's crate) — a discrete-event simulation runtime for deterministic async testing. It is the
# `rt` executor (spawn + channels) for the reducer tasks under `cfg(any(test, feature = "testing"))`, so it
# is an OPTIONAL normal dependency the `testing` feature enables (for another crate's tests). It is also a
# dev-dependency below, so this crate's own `cfg(test)` build always has it without the feature.
bach = { version = "0.1", optional = true }
# The wasm-runtime host, behind the `host` feature (above) — off by default. Matches the workspace's
# wasmtime (cdz-run/rcdzc): component-model to instantiate reducer components, cranelift to compile them,
# async so host imports never block the host thread.
wasmtime = { version = "37", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "async",
], optional = true }
# jemalloc as the global allocator for the integration-test EXECUTABLE only (behind `host`, off by default,
# so the routine workspace build/gate never pulls it — same gating as wasmtime). The itest binary drives a
# whole platform run + wasmtime + the bach observation log, which is allocation-heavy; jemalloc cuts its
# allocator overhead and fragmentation (operator suggestion 2026-08-23). Allocator choice is invisible to the
# observation log (seq/time/id are logical, address-independent), so it does not affect Bach determinism.
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
# Bach for this crate's own tests (cfg(test)): drives the reducer tasks + the runtime-agnostic store/kv
# futures in deterministic simulated time. (Also an optional normal dep above, for the `testing` feature.)
bach = "0.1"

# The platform integration-test executable: it takes opaque program-blob file paths, runs them through the
# platform under the bach simulator, and prints the observation log for a checker (design/cadenza-platform.md
# §9). It needs the `testing` utilities (the harness + observation log) and the `host` (the wasm program
# store that instantiates the blobs), so it is gated on both features — the routine light build pulls in
# neither the harness nor wasmtime; a `--features "testing host"` build (the nix host check) builds it.
[[bin]]
name = "cdz-platform-itest"
path = "src/bin/cdz-platform-itest.rs"
required-features = ["testing", "host"]

